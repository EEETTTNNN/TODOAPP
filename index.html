<!-- TODOAPP - Version 1.5.5 -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TODOAPP - v1.5.5</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <!-- Icône pour Chrome / Favoris Navigateur PC -->
  <link rel="icon" type="image/jpeg" href="appicon.jpg">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      background-color: #0f172a;
      overflow: hidden; 
      height: 100vh;
      margin: 0;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: max(0.5rem, env(safe-area-inset-top));
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    input, select, textarea { font-size: 16px !important; }

    #splash-screen {
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    #splash-screen.hidden-splash {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    @keyframes highlightPulse {
      0% { background-color: rgba(250, 204, 21, 0.6); transform: scale(1.02); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
      100% { background-color: transparent; transform: scale(1); box-shadow: none; }
    }
    .highlight-task { animation: highlightPulse 1.5s ease-out; z-index: 10; position: relative; }
    
    .drop-target-active { position: relative; }
    .drop-target-active::before {
      content: '';
      position: absolute;
      top: -4px; left: 0; right: 0; height: 4px;
      background-color: #6366f1;
      box-shadow: 0 0 10px #6366f1, 0 0 5px #6366f1;
      border-radius: 9999px; z-index: 50; pointer-events: none;
    }

    #category-tabs { cursor: pointer; user-select: none; }

    #viewport {
      width: 100%;
      height: calc(100vh - 140px);
      overflow: auto;
      position: relative;
      touch-action: pan-x pan-y;
      scrollbar-width: none; 
      -ms-overflow-style: none;
    }
    #viewport::-webkit-scrollbar { display: none; }

    #zoom-container {
      transform-origin: 0 0;
      will-change: transform, width;
      min-width: 100%;
      padding-bottom: 100px;
      transition: transform 0.1s ease-out, width 0.1s ease-out;
    }

    #task-tree {
      column-width: 320px;
      column-gap: 12px;
      width: 100%;
    }

    .task-item-wrapper {
      break-inside: avoid;
      page-break-inside: avoid;
      margin-bottom: 10px;
    }

    #zoom-container.mini-mode .task-card-bg > * { display: none !important; }
    #zoom-container.mini-mode .task-card-bg { height: 120px !important; padding: 0 !important; }
    #zoom-container.mini-mode .drag-handle { display: none !important; }

    .status-border-red { border: 2px solid #f43f5e !important; }
    .status-border-orange { border: 2px solid #f59e0b !important; }
    .status-border-green { border: 2px solid #10b981 !important; }

    #zoom-container.mini-mode .task-card-bg.status-border-red { background-color: #f43f5e !important; }
    #zoom-container.mini-mode .task-card-bg.status-border-orange { background-color: #f59e0b !important; }
    #zoom-container.mini-mode .task-card-bg.status-border-green { background-color: #10b981 !important; }

    .prio-1 { border-left: 6px solid #94a3b8 !important; }
    .prio-2 { border-left: 6px solid #3b82f6 !important; }
    .prio-3 { border-left: 6px solid #f97316 !important; }
    .prio-4 { border-left: 6px solid #ef4444 !important; }

    #zoom-container.mini-mode .prio-1,
    #zoom-container.mini-mode .prio-2,
    #zoom-container.mini-mode .prio-3,
    #zoom-container.mini-mode .prio-4 {
      border-left-width: 24px !important;
    }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen flex flex-col relative">

  <ul id="task-link-suggestions" class="hidden absolute bg-white border border-slate-200 rounded-xl shadow-2xl z-[200] max-h-40 overflow-y-auto w-64 text-sm"></ul>

  <div id="debug-banner" class="hidden bg-rose-600 text-white text-xs font-bold px-4 py-2 text-center fixed top-0 left-0 right-0 z-[110] shadow-md flex justify-between items-center">
    <span id="debug-msg" class="truncate pr-2">Erreur Supabase</span>
    <button onclick="document.getElementById('debug-banner').classList.add('hidden')" class="bg-rose-800 px-2 py-0.5 rounded text-[10px]">✕</button>
  </div>

  <div id="splash-screen" onclick="hideSplashScreen()" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center cursor-pointer">
    <img src="splashlogo.jpg" alt="Splash Screen" class="w-full h-full object-cover" onerror="hideSplashScreen()">
  </div>

  <div class="w-full h-full flex flex-col justify-between pt-2 px-2">
    <div class="flex flex-col h-full overflow-hidden">
      <header class="mb-2 shrink-0">
        
        <div class="flex justify-between items-center mb-1 gap-1 sm:gap-2 relative" id="header-top-row">
          <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
            <h1 class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">TODOAPP</h1>
            <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shrink-0"></span>
            <span class="text-xs text-slate-500 font-bold inline-block">v1.5.5</span>
          </div>

          <div class="flex items-center gap-1 shrink-0">
            <button id="zoom-toggle-btn" onclick="toggleZoomBar()" class="text-xl w-8 h-8 flex items-center justify-center bg-slate-100 hover:bg-slate-200 rounded-lg shrink-0 transition-colors" title="Zoom">🚁</button>
            <button onclick="syncCloud()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center transition-colors shrink-0" title="Synchroniser">
              <span id="sync-icon">🔄</span>
            </button>
            <button onclick="openSettingsModal()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center transition-colors shrink-0" title="Réglages">
              <span>⚙</span>
            </button>
          </div>

          <div id="zoom-bar-container" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm z-[150] flex items-center justify-between px-1 gap-1 sm:gap-2 rounded-lg border border-slate-100">
             <button onclick="adjustZoom(-0.05)" class="text-slate-600 hover:text-slate-900 font-extrabold text-3xl px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-xl leading-none shrink-0">-</button>
             <input type="range" id="zoom-range" min="0.1" max="1.0" step="0.01" value="1.0" oninput="onZoomSliderChange(this.value)" class="flex-1 accent-slate-900 cursor-pointer h-3 bg-slate-300 rounded-lg mx-1">
             <button onclick="adjustZoom(0.05)" class="text-slate-600 hover:text-slate-900 font-extrabold text-3xl px-3 py-1 bg-slate-100 hover:bg-slate-200 rounded-xl leading-none shrink-0">+</button>
             <span id="zoom-percent-display" class="text-xs font-extrabold text-slate-800 w-11 text-center shrink-0">100%</span>
             <button onclick="toggleZoomBar()" class="ml-1 text-slate-500 hover:text-rose-500 text-xl font-bold bg-slate-100 hover:bg-slate-200 w-10 h-10 flex items-center justify-center rounded-xl shrink-0 transition-colors">✕</button>
          </div>
        </div>

        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 scrollbar-none" id="category-tabs"></div>
        
        <!-- Barre de progression côte-à-côte avec pourcentage -->
        <div class="flex items-center gap-2 mt-1 mb-3">
            <div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden flex items-center">
                <div id="global-progress-bar" class="h-full rounded-full transition-all duration-300" style="width: 0%; background-color: hsl(0, 100%, 45%);"></div>
            </div>
            <span id="global-progress-text" class="text-[10px] font-extrabold shrink-0 w-8 text-right" style="color: hsl(0, 100%, 45%);">0%</span>
        </div>

      </header>

      <!-- SEPARATION EN TROIS BLOCS -->
      <div class="flex gap-2 mb-2 shrink-0 w-full items-stretch h-10">
        <!-- Partie Gauche : Ajout de tâche -->
        <form id="add-task-form" onsubmit="addTask(event)" class="flex-1 min-w-0 relative">
          <input type="text" id="task-input" placeholder="Ajouter... ($ pour lien)" oninput="handleTaskLinkAutocomplete(event)" class="w-full h-full bg-slate-50 border border-slate-300 rounded-xl px-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900" required>
        </form>

        <!-- Bouton central -->
        <button type="submit" form="add-task-form" class="w-10 h-full bg-slate-900 text-white rounded-xl font-bold text-xl hover:bg-slate-800 shrink-0 flex items-center justify-center shadow-md pb-0.5">
          +
        </button>

        <!-- Partie Droite : Recherche par tags -->
        <div class="flex-1 min-w-0 relative">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">🔍</span>
          <input type="text" id="search-tags-input" placeholder="Tags (lieu, nom)..." oninput="handleSearchInput(event)" class="w-full h-full bg-slate-50 border border-slate-300 rounded-xl pl-8 pr-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900">
          <ul id="search-tag-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-[200] max-h-40 overflow-y-auto text-sm"></ul>
        </div>
      </div>

      <div id="viewport">
        <div id="zoom-container">
          <div id="task-tree"></div>
        </div>
      </div>
    </div>

    <footer class="mt-2 pt-2 border-t border-slate-100 text-xs text-slate-400 flex justify-between items-center pb-4 shrink-0 px-2">
      <span id="task-count">0 tâche</span>
      <span id="sync-status" class="text-emerald-600 font-medium">● Synchro Temps Réel</span>
    </footer>
  </div>

  <!-- MODALE ÉDITION -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-[250]" onclick="closeModalOnOut(event)" onkeydown="handleModalKeyDown(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-4" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900" id="modal-heading">Éditer la tâche</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-3xl font-bold">&times;</button>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Titre</label>
        <textarea id="modal-title" oninput="handleTaskLinkAutocomplete(event)" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Catégorie</label>
        <div class="grid grid-rows-2 grid-flow-col auto-cols-max gap-2 overflow-x-auto pb-1 scrollbar-none" id="modal-categories-container"></div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Priorité</label>
        <div class="grid grid-cols-5 gap-1.5" id="modal-priority-container">
          <button type="button" onclick="setModalPriority(0)" data-prio="0" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">Aucun</button>
          <button type="button" onclick="setModalPriority(1)" data-prio="1" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">1</button>
          <button type="button" onclick="setModalPriority(2)" data-prio="2" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">2</button>
          <button type="button" onclick="setModalPriority(3)" data-prio="3" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">3</button>
          <button type="button" onclick="setModalPriority(4)" data-prio="4" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">4</button>
        </div>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tags (séparés par virgules)</label>
        <input type="text" id="modal-tags" placeholder="ex: maison, urgent..." oninput="handleTagAutocomplete(event)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        <ul id="tag-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-[260] max-h-32 overflow-y-auto"></ul>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Notes</label>
        <textarea id="modal-notes" oninput="handleTaskLinkAutocomplete(event)" rows="3" placeholder="Notes..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
      </div>
      <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-bold text-slate-700 uppercase">Mise en pause</span>
          <input type="checkbox" id="modal-paused" onchange="togglePauseOptions()" class="w-6 h-6 accent-slate-900 rounded">
        </label>
        <div id="pause-options" class="hidden pt-2 border-t border-slate-200 space-y-1.5">
          <span class="text-[11px] font-semibold text-slate-500 block">Option de pause :</span>
          <div class="flex gap-4 text-xs font-medium text-slate-700">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="griser" class="accent-slate-900"> Griser</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="masquer" class="accent-slate-900"> Masquer</label>
          </div>
        </div>
      </div>
      <button onclick="saveModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl shadow-md text-lg">Enregistrer</button>
    </div>
  </div>

  <!-- MODALE RÉGLAGES -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-[250]" onclick="closeSettingsModalOnOut(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900">Réglages</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-700 text-3xl font-bold">&times;</button>
      </div>
      <div class="flex items-center justify-between gap-3 p-1">
        <label for="sort-select" class="text-xs font-bold text-slate-700 uppercase">Ordre d'affichage</label>
        <select id="sort-select" onchange="setSortOption(this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
          <option value="perso">Personnalisé (Glisser-Déposer)</option>
          <option value="date-desc">Plus récents d'abord</option>
          <option value="date-asc">Plus anciens d'abord</option>
          <option value="prio-desc">Priorité haute d'abord</option>
          <option value="prio-asc">Priorité basse d'abord</option>
        </select>
      </div>

      <!-- Import / Export JSON -->
      <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-3">
        <div class="text-xs font-bold text-slate-800 uppercase">Sauvegarde & Restauration</div>
        <div class="flex gap-2">
          <button onclick="exportJSON()" class="flex-1 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800 transition-colors shadow-sm flex items-center justify-center gap-1.5">
            <span>📥</span> Export JSON
          </button>
          <label class="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded-xl text-xs font-bold text-center cursor-pointer transition-colors flex items-center justify-center gap-1.5">
            <span>📤</span> Import JSON
            <input type="file" id="import-json-input" accept=".json" onchange="importJSON(event)" class="hidden">
          </label>
        </div>
      </div>

      <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
        <div>
          <div class="text-xs font-bold text-slate-800">Version de l'application</div>
          <div class="text-[11px] text-slate-500">v1.5.5 (Cache: todoapp_v155)</div>
        </div>
        <button onclick="forceAppUpdate()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800">Forcer MaJ</button>
      </div>
    </div>
  </div>

  <!-- MODALE GESTION CATÉGORIES -->
  <div id="category-manager-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-[260]" onclick="closeCategoryManagerOnOut(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl border border-slate-100" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100 mb-4">
        <h3 class="font-extrabold text-lg text-slate-900">Catégories</h3>
        <button onclick="closeCategoryManager()" class="text-slate-400 hover:text-slate-700 text-3xl font-bold">&times;</button>
      </div>
      <div id="category-manager-list" class="space-y-2 max-h-[50vh] overflow-y-auto mb-4 scrollbar-none"></div>
      <button onclick="addNewCategoryFromManager()" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white rounded-xl text-sm font-bold transition-colors shadow-md">
        + Nouvelle Catégorie
      </button>
    </div>
  </div>

  <script>
    const CACHE_NAME = 'todoapp_v155';

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = '${CACHE_NAME}';
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => {
          e.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log(err));
    }

    function forceAppUpdate() {
      if ('caches' in window) { caches.keys().then(names => names.forEach(n => caches.delete(n))); }
      localStorage.clear();
      window.location.reload(true);
    }

    let splashHidden = false;
    function hideSplashScreen() {
      if (splashHidden) return;
      splashHidden = true;
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.classList.add('hidden-splash');
        setTimeout(() => splash.style.display = 'none', 450);
      }
    }
    setTimeout(hideSplashScreen, 1000);

    function toggleZoomBar() {
      const bar = document.getElementById('zoom-bar-container');
      bar.classList.toggle('hidden');
    }

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const minZoom = 0.1;   
    const maxZoom = isIOS ? 0.7 : 1.0;
    let currentZoom = maxZoom;

    document.addEventListener('DOMContentLoaded', () => {
      const range = document.getElementById('zoom-range');
      if (range) range.max = maxZoom;
    });

    function applyZoom(newZoom) {
      currentZoom = Math.max(minZoom, Math.min(maxZoom, newZoom));
      const container = document.getElementById('zoom-container');
      const range = document.getElementById('zoom-range');
      const display = document.getElementById('zoom-percent-display');

      if (container) {
        container.style.width = (100 / currentZoom) + '%';
        container.style.transform = `scale(${currentZoom})`;
        
        const semanticZoomThreshold = isIOS ? 0.2 : 0.3;
        if (currentZoom <= semanticZoomThreshold) {
          container.className = 'mini-mode';
        } else {
          container.className = '';
        }
      }
      if (range) range.value = currentZoom;
      if (display) display.textContent = Math.round(currentZoom * 100) + '%';
    }

    function adjustZoom(delta) { applyZoom(currentZoom + delta); }
    function onZoomSliderChange(val) { applyZoom(parseFloat(val)); }

    const viewportEl = document.getElementById('viewport');
    if (viewportEl) {
      viewportEl.addEventListener('wheel', (e) => {
        if (e.ctrlKey) {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.05 : -0.05;
          applyZoom(currentZoom + delta);
        }
      }, { passive: false });

      let initialTouchDistance = null;
      let initialZoomLevel = currentZoom;
      
      viewportEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialTouchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialZoomLevel = currentZoom;
        }
      }, { passive: true });

      viewportEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialTouchDistance !== null) {
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = currentDistance / initialTouchDistance;
          applyZoom(initialZoomLevel * factor);
        }
      }, { passive: true });

      viewportEl.addEventListener('touchend', () => { initialTouchDistance = null; });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const catTabs = document.getElementById('category-tabs');
      if (catTabs) {
        catTabs.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) { e.preventDefault(); catTabs.scrollLeft += e.deltaY * 1.5; }
        }, { passive: false });

        let isDown = false, startX, scrollLeft, isDragging = false;
        catTabs.addEventListener('mousedown', (e) => {
          isDown = true; isDragging = false;
          startX = e.pageX - catTabs.offsetLeft; scrollLeft = catTabs.scrollLeft;
        });
        catTabs.addEventListener('mouseleave', () => { isDown = false; });
        catTabs.addEventListener('mouseup', () => { isDown = false; });
        catTabs.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - catTabs.offsetLeft;
          const walk = (x - startX) * 2;
          if (Math.abs(walk) > 5) isDragging = true;
          catTabs.scrollLeft = scrollLeft - walk;
        });
        catTabs.addEventListener('click', (e) => {
          if (isDragging) { e.preventDefault(); e.stopPropagation(); }
        }, { capture: true });
      }
    });

    async function pushTaskToCloud(todo) {
      if (!todo || !supabaseClient) return;
      let safeId = Number(todo.id);
      if (!safeId || isNaN(safeId)) { safeId = generateSafeId(); todo.id = safeId; }
      let safeParentId = todo.parent_id ? Number(todo.parent_id) : null;
      if (safeParentId && isNaN(safeParentId)) safeParentId = null;

      const payload = {
        id: safeId,
        text: todo.text || '',
        completed: !!todo.completed,
        category: todo.category || 'Général',
        priority: Number(todo.priority || 0),
        tags: Array.isArray(todo.tags) ? todo.tags : [],
        notes: todo.notes || '',
        paused: !!todo.paused,
        pause_mode: todo.pauseMode || 'griser',
        parent_id: safeParentId,
        manual_order: Number(todo.manual_order || 0)
      };

      try {
        const res = await supabaseClient.from('todos').upsert([payload]).select();
        if (res.error) {
          console.error("Supabase Push Error:", res.error);
          showDebugError(res.error.message);
          updateSyncStatus(false, res.error.message);
        } else updateSyncStatus(true);
      } catch (err) {
        console.error("Exception pushTaskToCloud:", err);
        showDebugError("Erreur Réseau");
        updateSyncStatus(false, "Hors-ligne");
      }
    }

    let realtimeChannel = null;
    function initRealtime() {
      if (!supabaseClient) {
        updateSyncStatus(false, "Hors-ligne");
        return;
      }
      if (realtimeChannel) {
        try { supabaseClient.removeChannel(realtimeChannel); } catch(e){}
      }
      try {
        realtimeChannel = supabaseClient
          .channel('todos_realtime')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => syncCloud())
          .subscribe((status) => {
            if (status === 'SUBSCRIBED') updateSyncStatus(true);
            else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') updateSyncStatus(false, "Canal fermé");
          });
      } catch(e) {
        updateSyncStatus(false, "Erreur Realtime");
      }
    }

    async function syncCloud() {
      const syncIcon = document.getElementById('sync-icon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      if (!supabaseClient) {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        updateSyncStatus(false, "Hors-ligne");
        hideSplashScreen();
        return;
      }

      try {
        const fetchPromise = supabaseClient.from('todos').select('*');
        const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout réseau")), 3000));

        const { data, error } = await Promise.race([fetchPromise, timeoutPromise]);

        if (error) {
          console.error("Erreur Sync Supabase:", error);
          showDebugError(error.message);
          updateSyncStatus(false, error.message);
          return;
        }

        updateSyncStatus(true);
        if (Array.isArray(data)) {
          const serverMap = new Map();
          data.forEach(item => { const sId = Number(item.id); if (sId && !isNaN(sId)) serverMap.set(sId, item); });
          const mergedTodos = [];
          const processedServerIds = new Set();

          todos.forEach(localTask => {
            const lId = Number(localTask.id);
            if (!lId || isNaN(lId)) return;
            if (serverMap.has(lId)) {
              const sItem = serverMap.get(lId);
              processedServerIds.add(lId);
              mergedTodos.push({
                id: lId,
                text: sItem.text || sItem.title || localTask.text,
                completed: sItem.completed !== undefined ? !!sItem.completed : localTask.completed,
                category: sItem.category || localTask.category || 'Général',
                priority: sItem.priority !== undefined ? Number(sItem.priority) : (localTask.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : (localTask.tags || []),
                notes: sItem.notes !== undefined ? sItem.notes : (localTask.notes || ''),
                paused: sItem.paused !== undefined ? !!sItem.paused : (localTask.paused || false),
                pauseMode: sItem.pause_mode || localTask.pauseMode || 'griser',
                collapsed: !!localTask.collapsed,
                parent_id: (sItem.parent_id && !isNaN(Number(sItem.parent_id))) ? Number(sItem.parent_id) : null,
                manual_order: sItem.manual_order !== undefined ? Number(sItem.manual_order) : Number(localTask.manual_order || 0),
                created_at: localTask.created_at || sItem.created_at || new Date().toISOString()
              });
            }
          });

          data.forEach(sItem => {
            const sId = Number(sItem.id);
            if (sId && !isNaN(sId) && !processedServerIds.has(sId)) {
              mergedTodos.push({
                id: sId,
                text: sItem.text || sItem.title || '',
                completed: !!sItem.completed,
                category: sItem.category || 'Général',
                priority: Number(sItem.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : [],
                notes: sItem.notes || '',
                paused: !!sItem.paused,
                pauseMode: sItem.pause_mode || 'griser',
                collapsed: false,
                parent_id: (sItem.parent_id && !isNaN(Number(sItem.parent_id))) ? Number(sItem.parent_id) : null,
                manual_order: Number(sItem.manual_order || 0),
                created_at: sItem.created_at || new Date().toISOString()
              });
            }
          });
          todos = sanitizeTodosList(mergedTodos);
          saveLocal();
        }
      } catch (err) {
        console.error("Exception syncCloud:", err);
        showDebugError(err.message || "Erreur réseau");
        updateSyncStatus(false, "Hors-ligne");
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        hideSplashScreen();
      }
    }

    function uncollapseAncestors(taskId, updatedList = []) {
      const task = todos.find(t => String(t.id) === String(taskId));
      if (task && task.parent_id) {
        const parent = todos.find(t => String(t.id) === String(task.parent_id));
        if (parent && parent.collapsed) {
          parent.collapsed = false;
          updatedList.push(parent);
        }
        uncollapseAncestors(parent.id, updatedList);
      }
    }

    function uncheckDescendants(taskId, updatedList) {
      const children = todos.filter(t => String(t.parent_id) === String(taskId));
      for (const child of children) {
        if (child.completed) {
          child.completed = false;
          if (!updatedList.some(u => u.id === child.id)) updatedList.push(child);
        }
        uncheckDescendants(child.id, updatedList);
      }
    }

    function uncheckAncestors(parentId, updatedList) {
      if (!parentId) return;
      const parent = todos.find(t => String(t.id) === String(parentId));
      if (parent && parent.completed) {
        parent.completed = false;
        if (!updatedList.some(u => u.id === parent.id)) updatedList.push(parent);
        if (parent.parent_id) uncheckAncestors(parent.parent_id, updatedList);
      }
    }

    async function toggleTask(e, id) {

      if (!task) return;
      const newStatus = !task.completed;
      const updatedTasks = [];
      task.completed = newStatus;
      updatedTasks.push(task);
      if (newStatus === false) {
        uncheckDescendants(task.id, updatedTasks);
        if (task.parent_id) uncheckAncestors(task.parent_id, updatedTasks);
      }
      saveLocal();
      for (const t of updatedTasks) { await pushTaskToCloud(t); }
      await syncCloud();
    }

    function getCleanTaskText(text, visited = new Set()) {
      if (!text) return '';
      return String(text).replace(/\[\[([^\]]+)\]\]/g, (match, idStr) => {
        if (visited.has(String(idStr))) return 'Tâche';
        const linked = todos.find(t => String(t.id) === String(idStr));
        if (!linked) return 'Tâche';
        const newVisited = new Set(visited);
        newVisited.add(String(idStr));
        return getCleanTaskText(linked.text, newVisited);
      }).trim();
    }

    function handleTaskLinkAutocomplete(e) {
      const input = e.target;
      const val = input.value;
      const cursorPos = input.selectionStart || 0;
      const textBeforeCursor = val.substring(0, cursorPos);
      const match = textBeforeCursor.match(/\$([^\s$]*)$/);
      
      const suggestionsList = document.getElementById('task-link-suggestions');
      
      if (match) {
        currentLinkInput = input;
        const linkSearchTerm = match[1].toLowerCase();
        const filteredTasks = todos.filter(t => 
            getCleanTaskText(t.text).toLowerCase().includes(linkSearchTerm) && 
            String(t.id) !== String(currentEditing.id)
        );
        
        if (filteredTasks.length > 0) {
          const rect = input.getBoundingClientRect();
          suggestionsList.style.top = (rect.bottom + window.scrollY + 5) + 'px';
          suggestionsList.style.left = rect.left + 'px';
          
          suggestionsList.innerHTML = filteredTasks.map(t => `
            <li class="px-3 py-2 font-medium hover:bg-slate-100 cursor-pointer border-b border-slate-50 last:border-0 truncate" onmousedown="insertTaskLink(event, ${t.id})">
              ${escapeHtml(getCleanTaskText(t.text))}
            </li>
          `).join('');
          suggestionsList.classList.remove('hidden');
        } else {
          suggestionsList.classList.add('hidden');
        }
      } else {
        suggestionsList.classList.add('hidden');
        currentLinkInput = null;
      }
    }

    function insertTaskLink(e, taskId) {
      if (e) e.preventDefault();
      if (!currentLinkInput) return;
      
      const val = currentLinkInput.value;
      const cursorPos = currentLinkInput.selectionStart;
      const textBeforeCursor = val.substring(0, cursorPos);
      const textAfterCursor = val.substring(cursorPos);
      
      const match = textBeforeCursor.match(/\$([^\s$]*)$/);
      if (match) {
        const startIdx = match.index;
        const newTextBefore = textBeforeCursor.substring(0, startIdx) + `[[${taskId}]] `;
        currentLinkInput.value = newTextBefore + textAfterCursor;
        currentLinkInput.selectionStart = currentLinkInput.selectionEnd = newTextBefore.length;
      }
      document.getElementById('task-link-suggestions').classList.add('hidden');
      currentLinkInput.focus();
    }

    document.addEventListener('mousedown', (e) => {
      const linkSuggestions = document.getElementById('task-link-suggestions');
      if (linkSuggestions && !linkSuggestions.contains(e.target)) linkSuggestions.classList.add('hidden');
      
      const searchSuggestions = document.getElementById('search-tag-suggestions');
      if (searchSuggestions && !searchSuggestions.contains(e.target) && e.target.id !== 'search-tags-input') {
        searchSuggestions.classList.add('hidden');
      }
    });

    async function saveModal() {
      const title = document.getElementById('modal-title').value.trim();
      if (!title) return;
      const rawTags = document.getElementById('modal-tags').value;
      const tags = rawTags.split(',').map(t => t.trim()).filter(Boolean);
      const notes = document.getElementById('modal-notes').value.trim();
      const paused = document.getElementById('modal-paused').checked;
      const pauseModes = document.getElementsByName('pause-mode');
      let pauseMode = 'griser';
      pauseModes.forEach(r => { if (r.checked) pauseMode = r.value; });

      if (currentEditing.id === 'new-subtask') {
        const parent = todos.find(t => String(t.id) === String(currentEditing.parentId));
        if (parent) parent.collapsed = false;

        const siblings = todos.filter(t => String(t.parent_id) === String(currentEditing.parentId));
        const newOrder = siblings.length > 0 ? Math.min(...siblings.map(t => t.manual_order || 0)) - 10 : 0;

        const newSub = {
          id: generateSafeId(),
          text: title, completed: false, category: currentEditing.selectedCategory, priority: currentEditing.selectedPriority, tags: tags, notes: notes,
          paused: paused, pauseMode: pauseMode, collapsed: false, parent_id: currentEditing.parentId, manual_order: newOrder, created_at: new Date().toISOString()
        };
        todos.push(newSub);
        saveLocal();
        closeModal();
        await pushTaskToCloud(newSub);
        if (parent) await pushTaskToCloud(parent);
        await syncCloud();
      } else {
        const task = todos.find(t => String(t.id) === String(currentEditing.id));
        if (task) {
          task.text = title; task.category = currentEditing.selectedCategory;
          task.priority = currentEditing.selectedPriority; task.tags = tags;
          task.notes = notes; task.paused = paused; task.pauseMode = pauseMode;
          saveLocal();
          closeModal();
          await pushTaskToCloud(task);
          await syncCloud();
        }
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${escapeHtml(cat)}')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border ${activeCategory === cat ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
          ${escapeHtml(cat)}
        </button>
      `).join('') + `
        <button onclick="openCategoryManager()" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200 ml-2 shrink-0">
          ⚙️ Modifier
        </button>
      `;
    }

    function openCategoryManager() {
      renderCategoryManagerList();
      document.getElementById('category-manager-modal').classList.remove('hidden');
      document.getElementById('category-manager-modal').classList.add('flex');
    }

    function closeCategoryManager() {
      document.getElementById('category-manager-modal').classList.add('hidden');
      document.getElementById('category-manager-modal').classList.remove('flex');
    }

    function closeCategoryManagerOnOut(e) { 
      if (e.target.id === 'category-manager-modal') closeCategoryManager(); 
    }

    function renderCategoryManagerList() {
      const list = document.getElementById('category-manager-list');
      list.innerHTML = categories.filter(c => c !== 'Tout' && c !== 'Masquées').map(cat => `
        <div class="flex justify-between items-center bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl">
          <span class="text-sm font-bold text-slate-800">${escapeHtml(cat)}</span>
          ${cat !== 'Général' ? `<button onclick="deleteCategory('${escapeHtml(cat)}')" class="text-rose-500 hover:text-rose-700 font-bold text-xl leading-none px-2" title="Supprimer">&times;</button>` : ''}
        </div>
      `).join('');
    }

    async function deleteCategory(cat) {
      if (confirm(`Supprimer la catégorie "${cat}" ? Les tâches associées seront déplacées vers "Général".`)) {
        let custom = JSON.parse(localStorage.getItem('todoapp_custom_cats') || '[]');
        custom = custom.filter(c => c !== cat);
        localStorage.setItem('todoapp_custom_cats', JSON.stringify(custom));
        
        let deletedBase = JSON.parse(localStorage.getItem('todoapp_deleted_base_cats') || '[]');
        if (BASE_CATEGORIES.includes(cat) && !deletedBase.includes(cat)) {
          deletedBase.push(cat);
          localStorage.setItem('todoapp_deleted_base_cats', JSON.stringify(deletedBase));
        }

        let updatedTasks = [];
        todos.forEach(t => {
          if (t.category === cat) {
            t.category = 'Général';
            updatedTasks.push(t);
          }
        });
        
        if (activeCategory === cat) activeCategory = 'Tout';
        
        saveLocal();
        for (const t of updatedTasks) { await pushTaskToCloud(t); }
        if (updatedTasks.length > 0) await syncCloud();
        
        renderCategoryManagerList();
      }
    }

    function addNewCategoryFromManager() {
      const name = prompt("Nom de la nouvelle catégorie :");
      if (name && name.trim()) {
        const clean = name.trim();
        const localCustomCats = JSON.parse(localStorage.getItem('todoapp_custom_cats') || '[]');
        if (!localCustomCats.includes(clean)) {
          localCustomCats.push(clean);
          localStorage.setItem('todoapp_custom_cats', JSON.stringify(localCustomCats));
        }
        updateCategories();
        renderCategoryManagerList();
      }
    }

    function setCategory(cat) { activeCategory = cat; renderCategoryTabs(); render(); }
    
    function hasAncestorWithCategory(parentId, categoryName) {
      if (!parentId) return false;
      const parent = todos.find(t => String(t.id) === String(parentId));
      if (!parent) return false;
      if (parent.category === categoryName) return true;
      return hasAncestorWithCategory(parent.parent_id, categoryName);
    }
    
    function getTaskTime(t) {
      if (t.created_at) { const time = new Date(t.created_at).getTime(); if (!isNaN(time)) return time; }
      return t.id || 0;
    }
    
    function sortTasks(items) {
      return items.sort((a, b) => {
        if (currentSort === 'perso') return (a.manual_order || 0) - (b.manual_order || 0);
        
        const timeA = getTaskTime(a); const timeB = getTaskTime(b);
        if (currentSort === 'date-desc') return timeB - timeA;
        if (currentSort === 'date-asc') return timeA - timeB;
        if (currentSort === 'prio-desc') return (b.priority || 0) - (a.priority || 0) || (timeB - timeA);
        if (currentSort === 'prio-asc') return (a.priority || 0) - (b.priority || 0) || (timeB - timeA);
        return 0;
      });
    }

    function handleDragStart(e, id) {
      draggedTaskId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      if (currentSort !== 'perso') {
        setSortOption('perso');
        const select = document.getElementById('sort-select');
        if (select) select.value = 'perso';
      }
    }
    
    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }
    
    function handleDragEnter(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drop-target-active');
    }
    
    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drop-target-active');
    }
    
    async function handleDrop(e, targetId) {
      e.preventDefault();
      e.currentTarget.classList.remove('drop-target-active');
      
      if (!draggedTaskId || String(draggedTaskId) === String(targetId)) return;
      const draggedTask = todos.find(t => String(t.id) === String(draggedTaskId));
      const targetTask = todos.find(t => String(t.id) === String(targetId));
      
      if (!draggedTask || !targetTask) return;
      if (hasAncestor(targetTask.id, draggedTask.id)) return;
      
      draggedTask.parent_id = targetTask.parent_id;

      let siblings = todos.filter(t => String(t.parent_id) === String(targetTask.parent_id));
      siblings.sort((a, b) => (a.manual_order || 0) - (b.manual_order || 0));
      
      const draggedIndex = siblings.findIndex(t => String(t.id) === String(draggedTaskId));
      if (draggedIndex > -1) siblings.splice(draggedIndex, 1);
      
      const insertIndex = siblings.findIndex(t => String(t.id) === String(targetId));
      if (insertIndex > -1) {
        siblings.splice(insertIndex, 0, draggedTask);
      } else {
        siblings.push(draggedTask);
      }
      
      siblings.forEach((sib, idx) => {
        sib.manual_order = idx * 10;
      });
      
      saveLocal();
      await pushTaskToCloud(draggedTask);
      for (let s of siblings) { await pushTaskToCloud(s); }
      await syncCloud();
      draggedTaskId = null;
    }
    
    function hasAncestor(childId, possibleAncestorId) {
      if (!childId) return false;
      if (String(childId) === String(possibleAncestorId)) return true;
      const child = todos.find(t => String(t.id) === String(childId));
      if (!child) return false;
      return hasAncestor(child.parent_id, possibleAncestorId);
    }

    function getTaskState(taskId) {
      const task = todos.find(t => String(t.id) === String(taskId));
      if (!task) return 'red';
      
      const children = todos.filter(t => String(t.parent_id) === String(taskId));
      
      if (children.length > 0) {
        const allChildrenCompleted = children.every(c => c.completed && getTaskState(c.id) === 'green');
        if (task.completed && allChildrenCompleted) return 'green';
        
        const hasAnyCompleted = children.some(c => c.completed || getTaskState(c.id) === 'orange' || getTaskState(c.id) === 'green');
        if (task.completed || hasAnyCompleted) return 'orange';
        
        return 'red';
      }
      
      return task.completed ? 'green' : 'red';
    }

    function formatTextWithLinks(text) {
      if (!text) return '';
      let escaped = escapeHtml(text);
      return escaped.replace(/\[\[([^\]]+)\]\]/g, (match, idStr) => {
        const task = todos.find(t => String(t.id) === String(idStr));
        if (!task) return `<span class="line-through text-slate-400">Tâche introuvable</span>`;
        
        const state = getTaskState(task.id);
        let colorClass = 'text-rose-500'; 
        let accentColor = 'accent-rose-500';
        if (state === 'green') { colorClass = 'text-emerald-500'; accentColor = 'accent-emerald-500'; }
        else if (state === 'orange') { colorClass = 'text-amber-500'; accentColor = 'accent-amber-500'; }
        
        const isChecked = task.completed ? 'checked' : '';
        const cleanTitle = getCleanTaskText(task.text) || 'Tâche';
        
        return `<span class="inline-flex items-center gap-1.5 mx-1 ${colorClass} font-bold px-1.5 py-0.5 bg-slate-100/60 rounded align-middle border border-slate-200/50">
                  <input type="checkbox" ${isChecked} onclick="toggleTask(event, ${task.id})" class="w-4 h-4 ${accentColor} rounded cursor-pointer shrink-0 mt-[1px]">
                  <span class="cursor-pointer hover:underline truncate max-w-[150px]" onclick="scrollToTask(event, ${task.id})">🔗 ${escapeHtml(cleanTitle)}</span>
                </span>`;
      });
    }

    function getTopLevelCategory(taskId) {
      const task = todos.find(t => String(t.id) === String(taskId));
      if (!task) return 'Général';
      if (task.parent_id) return getTopLevelCategory(task.parent_id);
      return task.category || 'Général';
    }

    function scrollToTask(e, id) {
      if (e) e.stopPropagation();
      
      const task = todos.find(t => String(t.id) === String(id));
      if (!task) return;

      const taskCat = getTopLevelCategory(task.id);
      let changedTab = false;
      
      if (activeCategory !== 'Tout' && activeCategory !== taskCat) {
          if (categories.includes(taskCat)) {
              activeCategory = taskCat;
          } else {
              activeCategory = 'Tout';
          }
          changedTab = true;
      }

      let updatedList = [];
      uncollapseAncestors(task.id, updatedList);
      
      if (updatedList.length > 0 || changedTab) {
          if (updatedList.length > 0) {
              saveLocal();
          } else if (changedTab) {
              renderCategoryTabs();
              render();
          }
      }

      setTimeout(() => {
        const el = document.getElementById('task-card-' + task.id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('highlight-task');
          setTimeout(() => el.classList.remove('highlight-task'), 1500);
        }
      }, 50);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
    }

    function updateGlobalProgress() {
      let targetTasks = [];
      if (activeCategory === 'Tout') {
        targetTasks = todos;
      } else if (activeCategory === 'Masquées') {
        targetTasks = todos.filter(t => t.paused && t.pauseMode === 'masquer');
      } else {
        targetTasks = todos.filter(t => t.category === activeCategory || hasAncestorWithCategory(t.parent_id, activeCategory));
      }

      const bar = document.getElementById('global-progress-bar');
      const text = document.getElementById('global-progress-text');

      if (targetTasks.length === 0) {
        if (bar) bar.style.width = '0%';
        if (text) {
          text.textContent = '0%';
          text.style.color = 'hsl(0, 100%, 45%)';
        }
        return;
      }

      const completedCount = targetTasks.filter(t => t.completed).length;
      const percent = Math.round((completedCount / targetTasks.length) * 100);
      const hue = percent * 1.2; 
      const color = `hsl(${hue}, 100%, 45%)`;
      
      if (bar) {
        bar.style.width = percent + '%';
        bar.style.backgroundColor = color;
      }
      if (text) {
        text.textContent = percent + '%';
        text.style.color = color;
      }
    }

    function getBacklinks(taskId) {
      const targetPattern = `[[${taskId}]]`;
      return todos.filter(t => 
        String(t.id) !== String(taskId) && 
        ((t.text && t.text.includes(targetPattern)) || (t.notes && t.notes.includes(targetPattern)))
      );
    }

    function taskMatchesTags(task) {
      if (!activeSearchTags || activeSearchTags.length === 0) return true;
      return activeSearchTags.every(searchTag => 
        (task.tags || []).some(t => t.toLowerCase().includes(searchTag.toLowerCase()))
      );
    }

    function hasMatchingDescendantTags(taskId) {
      const children = todos.filter(c => String(c.parent_id) === String(taskId));
      if (children.length === 0) return false;
      return children.some(c => taskMatchesTags(c) || hasMatchingDescendantTags(c.id));
    }

    function hasMatchingAncestorTags(taskId) {
      const task = todos.find(t => String(t.id) === String(taskId));
      if (!task || !task.parent_id) return false;
      const parent = todos.find(p => String(p.id) === String(task.parent_id));
      if (!parent) return false;
      if (taskMatchesTags(parent)) return true;
      return hasMatchingAncestorTags(parent.id);
    }

    function renderTaskTree(parentId = null, level = 0) {
      let items = todos.filter(t => {
        const isMasquer = t.paused && t.pauseMode === 'masquer';
        if (activeCategory === 'Masquées') {
            if (level === 0 && !(isMasquer && t.parent_id === null)) return false;
            if (level !== 0 && String(t.parent_id) !== String(parentId)) return false;
        } else {
            if (isMasquer) return false;
            if (level === 0) {
              if (activeCategory === 'Tout') { if (t.parent_id !== null) return false; } 
              else { if (t.category !== activeCategory) return false; if (hasAncestorWithCategory(t.parent_id, activeCategory)) return false; }
            } else { if (String(t.parent_id) !== String(parentId)) return false; }
        }

        if (activeSearchTags.length > 0) {
          const selfMatch = taskMatchesTags(t);
          const childMatch = hasMatchingDescendantTags(t.id);
          const parentMatch = hasMatchingAncestorTags(t.id);
          if (!selfMatch && !childMatch && !parentMatch) return false;
        }

        return true;
      });

      if (items.length === 0) return '';
      items = sortTasks(items);

      return items.map(todo => {
        const isGriser = todo.paused && todo.pauseMode !== 'masquer';
        const children = todos.filter(c => String(c.parent_id) === String(todo.id));
        const hasChildren = children.length > 0;
        
        const forceUncollapse = activeSearchTags.length > 0 && hasMatchingDescendantTags(todo.id);
        const isCollapsed = forceUncollapse ? false : !!todo.collapsed;
        
        const childrenHTML = (!isCollapsed && hasChildren) ? renderTaskTree(todo.id, level + 1) : '';

        const state = getTaskState(todo.id);
        let borderStateClass = 'status-border-red';
        if (state === 'green') borderStateClass = 'status-border-green';
        else if (state === 'orange') borderStateClass = 'status-border-orange';

        let prioClass = '';
        if (todo.priority === 1) prioClass = 'prio-1';
        else if (todo.priority === 2) prioClass = 'prio-2';
        else if (todo.priority === 3) prioClass = 'prio-3';
        else if (todo.priority === 4) prioClass = 'prio-4';

        const arrowSvg = isCollapsed 
          ? `<svg class="w-6 h-6 text-slate-500 fill-current" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6V4z"/></svg>`
          : `<svg class="w-6 h-6 text-slate-500 fill-current" viewBox="0 0 20 20"><path d="M4 6l6 10 6-10H4z"/></svg>`;

        let subtaskProgressHtml = '';
        if (hasChildren) {
          const allDescendants = [];
          function getDescendants(pId) {
            const kids = todos.filter(t => String(t.parent_id) === String(pId));
            allDescendants.push(...kids);
            kids.forEach(k => getDescendants(k.id));
          }
          getDescendants(todo.id);
          
          if (allDescendants.length > 0) {
            const comp = allDescendants.filter(d => d.completed).length;
            const pct = Math.round((comp / allDescendants.length) * 100);
            const subHue = pct * 1.2;
            subtaskProgressHtml = `
              <div class="mt-2 w-full h-1 bg-slate-200/80 rounded-full overflow-hidden flex items-center shadow-inner">
                <div class="h-full rounded-full transition-all duration-300" style="width: ${pct}%; background-color: hsl(${subHue}, 100%, 45%);"></div>
              </div>
            `;
          }
        }

        const backlinks = getBacklinks(todo.id);
        let backlinksHtml = '';
        if (backlinks.length > 0) {
          backlinksHtml = `
            <div class="mt-1.5 flex flex-wrap gap-1 items-center text-[10px] text-slate-500 font-medium">
              <span class="text-slate-400 font-bold">↩ Cité dans :</span>
              ${backlinks.map(b => {
                let cleanText = getCleanTaskText(b.text);
                return `<button onclick="scrollToTask(event, ${b.id})" class="inline-flex items-center gap-0.5 px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded transition-colors truncate max-w-[150px]" title="${escapeHtml(cleanText)}">
                  🔗 ${escapeHtml(cleanText)}
                </button>`;
              }).join('')}
            </div>
          `;
        }

        return `
          <div class="task-item-wrapper flex items-start gap-1 transition-all rounded-2xl ${level > 0 ? 'ml-3 mt-1 pl-1 border-l-2 border-slate-200/70' : ''}"
               ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${todo.id})" ondragenter="handleDragEnter(event)" ondragueleave="handleDragLeave(event)">
            
            <div draggable="true" ondragstart="handleDragStart(event, ${todo.id})" class="cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-500 mt-[10px] px-1 drag-handle shrink-0" title="Déplacer (Drag & Drop)">
              <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20"><path d="M7 2a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0zm8-16a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0z"/></svg>
            </div>

            <div class="flex-1 w-full min-w-0">
              <div id="task-card-${todo.id}"
                onclick="openModal(${todo.id})"
                class="task-card-bg flex items-start justify-between gap-2 p-2 rounded-2xl transition-all cursor-pointer ${borderStateClass} ${prioClass} ${
                  todo.completed ? 'bg-slate-50 opacity-60' : 
                  isGriser ? 'bg-slate-100/70 opacity-50' : 
                  'bg-white shadow-sm hover:border-slate-400'
                }"
              >
                <input 
                  type="checkbox" 
                  ${todo.completed ? 'checked' : ''} 
                  class="w-6 h-6 accent-slate-900 rounded cursor-pointer shrink-0 mt-1"
                  onclick="toggleTask(event, ${todo.id})"
                >

                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="text-sm font-semibold leading-relaxed ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
                      ${formatTextWithLinks(todo.text)}
                    </span>
                    ${todo.paused ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded-md">PAUSE</span>` : ''}
                    ${hasChildren && isCollapsed ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-md">+${children.length} masquée${children.length > 1 ? 's' : ''}</span>` : ''}
                  </div>

                  <div class="flex flex-wrap gap-1.5 mt-1">
                    <span class="text-[11px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">${escapeHtml(todo.category)}</span>
                    ${(todo.tags || []).map(tag => `<span class="text-[11px] font-bold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md">#${escapeHtml(tag)}</span>`).join('')}
                  </div>

                  ${todo.notes ? `<p class="text-xs text-slate-500 mt-1.5 italic bg-slate-50 p-2 rounded-xl border border-slate-100 leading-relaxed">${formatTextWithLinks(todo.notes)}</p>` : ''}
                  
                  ${backlinksHtml}

                  ${subtaskProgressHtml}
                </div>

                <div class="flex items-center gap-0.5 shrink-0">
                  ${hasChildren ? `<button onclick="toggleCollapse(event, ${todo.id})" class="p-1.5 text-slate-400 hover:text-slate-900 rounded-lg shrink-0" title="${isCollapsed ? 'Déplier' : 'Plier'}">${arrowSvg}</button>` : ''}
                  <button onclick="addSubtask(event, ${todo.id})" class="px-2 py-1 text-slate-400 hover:text-slate-900 font-bold text-2xl rounded-lg leading-none shrink-0" title="Sous-tâche">+</button>
                  <button onclick="deleteTask(event, ${todo.id})" class="px-2 py-1 text-slate-400 hover:text-rose-500 font-bold text-2xl rounded-lg leading-none shrink-0" title="Supprimer">&times;</button>
                </div>
              </div>
              ${childrenHTML}
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      const treeContainer = document.getElementById('task-tree');
      const countEl = document.getElementById('task-count');
      const html = renderTaskTree(null, 0);
      if (!html) treeContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">Aucune tâche dans cette catégorie ou correspondant à la recherche.</p>`;
      else treeContainer.innerHTML = html;
      const activeCount = todos.filter(t => !t.completed).length;
      countEl.textContent = `${activeCount} tâche${activeCount > 1 ? 's' : ''} restante${activeCount > 1 ? 's' : ''}`;
      
      updateGlobalProgress();
    }

    updateCategories(); 
    render(); 
    initRealtime(); 
    syncCloud(); 
    applyZoom(1.0); 
  </script>
</body>
</html>
