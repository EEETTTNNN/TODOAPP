<!-- TODOAPP v1.0.4 -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TODOAPP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{overscroll-behavior-y:contain; background:#f1f5f9;}
  .scrollbar-none::-webkit-scrollbar{display:none;} .scrollbar-none{-ms-overflow-style:none;scrollbar-width:none;}
  .hidden{display:none!important;}
  .swipe-wrap{position:relative;overflow:hidden;border-radius:.75rem;}
  .swipe-bg{position:absolute;inset:0;display:flex;align-items:center;font-weight:700;color:#fff;padding:0 1rem;}
  .swipe-card{position:relative;background:#fff;transition:transform .05s linear;touch-action:pan-y;}
  .card-p1{border-left:6px solid #cbd5e1;} .card-p2{border-left:6px solid #3b82f6;}
  .card-p3{border-left:6px solid #f97316;} .card-p4{border-left:6px solid #ef4444;}
  .prog-red{background:#ef4444;} .prog-orange{background:#f97316;} .prog-yellow{background:#eab308;} .prog-green{background:#22c55e;}
  .cube{aspect-ratio:1;border-radius:.4rem;cursor:pointer;}
  .ring-hl{animation:ringhl 1.4s ease-out;}
  @keyframes ringhl{0%{box-shadow:0 0 0 4px #6366f1;}100%{box-shadow:0 0 0 0px transparent;}}
  .task-link.done{color:#16a34a;font-weight:600;} .task-link.pending{color:#dc2626;font-weight:600;}
  #modalEdit,#modalSettings,#modalBlocked{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;}
</style>
</head>
<body class="text-slate-800 text-sm">
<header class="sticky top-0 z-20 bg-white shadow-sm" style="padding-top:env(safe-area-inset-top,0px)">
  <div class="flex items-center gap-2 px-3 py-2">
    <h1 class="font-bold text-lg">TODOAPP <span class="text-xs text-slate-400">v1.0.4</span></h1>
    <input id="zoom" type="range" min="10" max="100" value="70" class="mx-2 flex-1" oninput="setZoom(this.value)">
    <button onclick="syncCloud()" class="text-xl">🔄</button>
    <button onclick="openSettings()" class="text-xl">⚙️</button>
    <button onclick="toggleSearch()" class="text-xl">🔍</button>
  </div>
  <div id="searchBar" class="hidden px-3 pb-2 flex gap-2">
    <input id="searchInput" oninput="render()" placeholder="texte, #tag, -#tag" class="border rounded px-2 py-1 flex-1">
    <label class="flex items-center gap-1 text-xs"><input type="checkbox" id="showPaused" onchange="render()">Pauses</label>
    <select id="sortSel" onchange="render()" class="border rounded text-xs">
      <option value="desc">Date ↓ récent</option><option value="asc">Date ↑ ancien</option><option value="prio">Priorité</option>
    </select>
  </div>
  <div class="px-3 pb-1">
    <div class="flex justify-between text-xs text-slate-500"><span id="activeTabLabel">Tous</span><span id="activePct">0%</span></div>
    <div class="w-full h-2 bg-slate-200 rounded"><div id="globalBar" class="h-2 rounded prog-red" style="width:0%"></div></div>
  </div>
  <div id="tabsBar" class="flex gap-2 overflow-x-auto scrollbar-none px-3 pb-2"></div>
  <div class="px-3 pb-3 relative">
    <div class="flex gap-2">
      <textarea id="quickAdd" rows="1" placeholder="Titre #tag !3&#10;sous-tâche 1" class="border rounded px-2 py-1 flex-1 resize-none" oninput="onQuickInput(event)" onkeydown="onQuickKey(event)"></textarea>
      <button onclick="submitQuickAdd()" class="bg-indigo-600 text-white rounded px-3 font-bold">+</button>
    </div>
    <div id="autocomplete" class="hidden absolute bg-white border rounded shadow mt-1 w-full max-h-40 overflow-y-auto z-10"></div>
  </div>
</header>
<main id="list" class="p-3 grid gap-3"></main>

<!-- Modale édition -->
<div id="modalEdit" class="hidden"><div class="bg-white rounded-xl p-4 m-auto mt-20 w-11/12 max-w-md space-y-2" onclick="event.stopPropagation()">
  <h2 class="font-bold">Modifier</h2>
  <input id="edText" class="border rounded px-2 py-1 w-full" placeholder="Titre">
  <select id="edCat" class="border rounded px-2 py-1 w-full"></select>
  <select id="edPrio" class="border rounded px-2 py-1 w-full"><option value="1">P1 Basse</option><option value="2">P2</option><option value="3">P3</option><option value="4">P4 Urgente</option></select>
  <input id="edDur" class="border rounded px-2 py-1 w-full" placeholder="Durée (ex 15m)">
  <input id="edTags" class="border rounded px-2 py-1 w-full" placeholder="tags, séparés, virgule">
  <textarea id="edNotes" class="border rounded px-2 py-1 w-full" placeholder="Notes ($AutreTache)"></textarea>
  <div class="flex justify-end gap-2 pt-2">
    <button onclick="closeModal('modalEdit')" class="px-3 py-1">Annuler</button>
    <button onclick="saveModalChanges()" class="bg-indigo-600 text-white rounded px-3 py-1">Enregistrer</button>
  </div>
</div></div>

<!-- Modale réglages -->
<div id="modalSettings" class="hidden"><div class="bg-white rounded-xl p-4 m-auto mt-20 w-11/12 max-w-md space-y-3" onclick="event.stopPropagation()">
  <h2 class="font-bold">Réglages</h2>
  <div class="border rounded p-2 space-y-1">
    <div class="text-xs font-semibold text-slate-500">Connexion Supabase (table "todos")</div>
    <input id="supaUrl" class="border rounded px-2 py-1 w-full text-xs" placeholder="https://xxxx.supabase.co">
    <input id="supaKey" class="border rounded px-2 py-1 w-full text-xs" placeholder="Clé anon publique">
    <div class="flex gap-2">
      <button onclick="connectSupabase()" class="flex-1 bg-slate-700 text-white rounded py-1 text-xs">Connecter</button>
      <button onclick="disconnectSupabase()" class="flex-1 bg-slate-200 rounded py-1 text-xs">Déconnecter</button>
    </div>
    <div id="supaStatus" class="text-xs text-slate-500"></div>
  </div>
  <div class="border rounded p-2 space-y-1">
    <div class="text-xs font-semibold text-slate-500">Catégories</div>
    <div id="catManager" class="space-y-1"></div>
    <div class="flex gap-2"><input id="newCat" class="border rounded px-2 py-1 flex-1 text-xs" placeholder="Nouvelle catégorie">
      <button onclick="addCategory()" class="bg-slate-700 text-white rounded px-3 text-xs">Ajouter</button></div>
  </div>
  <button onclick="exportJSON()" class="w-full bg-slate-100 rounded py-2">⬇ Export JSON</button>
  <label class="w-full block bg-slate-100 rounded py-2 text-center cursor-pointer">⬆ Import JSON
    <input type="file" accept=".json" class="hidden" onchange="importJSON(event)">
  </label>
  <div class="flex justify-end"><button onclick="closeModal('modalSettings')" class="px-3 py-1">Fermer</button></div>
</div></div>

<!-- Modale dépendance bloquée -->
<div id="modalBlocked" class="hidden"><div class="bg-white rounded-xl p-4 m-auto mt-32 w-11/12 max-w-sm space-y-2" onclick="event.stopPropagation()">
  <h2 class="font-bold text-red-600">Tâche bloquée</h2>
  <p id="blockedMsg" class="text-sm"></p>
  <div class="flex justify-end gap-2">
    <button onclick="closeModal('modalBlocked')" class="px-3 py-1">Fermer</button>
    <button id="blockedGoto" class="bg-indigo-600 text-white rounded px-3 py-1">Voir la tâche</button>
  </div>
</div></div>

<script>
const LS_KEY='todoapp_v104', LS_CATS='todoapp_custom_cats';
let state={todos:JSON.parse(localStorage.getItem(LS_KEY)||'[]'),
  cats:JSON.parse(localStorage.getItem(LS_CATS)||'["Tous","Général","Travail","Maison","Voiture"]')};
let activeTab='Tous', zoomVal=70, editingId=null;
const pendingSync=new Set();
function touch(t){ t.updated_at=new Date().toISOString(); }
function save(){localStorage.setItem(LS_KEY,JSON.stringify(state.todos));localStorage.setItem(LS_CATS,JSON.stringify(state.cats));}
function esc(s){return (s||'').replace(/'/g,"\\'").replace(/</g,'&lt;');}
function findTodo(id){return state.todos.find(t=>t.id==id);}
function hasCycle(t,chain){
  chain=chain||new Set(); if(chain.has(t.id)) return true; chain.add(t.id);
  return refs(t).some(r=>hasCycle(r,chain));
}

// ---- Tabs ----
function renderTabs(){
  const bar=document.getElementById('tabsBar'); bar.innerHTML='';
  state.cats.forEach(c=>{
    const b=document.createElement('button');
    b.textContent=c; b.className='px-3 py-1 rounded-full whitespace-nowrap '+(c===activeTab?'bg-indigo-600 text-white':'bg-slate-200');
    b.onclick=()=>{activeTab=c;render();};
    bar.appendChild(b);
  });
}

// ---- Progress helpers ----
function prog(t){ if(!t.subtasks||!t.subtasks.length) return t.completed?100:0;
  return Math.round(100*t.subtasks.filter(s=>s.completed).length/t.subtasks.length); }
function progClass(p){ if(p>=100) return 'prog-green'; if(p>=66) return 'prog-yellow'; if(p>=33) return 'prog-orange'; return 'prog-red'; }

// ---- Link parsing ($Task) ----
function linkify(text,curId){
  return esc(text).replace(/\$([A-Za-zÀ-ÿ0-9_]+)/g,(m,name)=>{
    const tgt=state.todos.find(t=>t.text.toLowerCase().replace(/\s+/g,'')===name.toLowerCase());
    if(!tgt) return m;
    const cls=tgt.completed?'done':'pending';
    return `<a href="#" class="task-link ${cls}" onclick="event.stopPropagation();scrollToTask(${tgt.id})">$${name}</a>`;
  });
}
function scrollToTask(id){
  const el=document.getElementById('task-'+id); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.add('ring-hl'); setTimeout(()=>el.classList.remove('ring-hl'),1400);
}
function backlinks(id){
  const t=findTodo(id); return state.todos.filter(o=>o.id!=id && (o.text.includes('$')||((o.notes||'').includes('$'))))
    .filter(o=>(o.text+ (o.notes||'')).toLowerCase().replace(/\s+/g,'').includes('$'+t.text.toLowerCase().replace(/\s+/g,'')));
}
function refs(t){ // ids of $Task refs in text+notes
  const m=(t.text+' '+(t.notes||'')).match(/\$([A-Za-zÀ-ÿ0-9_]+)/g)||[];
  return m.map(x=>x.slice(1)).map(name=>state.todos.find(o=>o.text.toLowerCase().replace(/\s+/g,'')===name.toLowerCase())).filter(Boolean);
}

// ---- Quick add parsing ----
function onQuickInput(e){
  const val=e.target.value; e.target.rows=Math.min(6,val.split('\n').length);
  const lastLine=val.split('\n').pop(); const m=lastLine.match(/\$([A-Za-zÀ-ÿ0-9_]*)$/);
  const ac=document.getElementById('autocomplete');
  if(m){ const q=m[1].toLowerCase();
    const matches=state.todos.filter(t=>t.text.toLowerCase().includes(q)).slice(0,6);
    if(matches.length){ ac.innerHTML=matches.map(t=>`<div class="px-2 py-1 hover:bg-slate-100 cursor-pointer" onclick="pickAC('${esc(t.text)}')">${esc(t.text)}</div>`).join(''); ac.classList.remove('hidden'); }
    else ac.classList.add('hidden');
  } else ac.classList.add('hidden');
}
function pickAC(name){
  const ta=document.getElementById('quickAdd'); const lines=ta.value.split('\n');
  lines[lines.length-1]=lines[lines.length-1].replace(/\$([A-Za-zÀ-ÿ0-9_]*)$/,'$'+name.replace(/\s+/g,''));
  ta.value=lines.join('\n'); document.getElementById('autocomplete').classList.add('hidden'); ta.focus();
}
function onQuickKey(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); submitQuickAdd(); } }
function parseLine(line){
  let tags=[]; line=line.replace(/#(\S+)/g,(m,g)=>{tags.push(g);return '';});
  let prio=2; line=line.replace(/!([1-4])/,(m,g)=>{prio=+g;return '';});
  return {text:line.trim(),tags,prio};
}
function submitQuickAdd(){
  const ta=document.getElementById('quickAdd'); const lines=ta.value.split('\n').filter(l=>l.trim()!=='');
  if(!lines.length) return;
  const head=parseLine(lines[0]);
  const todo={id:Date.now(),text:head.text,completed:false,category:activeTab==='Tous'?'Général':activeTab,
    priority:head.prio,duration:'',tags:head.tags,notes:'',paused:false,created_at:new Date().toISOString(),updated_at:new Date().toISOString(),subtasks:[]};
  lines.slice(1).forEach((l,i)=>{ const p=parseLine(l);
    todo.subtasks.push({id:Date.now()+i+1,text:p.text,completed:false,priority:p.prio,duration:'',tags:p.tags,notes:''}); });
  state.todos.push(todo); save(); queueSync(todo); ta.value=''; ta.rows=1; document.getElementById('autocomplete').classList.add('hidden'); render();
}

// ---- Dependency check ----
function tryComplete(id,isSub,parentId){
  const parent=isSub?findTodo(parentId):null;
  const t=isSub?parent.subtasks.find(s=>s.id==id):findTodo(id);
  if(!t.completed){
    const blockers=refs(t).filter(r=>!r.completed);
    if(blockers.length){
      if(hasCycle(t)){
        document.getElementById('blockedMsg').textContent=`Dépendance circulaire détectée avec "${blockers[0].text}" — validation forcée possible.`;
        document.getElementById('blockedGoto').textContent='Forcer la validation';
        document.getElementById('blockedGoto').onclick=()=>{closeModal('modalBlocked'); finishComplete(t,isSub?parent:t);};
      } else {
        document.getElementById('blockedMsg').textContent=`Cette tâche référence "${blockers[0].text}" qui n'est pas terminée.`;
        document.getElementById('blockedGoto').textContent='Voir la tâche';
        document.getElementById('blockedGoto').onclick=()=>{closeModal('modalBlocked');scrollToTask(blockers[0].id);};
      }
      document.getElementById('modalBlocked').classList.remove('hidden'); return;
    }
  }
  finishComplete(t,isSub?parent:t);
}
function finishComplete(t,cloudTarget){ t.completed=!t.completed; touch(cloudTarget); save(); render(); queueSync(cloudTarget); }

// ---- Swipe ----
function bindSwipe(el,todo){
  let sx=0,sy=0,dx=0,horiz=false;
  el.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;horiz=false;});
  el.addEventListener('touchmove',e=>{
    const cx=e.touches[0].clientX-sx, cy=e.touches[0].clientY-sy;
    if(!horiz && Math.abs(cx)>Math.abs(cy) && Math.abs(cx)>10) horiz=true;
    if(horiz){ e.preventDefault(); dx=cx; el.style.transform=`translateX(${dx}px)`; }
  },{passive:false});
  el.addEventListener('touchend',()=>{
    if(dx>100) tryComplete(todo.id,false);
    else if(dx<-150){ softDelete(todo); return; }
    else if(dx<-75){ todo.paused=!todo.paused; touch(todo); save(); queueSync(todo); render(); return; }
    el.style.transform='translateX(0)'; dx=0;
  });
}

// ---- Suppression annulable ----
let trash=null, trashTimer=null;
function softDelete(todo){
  state.todos=state.todos.filter(t=>t.id!==todo.id); save(); render();
  trash=todo; showUndo();
  clearTimeout(trashTimer);
  trashTimer=setTimeout(()=>{ if(trash){ cloudDelete(trash.id); trash=null; hideUndo(); } },5000);
}
function showUndo(){
  let bar=document.getElementById('undoBar');
  if(!bar){ bar=document.createElement('div'); bar.id='undoBar';
    bar.className='fixed left-1/2 -translate-x-1/2 bottom-6 bg-slate-800 text-white rounded-full px-4 py-2 text-sm flex items-center gap-3 z-50';
    bar.style.bottom='calc(1.5rem + env(safe-area-inset-bottom,0px))';
    document.body.appendChild(bar); }
  bar.innerHTML=`Tâche supprimée <button onclick="undoDelete()" class="font-bold underline">Annuler</button>`;
}
function hideUndo(){ const bar=document.getElementById('undoBar'); if(bar) bar.remove(); }
function undoDelete(){
  if(!trash) return; clearTimeout(trashTimer);
  state.todos.push(trash); trash=null; save(); render(); hideUndo();
}
window.undoDelete=undoDelete;

// ---- Zoom ----
function setZoom(v){ zoomVal=+v; render(); }

// ---- Render ----
function render(){
  renderTabs();
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const showPaused=document.getElementById('showPaused').checked;
  const incTags=[],excTags=[]; q.split(/\s+/).forEach(w=>{ if(w.startsWith('-#')) excTags.push(w.slice(2)); else if(w.startsWith('#')) incTags.push(w.slice(1)); });
  const freeText=q.replace(/-?#\S+/g,'').trim();
  let list=state.todos.filter(t=>activeTab==='Tous'||t.category===activeTab)
    .filter(t=>showPaused|| !t.paused)
    .filter(t=>!freeText||t.text.toLowerCase().includes(freeText)||(t.tags||[]).some(g=>g.toLowerCase().includes(freeText)))
    .filter(t=>incTags.every(g=>(t.tags||[]).map(x=>x.toLowerCase()).includes(g)))
    .filter(t=>!excTags.some(g=>(t.tags||[]).map(x=>x.toLowerCase()).includes(g)));
  const sort=document.getElementById('sortSel').value;
  list=list.slice().sort((a,b)=> sort==='asc'?a.created_at.localeCompare(b.created_at): sort==='prio'?b.priority-a.priority: b.created_at.localeCompare(a.created_at));

  document.getElementById('activeTabLabel').textContent=activeTab;
  const avg=list.length?Math.round(list.reduce((s,t)=>s+prog(t),0)/list.length):0;
  document.getElementById('activePct').textContent=avg+'%';
  const gb=document.getElementById('globalBar'); gb.style.width=avg+'%'; gb.className='h-2 rounded '+progClass(avg);

  const main=document.getElementById('list');
  if(zoomVal<=30){
    main.className='p-3 grid gap-2'; main.style.gridTemplateColumns=`repeat(auto-fill,minmax(28px,1fr))`;
    main.innerHTML=list.map(t=>`<div id="task-${t.id}" class="cube ${progClass(prog(t))}" title="${esc(t.text)}" onclick="openModal(${t.id})"></div>`).join('');
    return;
  }
  // Zoom 31-100 : toujours 1 colonne, la carte rétrécit avant de basculer en cubes
  const size=zoomVal>=70?'full':zoomVal>=50?'med':'sm';
  const pad=size==='full'?'p-3':size==='med'?'p-2':'p-1.5';
  const titleCls=size==='full'?'font-semibold':size==='med'?'font-semibold text-xs':'font-semibold text-xs';
  const showDetails=size!=='sm';
  main.className='p-3 grid gap-2'; main.style.gridTemplateColumns='1fr';
  main.innerHTML='';
  list.forEach(t=>{
    const p=prog(t); const bl=backlinks(t.id); const syncing=pendingSync.has(t.id);
    const wrap=document.createElement('div'); wrap.className='swipe-wrap';
    wrap.innerHTML=`
      <div class="swipe-bg justify-start" style="background:#22c55e">✓ Valider</div>
      <div class="swipe-bg justify-end" style="background:#f97316">⏸ Pause</div>
      <div class="swipe-card card-p${t.priority} ${pad}" id="task-${t.id}" onclick="openModal(${t.id})">
        <div class="flex items-start gap-2">
          <input type="checkbox" ${t.completed?'checked':''} onclick="event.stopPropagation();tryComplete(${t.id},false)">
          <div class="flex-1 min-w-0">
            <div class="${titleCls} ${t.completed?'line-through text-slate-400':''}">${linkify(t.text)} ${syncing?'<span class="text-amber-500" title="Synchronisation…">●</span>':''}</div>
            ${showDetails?`<div class="text-xs text-slate-500">${t.category} ${t.duration?('· '+esc(t.duration)):''} ${t.paused?'· ⏸':''}</div>
            <div class="flex gap-1 flex-wrap mt-1">${(t.tags||[]).map(g=>`<span class="bg-slate-100 rounded px-1 text-xs">#${esc(g)}</span>`).join('')}</div>
            ${t.notes?`<div class="text-xs mt-1 text-slate-600">${linkify(t.notes)}</div>`:''}
            ${bl.length?`<div class="text-xs mt-1 text-indigo-500">↳ Cité dans : ${bl.map(b=>`<a href="#" class="underline" onclick="event.stopPropagation();scrollToTask(${b.id})">${esc(b.text)}</a>`).join(', ')}</div>`:''}
            ${t.subtasks.length?`<div class="w-full h-1.5 bg-slate-200 rounded mt-2"><div class="h-1.5 rounded ${progClass(p)}" style="width:${p}%"></div></div>`:''}
            <div class="mt-1 space-y-1">
              ${t.subtasks.map(s=>`<div class="flex items-center gap-2 pl-2 border-l card-p${s.priority}">
                <input type="checkbox" ${s.completed?'checked':''} onclick="event.stopPropagation();toggleSub(${t.id},${s.id})">
                <span class="text-xs ${s.completed?'line-through text-slate-400':''}">${linkify(s.text)}</span>
              </div>`).join('')}
            </div>`:''}
          </div>
        </div>
      </div>`;
    bindSwipe(wrap.querySelector('.swipe-card'),t);
    main.appendChild(wrap);
  });
}
function toggleSub(tid,sid){ const t=findTodo(tid); const s=t.subtasks.find(x=>x.id==sid); s.completed=!s.completed; touch(t); save(); render(); queueSync(t); }

// ---- Modales ----
function toggleSearch(){ document.getElementById('searchBar').classList.toggle('hidden'); }
function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
function openSettings(){ renderCatManager(); document.getElementById('modalSettings').classList.remove('hidden'); }
function renderCatManager(){
  document.getElementById('catManager').innerHTML=state.cats.filter(c=>c!=='Tous').map(c=>`
    <div class="flex gap-1 items-center">
      <input value="${esc(c)}" onchange="renameCategory('${esc(c)}',this.value)" class="border rounded px-1 py-0.5 flex-1 text-xs">
      <button onclick="deleteCategory('${esc(c)}')" class="text-red-500 text-xs px-1">✕</button>
    </div>`).join('');
}
function addCategory(){
  const inp=document.getElementById('newCat'); const name=inp.value.trim(); if(!name||state.cats.includes(name)) return;
  state.cats.push(name); save(); inp.value=''; renderCatManager(); renderTabs();
}
function renameCategory(oldName,newName){
  newName=newName.trim(); if(!newName||state.cats.includes(newName)) { renderCatManager(); return; }
  state.cats=state.cats.map(c=>c===oldName?newName:c);
  state.todos.forEach(t=>{ if(t.category===oldName){ t.category=newName; cloudUpsert(t); } });
  if(activeTab===oldName) activeTab=newName;
  save(); renderCatManager(); render();
}
function deleteCategory(name){
  state.cats=state.cats.filter(c=>c!==name);
  state.todos.forEach(t=>{ if(t.category===name){ t.category='Général'; cloudUpsert(t); } });
  if(activeTab===name) activeTab='Tous';
  save(); renderCatManager(); render();
}
function openModal(id){
  editingId=id; const t=findTodo(id);
  const sel=document.getElementById('edCat'); sel.innerHTML=state.cats.filter(c=>c!=='Tous').map(c=>`<option ${c===t.category?'selected':''}>${esc(c)}</option>`).join('');
  document.getElementById('edText').value=t.text; document.getElementById('edPrio').value=t.priority;
  document.getElementById('edDur').value=t.duration||''; document.getElementById('edTags').value=(t.tags||[]).join(',');
  document.getElementById('edNotes').value=t.notes||'';
  document.getElementById('modalEdit').classList.remove('hidden');
}
function saveModalChanges(){
  const t=findTodo(editingId);
  t.text=document.getElementById('edText').value; t.category=document.getElementById('edCat').value;
  t.priority=+document.getElementById('edPrio').value; t.duration=document.getElementById('edDur').value;
  t.tags=document.getElementById('edTags').value.split(',').map(s=>s.trim()).filter(Boolean);
  t.notes=document.getElementById('edNotes').value;
  touch(t); save(); closeModal('modalEdit'); render(); queueSync(t);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state.todos,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='todoapp_backup.json'; a.click();
}
function importJSON(e){
  const f=e.target.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ state.todos=JSON.parse(r.result); save(); render(); }catch(err){ alert('Fichier invalide'); } };
  r.readAsText(f);
}
// ---- Sync Supabase (base secondaire, local-first) ----
const LS_SUPA='todoapp_supabase_config';
let sb=null;
function initSupabase(){
  const cfg=JSON.parse(localStorage.getItem(LS_SUPA)||'null'); if(!cfg) return;
  try{ sb=window.supabase.createClient(cfg.url,cfg.key); setSupaStatus('Connecté à '+cfg.url); }
  catch(e){ setSupaStatus('Erreur de connexion'); }
}
function setSupaStatus(msg){ const el=document.getElementById('supaStatus'); if(el) el.textContent=msg; }
function connectSupabase(){
  const url=document.getElementById('supaUrl').value.trim(), key=document.getElementById('supaKey').value.trim();
  if(!url||!key){ setSupaStatus('URL et clé requises'); return; }
  localStorage.setItem(LS_SUPA,JSON.stringify({url,key}));
  initSupabase(); syncCloud();
}
function disconnectSupabase(){ localStorage.removeItem(LS_SUPA); sb=null; setSupaStatus('Déconnecté'); }
// Toute écriture locale est immédiate ; la répercussion Supabase est asynchrone et non bloquante.
async function cloudUpsert(todo){ if(!sb) return; try{ await sb.from('todos').upsert(todo); }catch(e){ console.warn('sync upsert échoué',e); } }
async function cloudDelete(id){ if(!sb) return; try{ await sb.from('todos').delete().eq('id',id); }catch(e){ console.warn('sync delete échoué',e); } }
async function queueSync(t){ if(!t||!sb) return; pendingSync.add(t.id); render(); await cloudUpsert(t); pendingSync.delete(t.id); render(); }
function syncCloud(){
  if(!sb){ setSupaStatus('Non connecté — configurez Supabase dans ⚙️'); return; }
  setSupaStatus('Synchronisation…');
  sb.from('todos').select('*').then(({data,error})=>{
    if(error){ setSupaStatus('Erreur : '+error.message); return; }
    if(data){
      const byId={}; state.todos.forEach(t=>byId[t.id]=t);
      data.forEach(remote=>{
        const local=byId[remote.id];
        // Dernier écrit gagne, comparé sur updated_at, pour éviter d'écraser une modification locale plus récente.
        if(!local || new Date(remote.updated_at||0) >= new Date(local.updated_at||0)) byId[remote.id]=remote;
      });
      state.todos=Object.values(byId); save(); render();
    }
    setSupaStatus('Synchronisé ('+new Date().toLocaleTimeString()+')');
  });
}
(function(){ const cfg=JSON.parse(localStorage.getItem(LS_SUPA)||'null'); if(cfg){ document.getElementById('supaUrl').value=cfg.url; document.getElementById('supaKey').value=cfg.key; } })();
window.openSettings=openSettings; window.exportJSON=exportJSON; window.importJSON=importJSON;
window.openModal=openModal; window.saveModalChanges=saveModalChanges; window.scrollToTask=scrollToTask; window.syncCloud=syncCloud;
window.connectSupabase=connectSupabase; window.disconnectSupabase=disconnectSupabase;
window.addCategory=addCategory; window.renameCategory=renameCategory; window.deleteCategory=deleteCategory;

renderTabs(); render(); initSupabase();
</script>
