<!-- TODOAPP - Version 1.0.5 -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOAPP - v1.0.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 sm:p-8">

  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
    
    <!-- En-tête -->
    <header class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-extrabold text-slate-900">TODOAPP</h1>
      <span class="text-xs font-semibold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">v1.0.5</span>
    </header>

    <!-- Zone de Saisie -->
    <form onsubmit="addTask(event)" class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="task-input" 
        placeholder="Ajouter une tâche..." 
        class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
        required
      >
      <button type="submit" class="bg-slate-900 text-white rounded-2xl px-5 font-bold text-xl hover:bg-slate-800 transition-colors">+</button>
    </form>

    <!-- Liste des tâches -->
    <ul id="task-list" class="space-y-2"></ul>

    <!-- Compteur -->
    <footer class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400 flex justify-between">
      <span id="task-count">0 tâche</span>
    </footer>

  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todoapp_v105') || '[]');

    function saveAndRender() {
      localStorage.setItem('todoapp_v105', JSON.stringify(todos));
      render();
    }

    function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      todos.unshift({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = '';
      saveAndRender();
    }

    function toggleTask(id) {
      todos = todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
      saveAndRender();
    }

    function deleteTask(id) {
      todos = todos.filter(t => t.id !== id);
      saveAndRender();
    }

    function render() {
      const listEl = document.getElementById('task-list');
      const countEl = document.getElementById('task-count');
      listEl.innerHTML = '';

      if (todos.length === 0) {
        listEl.innerHTML = `<li class="text-center text-slate-400 text-sm py-8">Aucune tâche pour le moment</li>`;
      } else {
        todos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3 rounded-2xl border transition-all ${todo.completed ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200'}`;
          
          li.innerHTML = `
            <div class="flex items-center gap-3 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleTask(${todo.id})">
              <input 
                type="checkbox" 
                ${todo.completed ? 'checked' : ''} 
                class="w-5 h-5 accent-slate-900 rounded cursor-pointer"
                onclick="event.stopPropagation(); toggleTask(${todo.id})"
              >
              <span class="text-sm font-medium ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'} truncate">
                ${escapeHtml(todo.text)}
              </span>
            </div>
            <button 
              onclick="deleteTask(${todo.id})" 
              class="text-slate-400 hover:text-rose-500 font-bold px-2 py-1 text-sm rounded-lg transition-colors"
              title="Supprimer"
            >&times;</button>
          `;
          listEl.appendChild(li);
        });
      }

      const activeCount = todos.filter(t => !t.completed).length;
      countEl.textContent = `${activeCount} tâche${activeCount > 1 ? 's' : ''} restante${activeCount > 1 ? 's' : ''}`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    render();
  </script>
</body>
</html>
