<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TODOAPP</title>
  
  <!-- Configuration PWA iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TODOAPP">
  
  <!-- Tailwind CSS & Supabase JS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col justify-between pt-12 pb-6 px-4 select-none">

  <div class="max-w-md mx-auto w-full">
    <!-- En-tête -->
    <header class="mb-6 flex justify-between items-center">
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">TODOAPP</h1>
      <span id="counter" class="text-xs font-semibold uppercase tracking-wider bg-slate-200 text-slate-600 py-1 px-3 rounded-full">Chargement...</span>
    </header>

    <!-- Champ de saisie -->
    <form id="todo-form" class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="todo-input" 
        placeholder="Ajouter une tâche..." 
        required
        class="flex-1 bg-white border border-slate-300 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-slate-900 shadow-sm"
      >
      <button 
        type="submit" 
        class="bg-slate-900 text-white font-medium px-5 py-3 rounded-2xl active:scale-95 transition-transform shadow-sm"
      >
        +
      </button>
    </form>

    <!-- Liste des tâches -->
    <ul id="todo-list" class="space-y-3"></ul>
  </div>

  <script>
    // Configuration Supabase
    const SUPABASE_URL = "https://bwirwhcetlfwzqswbfwr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6f1T8ttm3Lc0yTSqsHUikA_XW5eo3X7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const counter = document.getElementById('counter');

    let todos = [];

    // Charger les tâches depuis la base de données
    async function fetchTodos() {
      const { data, error } = await supabaseClient
        .from('todos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error("Erreur de chargement :", error);
        return;
      }

      todos = data;
      render();
    }

    // Basculer l'état fini / non fini
    async function toggleTask(id, currentStatus) {
      const { error } = await supabaseClient
        .from('todos')
        .update({ completed: !currentStatus })
        .eq('id', id);

      if (!error) fetchTodos();
    }

    // Supprimer une tâche
    async function deleteTask(id) {
      const { error } = await supabaseClient
        .from('todos')
        .delete()
        .eq('id', id);

      if (!error) fetchTodos();
    }

    // Rendu de l'interface
    function render() {
      list.innerHTML = '';
      const activeCount = todos.filter(t => !t.completed).length;
      counter.textContent = `${activeCount} restante${activeCount > 1 ? 's' : ''}`;

      todos.forEach(todo => {
        const li = document.createElement('li');
        li.className = `flex items-center justify-between p-4 bg-white rounded-2xl shadow-sm border border-slate-200/60 transition-all ${todo.completed ? 'opacity-50' : ''}`;
        
        li.innerHTML = `
          <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask(${todo.id}, ${todo.completed})">
            <div class="w-6 h-6 rounded-full border-2 ${todo.completed ? 'bg-emerald-500 border-emerald-500' : 'border-slate-300'} flex items-center justify-center text-white text-xs font-bold">
              ${todo.completed ? '✓' : ''}
            </div>
            <span class="text-base ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${todo.text}</span>
          </div>
          <button onclick="deleteTask(${todo.id})" class="text-slate-300 hover:text-rose-500 p-1 text-lg leading-none">&times;</button>
        `;
        list.appendChild(li);
      });
    }

    // Ajouter une tâche
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      const { error } = await supabaseClient
        .from('todos')
        .insert([{ text: text, completed: false }]);

      if (!error) fetchTodos();
    });

    // Chargement initial
    fetchTodos();
  </script>
</body>
</html>
