<!-- TODOAPP - Version 1.4.6 (Zoom System) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TODOAPP - v1.4.6</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      background-color: #0f172a;
      overflow: hidden; 
      height: 100vh;
      margin: 0;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input, select, textarea {
      font-size: 16px !important;
    }
    #splash-screen {
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    #splash-screen.hidden-splash {
      opacity: 0;
      visibility: hidden;
    }
    @keyframes highlightPulse {
      0% { background-color: rgba(250, 204, 21, 0.6); transform: scale(1.02); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
      100% { background-color: transparent; transform: scale(1); box-shadow: none; }
    }
    .highlight-task {
      animation: highlightPulse 1.5s ease-out;
      z-index: 10;
      position: relative;
    }
    .drop-target-active > div.task-card-bg {
      border-color: #6366f1 !important;
      border-width: 2px !important;
      background-color: #eef2ff !important;
    }
    #category-tabs {
      cursor: pointer;
      user-select: none;
    }

    /* Styles pour le Viewport et Zoom */
    #viewport {
      width: 100%;
      height: calc(100vh - 140px);
      overflow: auto;
      position: relative;
      touch-action: pan-x pan-y;
      /* Suppression des barres de scroll tout en gardant le swipe */
      scrollbar-width: none; 
      -ms-overflow-style: none;
    }
    #viewport::-webkit-scrollbar {
      display: none;
    }

    #zoom-container {
      transform-origin: 0 0;
      will-change: transform, width;
      min-width: 100%;
      padding-bottom: 100px;
      transition: transform 0.1s ease-out, width 0.1s ease-out;
    }

    /* --- BREAKPOINTS DE ZOOM --- */

    /* Mode Liste (100% - 80%) */
    #zoom-container.list-mode #task-tree {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Mode Grille (79% - 30%) */
    #zoom-container.grid-mode #task-tree {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
      align-items: start;
    }

    /* Mode Mini-Blocs / Heatmap (< 30%) */
    #zoom-container.mini-mode #task-tree {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-content: flex-start;
    }
    #zoom-container.mini-mode .task-item-wrapper {
      display: block !important;
      width: 60px !important;
      height: 60px !important;
      margin: 0 !important;
      padding: 0 !important;
      border: none !important;
    }
    #zoom-container.mini-mode .task-card-bg {
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 0 !important;
      border-radius: 12px !important;
      border: none !important;
      box-shadow: none !important;
    }
    #zoom-container.mini-mode .task-card-bg > * {
      display: none !important; 
    }
    
    /* Couleurs des mini-blocs */
    #zoom-container.mini-mode .task-card-bg.mini-red { background-color: #f43f5e !important; }
    #zoom-container.mini-mode .task-card-bg.mini-orange { background-color: #fbbf24 !important; }
    #zoom-container.mini-mode .task-card-bg.mini-green { background-color: #10b981 !important; }
    
    /* Masquer les éléments perturbateurs en mode mini */
    #zoom-container.mini-mode .drag-handle { display: none !important; }

  </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen flex flex-col relative">

  <!-- SUGGESTIONS DE LIENS DE TÂCHES -->

            <button onclick="syncCloud()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center transition-colors" title="Synchroniser">

        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 border-b border-slate-100 scrollbar-none" id="category-tabs"></div>

      <form onsubmit="addTask(event)" class="flex gap-1.5 mb-3 shrink-0 relative">
        <input type="text" id="task-input" placeholder="Ajouter une tâche... (utilisez $ pour lier)" oninput="handleTaskLinkAutocomplete(event)" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900" required>
        <button type="submit" class="bg-slate-900 text-white rounded-xl px-3 py-1.5 font-bold text-sm hover:bg-slate-800">+</button>
      </form>

      <!-- VIEWPORT ET CONTENEUR ZOOMABLE -->
      <div id="viewport">
        <div id="zoom-container" class="list-mode">
          <div id="task-tree"></div>
        </div>
      </div>
    </div>

    <footer class="mt-2 pt-2 border-t border-slate-100 text-xs text-slate-400 flex justify-between items-center pb-4 shrink-0">
      <span id="task-count">0 tâche</span>
      <span id="sync-status" class="text-emerald-600 font-medium">● Synchro Temps Réel</span>

  <!-- MODALE ÉDITION -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeModalOnOut(event)" onkeydown="handleModalKeyDown(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">

        <div class="grid grid-cols-5 gap-1.5" id="modal-priority-container">
          <button type="button" onclick="setModalPriority(0)" data-prio="0" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">Aucun</button>

          <button type="button" onclick="setModalPriority(2)" data-prio="2" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">2</button>
          <button type="button" onclick="setModalPriority(3)" data-prio="3" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">3</button>
          <button type="button" onclick="setModalPriority(4)" data-prio="4" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">4</button>

      </div>
      <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-bold text-slate-700 uppercase">Mise en pause</span>
          <input type="checkbox" id="modal-paused" onchange="togglePauseOptions()" class="w-5 h-5 accent-slate-900 rounded">
        </label>
        <div id="pause-options" class="hidden pt-2 border-t border-slate-200 space-y-1.5">
          <span class="text-[11px] font-semibold text-slate-500 block">Option de pause :</span>
          <div class="flex gap-4 text-xs font-medium text-slate-700">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="griser" class="accent-slate-900"> Griser</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="masquer" class="accent-slate-900"> Masquer</label>

      <button onclick="saveModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl shadow-md">Enregistrer</button>

  <!-- MODALE RÉGLAGES -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeSettingsModalOnOut(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900">Réglages</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>

        <select id="sort-select" onchange="setSortOption(this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
          <option value="perso">Personnalisé (Glisser-Déposer)</option>
          <option value="date-desc">Plus récents d'abord</option>
          <option value="date-asc">Plus anciens d'abord</option>
          <option value="prio-desc">Priorité haute d'abord</option>
          <option value="prio-asc">Priorité basse d'abord</option>
        </select>
      </div>
      <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
        <div>
          <div class="text-xs font-bold text-slate-800">Version de l'application</div>
          <div class="text-[11px] text-slate-500">v1.4.6 (Cache: todoapp_v146)</div>
        </div>
        <button onclick="forceAppUpdate()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800">Forcer MaJ</button>
      </div>
    </div>
  </div>

  <script>
    const CACHE_NAME = 'todoapp_v146';

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = '${CACHE_NAME}';
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => {
          e.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log(err));
    }

    function forceAppUpdate() {
      if ('caches' in window) { caches.keys().then(names => names.forEach(n => caches.delete(n))); }
      localStorage.clear();
      window.location.reload(true);
    }

    // SYSTÈME DE ZOOM & GESTURES DYNAMIQUE
    let currentZoom = 0.9; // Optimal (90%)
    const minZoom = 0.1;   // Permet d'atteindre le mode Heatmap (< 30%)
    const maxZoom = 1.0;   // Bloqué à 100%

    function applyZoom(newZoom) {
      currentZoom = Math.max(minZoom, Math.min(maxZoom, newZoom));
      const container = document.getElementById('zoom-container');
      const range = document.getElementById('zoom-range');

      if (container) {
        // Ajustement dynamique de la largeur inverse au zoom pour éviter le vide horizontal
        container.style.width = (100 / currentZoom) + '%';
        container.style.transform = `scale(${currentZoom})`;
        
        // Routage des comportements par Breakpoints
        if (currentZoom <= 0.29) {
          container.className = 'mini-mode';
        } else if (currentZoom <= 0.79) {
          container.className = 'grid-mode';
        } else {
          container.className = 'list-mode';
        }
      }
      if (range) range.value = currentZoom;
    }

    function adjustZoom(delta) {
      applyZoom(currentZoom + delta);
    }

    function onZoomSliderChange(val) {
      applyZoom(parseFloat(val));
    }

    // 1. Ctrl + Scroll (PC)
    const viewportEl = document.getElementById('viewport');
    if (viewportEl) {
      viewportEl.addEventListener('wheel', (e) => {
        if (e.ctrlKey) {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.05 : -0.05;
          applyZoom(currentZoom + delta);
        }
      }, { passive: false });

      // 2. Pinch to Zoom (iOS / Tactile)
      let initialTouchDistance = null;
      let initialZoomLevel = currentZoom;
      
      viewportEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialTouchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          initialZoomLevel = currentZoom;
        }
      }, { passive: true });

      viewportEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialTouchDistance !== null) {
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = currentDistance / initialTouchDistance;
          applyZoom(initialZoomLevel * factor);
        }
      }, { passive: true });

      viewportEl.addEventListener('touchend', () => {
        initialTouchDistance = null;
      });
    }

    // Gestion du scroll horizontal des catégories
    document.addEventListener('DOMContentLoaded', () => {
      const catTabs = document.getElementById('category-tabs');
      if (catTabs) {
        catTabs.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) { e.preventDefault(); catTabs.scrollLeft += e.deltaY * 1.5; }
        }, { passive: false });

        let isDown = false, startX, scrollLeft, isDragging = false;
        catTabs.addEventListener('mousedown', (e) => {
          isDown = true; isDragging = false;
          startX = e.pageX - catTabs.offsetLeft; scrollLeft = catTabs.scrollLeft;
        });
        catTabs.addEventListener('mouseleave', () => { isDown = false; });
        catTabs.addEventListener('mouseup', () => { isDown = false; });
        catTabs.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - catTabs.offsetLeft;
          const walk = (x - startX) * 2;
          if (Math.abs(walk) > 5) isDragging = true;
          catTabs.scrollLeft = scrollLeft - walk;
        });
        catTabs.addEventListener('click', (e) => {
          if (isDragging) { e.preventDefault(); e.stopPropagation(); }
        }, { capture: true });
      }
    });

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://bwirwhcetlfwzqswbfwr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6f1T8ttm3Lc0yTSqsHUikA_XW5eo3X7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STORAGE_KEY = 'todoapp_tasks_v146';

    function generateSafeId() {
      return Math.floor((Date.now() % 1000000000)) * 1000 + Math.floor(Math.random() * 1000);
    }

    function sanitizeTodosList(list) {
      if (!Array.isArray(list)) return [];
      return list.map(t => {
        let safeId = Number(t.id);
        if (!safeId || isNaN(safeId)) safeId = generateSafeId();
        let safeParentId = t.parent_id ? Number(t.parent_id) : null;
        if (safeParentId && isNaN(safeParentId)) safeParentId = null;

        return {
          ...t,
          id: safeId,
          parent_id: safeParentId,
          pauseMode: t.pauseMode || t.pause_mode || 'griser',
          manual_order: Number(t.manual_order || 0)
        };
      });
    }

    let rawLocal = localStorage.getItem(STORAGE_KEY) || 
                   localStorage.getItem('todoapp_tasks_v145') || '[]';
    
    let todos = sanitizeTodosList(JSON.parse(rawLocal));

    // GESTION DYNAMIQUE DES CATÉGORIES
    const BASE_CATEGORIES = ["Général", "Maison", "Jardin", "Voiture", "Aster", "Aimé"];
    let categories = [];
    let activeCategory = "Tout";

    function updateCategories() {
      const localCustomCats = JSON.parse(localStorage.getItem('todoapp_custom_cats') || '[]');
      const usedCategories = todos.map(t => t.category).filter(c => c && c.trim() !== '');
      
      const mergedCats = new Set([...BASE_CATEGORIES, ...localCustomCats, ...usedCategories]);
      
      mergedCats.delete('Tout');
      mergedCats.delete('Masquées');
      
      categories = ['Tout', ...Array.from(mergedCats), 'Masquées'];
      
      if (!categories.includes(activeCategory)) activeCategory = "Tout";
      
      renderCategoryTabs();
    }

    let currentSort = localStorage.getItem('todoapp_sort') || 'perso';
    let currentEditing = { id: null, parentId: null, selectedCategory: 'Général', selectedPriority: 0 };
    let currentLinkInput = null;
    let draggedTaskId = null;

    function showDebugError(msg) {
      const banner = document.getElementById('debug-banner');
      const msgEl = document.getElementById('debug-msg');
      if (banner && msgEl) {
        msgEl.textContent = "Erreur Supabase: " + msg;
        banner.classList.remove('hidden');
      }
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      updateCategories();
      render();
    }

    const splashStartTime = Date.now();
    function hideSplashScreen() {
      const elapsed = Date.now() - splashStartTime;
      const remaining = Math.max(0, 500 - elapsed);
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden-splash');
          setTimeout(() => splash.style.display = 'none', 450);
        }
      }, remaining);
    }

    function updateSyncStatus(online, msg) {
      const syncStatus = document.getElementById('sync-status');
      const syncDot = document.getElementById('sync-dot');
      if (syncStatus) {
        syncStatus.textContent = online ? "● Synchro Temps Réel" : "● " + (msg || "Erreur BDD");
        syncStatus.className = online ? "text-emerald-600 font-medium" : "text-amber-600 font-medium";
      }
      if (syncDot) {
        syncDot.className = online ? "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0" : "w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0";
      }
    }

    async function pushTaskToCloud(todo) {
      if (!todo) return;
      let safeId = Number(todo.id);
      if (!safeId || isNaN(safeId)) { safeId = generateSafeId(); todo.id = safeId; }
      let safeParentId = todo.parent_id ? Number(todo.parent_id) : null;
      if (safeParentId && isNaN(safeParentId)) safeParentId = null;

      const payload = {
        id: safeId,
        text: todo.text || '',
        completed: !!todo.completed,
        category: todo.category || 'Général',
        priority: Number(todo.priority || 0),
        tags: Array.isArray(todo.tags) ? todo.tags : [],
        notes: todo.notes || '',
        paused: !!todo.paused,
        pause_mode: todo.pauseMode || 'griser',
        parent_id: safeParentId,
        manual_order: Number(todo.manual_order || 0)
      };

      try {
        const res = await supabaseClient.from('todos').upsert([payload]).select();
        if (res.error) {
          console.error("Supabase Push Error:", res.error);
          showDebugError(res.error.message);
          updateSyncStatus(false, res.error.message);
        } else updateSyncStatus(true);
      } catch (err) {
        console.error("Exception pushTaskToCloud:", err);
        showDebugError("Erreur Réseau");
        updateSyncStatus(false, "Hors-ligne");
      }
    }

    let realtimeChannel = null;
    function initRealtime() {
      if (realtimeChannel) {
        try { supabaseClient.removeChannel(realtimeChannel); } catch(e){}
      }
      realtimeChannel = supabaseClient
        .channel('todos_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => syncCloud())
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') updateSyncStatus(true);
          else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') updateSyncStatus(false, "Canal fermé");
        });
    }

    window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { initRealtime(); syncCloud(); } });
    window.addEventListener('focus', () => { initRealtime(); syncCloud(); });
    window.addEventListener('online', () => { initRealtime(); syncCloud(); });

    async function syncCloud() {
      const syncIcon = document.getElementById('sync-icon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const { data, error } = await supabaseClient.from('todos').select('*');
        if (error) {
          console.error("Erreur Sync Supabase:", error);
          showDebugError(error.message);
          updateSyncStatus(false, error.message);
          hideSplashScreen();
          return;
        }

        updateSyncStatus(true);
        if (Array.isArray(data)) {
          const serverMap = new Map();
          data.forEach(item => { const sId = Number(item.id); if (sId && !isNaN(sId)) serverMap.set(sId, item); });
          const mergedTodos = [];
          const processedServerIds = new Set();

          todos.forEach(localTask => {
            const lId = Number(localTask.id);
            if (!lId || isNaN(lId)) return;
            if (serverMap.has(lId)) {
              const sItem = serverMap.get(lId);
              processedServerIds.add(lId);
              mergedTodos.push({
                id: lId,
                text: sItem.text || sItem.title || localTask.text,
                completed: sItem.completed !== undefined ? !!sItem.completed : localTask.completed,
                category: sItem.category || localTask.category || 'Général',
                priority: sItem.priority !== undefined ? Number(sItem.priority) : (localTask.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : (localTask.tags || []),
                notes: sItem.notes !== undefined ? sItem.notes : (localTask.notes || ''),
                paused: sItem.paused !== undefined ? !!sItem.paused : (localTask.paused || false),
                pauseMode: sItem.pause_mode || localTask.pauseMode || 'griser',
                collapsed: !!localTask.collapsed,
                parent_id: (sItem.parent_id && !isNaN(Number(sItem.parent_id))) ? Number(sItem.parent_id) : null,
                manual_order: sItem.manual_order !== undefined ? Number(sItem.manual_order) : Number(localTask.manual_order || 0),
                created_at: localTask.created_at || sItem.created_at || new Date().toISOString()
              });
            }
          });

          data.forEach(sItem => {
            const sId = Number(sItem.id);
            if (sId && !isNaN(sId) && !processedServerIds.has(sId)) {
              mergedTodos.push({
                id: sId,
                text: sItem.text || sItem.title || '',
                completed: !!sItem.completed,
                category: sItem.category || 'Général',
                priority: Number(sItem.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : [],
                notes: sItem.notes || '',
                paused: !!sItem.paused,
                pauseMode: sItem.pause_mode || 'griser',
                collapsed: false,
                parent_id: (sItem.parent_id && !isNaN(Number(sItem.parent_id))) ? Number(sItem.parent_id) : null,
                manual_order: Number(sItem.manual_order || 0),
                created_at: sItem.created_at || new Date().toISOString()
              });
            }
          });
          todos = sanitizeTodosList(mergedTodos);
          saveLocal();
        }
      } catch (err) {
        console.error("Exception syncCloud:", err);
        showDebugError("Erreur réseau");
        updateSyncStatus(false, "Hors-ligne");
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        hideSplashScreen();
      }
    }

    async function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;
      const targetCat = (activeCategory === 'Tout' || activeCategory === 'Masquées') ? 'Général' : activeCategory;
      
      const categoryTasks = todos.filter(t => t.parent_id === null);
      const newOrder = categoryTasks.length > 0 ? Math.min(...categoryTasks.map(t => t.manual_order || 0)) - 10 : 0;

      const newTodo = {
        id: generateSafeId(),
        text: text, completed: false, category: targetCat, priority: 0, tags: [], notes: '',
        paused: false, pauseMode: 'griser', collapsed: false, parent_id: null, manual_order: newOrder, created_at: new Date().toISOString()
      };
      todos.unshift(newTodo);
      input.value = '';
      saveLocal();
      await pushTaskToCloud(newTodo);
      await syncCloud();
    }

    function addSubtask(e, parentId) {
      if (e) e.stopPropagation();
      const parent = todos.find(t => t.id === Number(parentId));
      if (!parent) return;

      currentEditing = { id: 'new-subtask', parentId: parent.id, selectedCategory: parent.category || 'Général', selectedPriority: 0 };

    function toggleCollapse(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === Number(id));
      if (!task) return;
      task.collapsed = !task.collapsed;
      saveLocal();
    }

    function uncollapseAncestors(taskId, updatedList = []) {
      const task = todos.find(t => t.id === taskId);
      if (task && task.parent_id) {
        const parent = todos.find(t => t.id === task.parent_id);
        if (parent && parent.collapsed) {
          parent.collapsed = false;
          updatedList.push(parent);
        }
        uncollapseAncestors(parent.id, updatedList);
      }
    }

    function uncheckDescendants(taskId, updatedList) {
      const children = todos.filter(t => t.parent_id === taskId);
      for (const child of children) {
        if (child.completed) {
          child.completed = false;
          if (!updatedList.some(u => u.id === child.id)) updatedList.push(child);
        }
        uncheckDescendants(child.id, updatedList);
      }
    }

    function uncheckAncestors(parentId, updatedList) {
      if (!parentId) return;
      const parent = todos.find(t => t.id === parentId);
      if (parent && parent.completed) {
        parent.completed = false;
        if (!updatedList.some(u => u.id === parent.id)) updatedList.push(parent);
        if (parent.parent_id) uncheckAncestors(parent.parent_id, updatedList);
      }
    }

    async function toggleTask(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === Number(id));
      if (!task) return;
      const newStatus = !task.completed;
      const updatedTasks = [];
      task.completed = newStatus;
      updatedTasks.push(task);
      if (newStatus === false) {
        uncheckDescendants(task.id, updatedTasks);
        if (task.parent_id) uncheckAncestors(task.parent_id, updatedTasks);
      }
      saveLocal();
      for (const t of updatedTasks) { await pushTaskToCloud(t); }
      await syncCloud();
    }

    async function deleteTask(e, id) {
      if (e) e.stopPropagation();
      const numericId = Number(id);
      const idsToDelete = [];
      function collectIds(targetId) {
        idsToDelete.push(targetId);
        todos.filter(t => t.parent_id === targetId).forEach(child => collectIds(child.id));
      }
      collectIds(numericId);
      todos = todos.filter(t => !idsToDelete.includes(t.id));
      saveLocal();
      try { for (const delId of idsToDelete) { await supabaseClient.from('todos').delete().eq('id', delId); } }
      catch (err) { console.error("Erreur deleteTask:", err); }
      await syncCloud();
    }

    function getAllExistingTags() {

    function handleTagAutocomplete(e) {
      const val = e.target.value;
      const parts = val.split(',');
      const currentPart = parts[parts.length - 1].trim().toLowerCase();
      const suggestionsList = document.getElementById('tag-suggestions');
      if (!currentPart) { suggestionsList.classList.add('hidden'); return; }
      const allTags = getAllExistingTags();
      const filtered = allTags.filter(t => t.toLowerCase().includes(currentPart) && !parts.slice(0, -1).map(p => p.trim()).includes(t));
      if (filtered.length > 0) {
        suggestionsList.innerHTML = filtered.map(tag => `
          <li class="px-3 py-2 text-xs font-medium hover:bg-slate-100 cursor-pointer border-b border-slate-50 last:border-0" onclick="insertTagSuggestion('${escapeHtml(tag)}')">
            #${escapeHtml(tag)}
          </li>
        `).join('');
        suggestionsList.classList.remove('hidden');
      } else suggestionsList.classList.add('hidden');
    }

    function insertTagSuggestion(tag) {
      const input = document.getElementById('modal-tags');
      const parts = input.value.split(',');
      parts[parts.length - 1] = ' ' + tag;
      input.value = parts.join(', ') + ', ';
      document.getElementById('tag-suggestions').classList.add('hidden');
      input.focus();

    function handleTaskLinkAutocomplete(e) {
      const input = e.target;
      const val = input.value;
      const cursorPos = input.selectionStart || 0;
      const textBeforeCursor = val.substring(0, cursorPos);
      const match = textBeforeCursor.match(/\$([^\s$]*)$/);
      
      const suggestionsList = document.getElementById('task-link-suggestions');
      
      if (match) {
        currentLinkInput = input;
        const linkSearchTerm = match[1].toLowerCase();
        const filteredTasks = todos.filter(t => 
            t.text.toLowerCase().includes(linkSearchTerm) && 
            t.id !== currentEditing.id
        );
        
        if (filteredTasks.length > 0) {
          const rect = input.getBoundingClientRect();
          suggestionsList.style.top = (rect.bottom + window.scrollY + 5) + 'px';
          suggestionsList.style.left = rect.left + 'px';
          
          suggestionsList.innerHTML = filteredTasks.map(t => `
            <li class="px-3 py-2 font-medium hover:bg-slate-100 cursor-pointer border-b border-slate-50 last:border-0 truncate" onmousedown="insertTaskLink(event, ${t.id})">
              ${escapeHtml(t.text)}
            </li>
          `).join('');
          suggestionsList.classList.remove('hidden');
        } else {
          suggestionsList.classList.add('hidden');
        }
      } else {
        suggestionsList.classList.add('hidden');
        currentLinkInput = null;
      }
    }

    function insertTaskLink(e, taskId) {
      if (e) e.preventDefault();
      if (!currentLinkInput) return;
      
      const val = currentLinkInput.value;
      const cursorPos = currentLinkInput.selectionStart;
      const textBeforeCursor = val.substring(0, cursorPos);
      const textAfterCursor = val.substring(cursorPos);
      
      const match = textBeforeCursor.match(/\$([^\s$]*)$/);
      if (match) {
        const startIdx = match.index;
        const newTextBefore = textBeforeCursor.substring(0, startIdx) + `[[${taskId}]] `;
        currentLinkInput.value = newTextBefore + textAfterCursor;
        currentLinkInput.selectionStart = currentLinkInput.selectionEnd = newTextBefore.length;
      }
      document.getElementById('task-link-suggestions').classList.add('hidden');
      currentLinkInput.focus();
    }

    document.addEventListener('mousedown', (e) => {
      const suggestionsList = document.getElementById('task-link-suggestions');
      if (!suggestionsList.contains(e.target)) suggestionsList.classList.add('hidden');

    async function saveModal() {
      const title = document.getElementById('modal-title').value.trim();
      if (!title) return;
      const rawTags = document.getElementById('modal-tags').value;
      const tags = rawTags.split(',').map(t => t.trim()).filter(Boolean);
      const notes = document.getElementById('modal-notes').value.trim();
      const paused = document.getElementById('modal-paused').checked;
      const pauseModes = document.getElementsByName('pause-mode');
      let pauseMode = 'griser';
      pauseModes.forEach(r => { if (r.checked) pauseMode = r.value; });

      if (currentEditing.id === 'new-subtask') {
        const parent = todos.find(t => t.id === currentEditing.parentId);
        if (parent) parent.collapsed = false;

        const siblings = todos.filter(t => t.parent_id === currentEditing.parentId);
        const newOrder = siblings.length > 0 ? Math.min(...siblings.map(t => t.manual_order || 0)) - 10 : 0;

        const newSub = {
          id: generateSafeId(),
          text: title, completed: false, category: currentEditing.selectedCategory, priority: currentEditing.selectedPriority, tags: tags, notes: notes,
          paused: paused, pauseMode: pauseMode, collapsed: false, parent_id: currentEditing.parentId, manual_order: newOrder, created_at: new Date().toISOString()
        };
        todos.push(newSub);
        saveLocal();
        closeModal();
        await pushTaskToCloud(newSub);
        if (parent) await pushTaskToCloud(parent);
        await syncCloud();
      } else {
        const task = todos.find(t => t.id === currentEditing.id);
        if (task) {
          task.text = title; task.category = currentEditing.selectedCategory;
          task.priority = currentEditing.selectedPriority; task.tags = tags;
          task.notes = notes; task.paused = paused; task.pauseMode = pauseMode;
          saveLocal();
          closeModal();
          await pushTaskToCloud(task);
          await syncCloud();
        }
      }
    }

      container.innerHTML = categories.map(cat => `
        <button onclick="setCategory('${escapeHtml(cat)}')" class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border ${activeCategory === cat ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">

    function setCategory(cat) { activeCategory = cat; renderCategoryTabs(); render(); }
    
    function hasAncestorWithCategory(parentId, categoryName) {
      if (!parentId) return false;
      const parent = todos.find(t => t.id === parentId);
      if (!parent) return false;
      if (parent.category === categoryName) return true;
      return hasAncestorWithCategory(parent.parent_id, categoryName);
    }
    
    function getTaskTime(t) {
      if (t.created_at) { const time = new Date(t.created_at).getTime(); if (!isNaN(time)) return time; }
      return t.id || 0;
    }
    
    function sortTasks(items) {
      return items.sort((a, b) => {
        if (currentSort === 'perso') return (a.manual_order || 0) - (b.manual_order || 0);
        
        const timeA = getTaskTime(a); const timeB = getTaskTime(b);
        if (currentSort === 'date-desc') return timeB - timeA;
        if (currentSort === 'date-asc') return timeA - timeB;
        if (currentSort === 'prio-desc') return (b.priority || 0) - (a.priority || 0) || (timeB - timeA);
        if (currentSort === 'prio-asc') return (a.priority || 0) - (b.priority || 0) || (timeB - timeA);
        return 0;
      });
    }

    function handleDragStart(e, id) {
      draggedTaskId = id;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', id);
      if (currentSort !== 'perso') {
        setSortOption('perso');
        const select = document.getElementById('sort-select');
        if (select) select.value = 'perso';
      }
    }
    
    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }
    
    function handleDragEnter(e) {
      e.preventDefault();
      e.currentTarget.classList.add('drop-target-active');
    }
    
    function handleDragLeave(e) {
      e.currentTarget.classList.remove('drop-target-active');
    }
    
    async function handleDrop(e, targetId) {
      e.preventDefault();
      e.currentTarget.classList.remove('drop-target-active');
      
      if (!draggedTaskId || draggedTaskId === targetId) return;
      const draggedTask = todos.find(t => t.id === draggedTaskId);
      const targetTask = todos.find(t => t.id === targetId);
      
      if (!draggedTask || !targetTask) return;
      if (hasAncestor(targetTask.id, draggedTask.id)) return;
      
      draggedTask.parent_id = targetTask.parent_id;

      let siblings = todos.filter(t => t.parent_id === targetTask.parent_id);
      siblings.sort((a, b) => (a.manual_order || 0) - (b.manual_order || 0));
      
      const draggedIndex = siblings.findIndex(t => t.id === draggedTaskId);
      if (draggedIndex > -1) siblings.splice(draggedIndex, 1);
      
      const insertIndex = siblings.findIndex(t => t.id === targetId);
      if (insertIndex > -1) {
        siblings.splice(insertIndex, 0, draggedTask);
      } else {
        siblings.push(draggedTask);
      }
      
      siblings.forEach((sib, idx) => {
        sib.manual_order = idx * 10;
      });
      
      saveLocal();
      await pushTaskToCloud(draggedTask);
      for (let s of siblings) { await pushTaskToCloud(s); }
      await syncCloud();
      draggedTaskId = null;
    }
    
    function hasAncestor(childId, possibleAncestorId) {
      if (!childId) return false;
      if (childId === possibleAncestorId) return true;
      const child = todos.find(t => t.id === childId);
      if (!child) return false;
      return hasAncestor(child.parent_id, possibleAncestorId);
    }

    function getTaskState(taskId) {
      const task = todos.find(t => t.id === taskId);
      if (!task) return 'red';
      if (task.completed) return 'green';
      
      function hasCompletedDescendant(id) {
        const children = todos.filter(t => t.parent_id === id);
        for (let c of children) {
          if (c.completed || hasCompletedDescendant(c.id)) return true;
        }
        return false;
      }
      if (hasCompletedDescendant(taskId)) return 'orange';
      return 'red';
    }

    function formatTextWithLinks(text) {
      if (!text) return '';
      let escaped = escapeHtml(text);
      return escaped.replace(/\[\[(\d+)\]\]/g, (match, idStr) => {
        const id = Number(idStr);
        const task = todos.find(t => t.id === id);
        if (!task) return `<span class="line-through text-slate-400">Tâche introuvable</span>`;
        
        const state = getTaskState(id);
        let colorClass = 'text-rose-500'; 
        let accentColor = 'accent-rose-500';
        if (state === 'green') { colorClass = 'text-emerald-500'; accentColor = 'accent-emerald-500'; }
        else if (state === 'orange') { colorClass = 'text-amber-500'; accentColor = 'accent-amber-500'; }
        
        const isChecked = task.completed ? 'checked' : '';
        
        return `<span class="inline-flex items-center gap-1.5 mx-1 ${colorClass} font-bold px-1.5 py-0.5 bg-slate-100/60 rounded align-middle border border-slate-200/50">
                  <input type="checkbox" ${isChecked} onclick="toggleTask(event, ${id})" class="w-3.5 h-3.5 ${accentColor} rounded cursor-pointer shrink-0 mt-[1px]">
                  <span class="cursor-pointer hover:underline truncate max-w-[150px]" onclick="scrollToTask(event, ${id})">🔗 ${escapeHtml(task.text)}</span>
                </span>`;
      });
    }

    function scrollToTask(e, id) {
      if (e) e.stopPropagation();
      let updatedList = [];
      uncollapseAncestors(id, updatedList);
      if (updatedList.length > 0) saveLocal();

      setTimeout(() => {
        const el = document.getElementById('task-card-' + id);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('highlight-task');
          setTimeout(() => el.classList.remove('highlight-task'), 1500);
        }
      }, 50);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[match]));
    }

    function renderTaskTree(parentId = null, level = 0) {
      let items = todos.filter(t => {
        const isMasquer = t.paused && t.pauseMode === 'masquer';
        if (activeCategory === 'Masquées') return level === 0 ? (isMasquer && t.parent_id === null) : (t.parent_id === parentId);
        if (isMasquer) return false;
        if (level === 0) {
          if (activeCategory === 'Tout') { if (t.parent_id !== null) return false; } 
          else { if (t.category !== activeCategory) return false; if (hasAncestorWithCategory(t.parent_id, activeCategory)) return false; }
        } else { if (t.parent_id !== parentId) return false; }
        return true;
      });

      if (items.length === 0) return '';
      items = sortTasks(items);

      return items.map(todo => {
        const isGriser = todo.paused && todo.pauseMode !== 'masquer';
        const children = todos.filter(c => c.parent_id === todo.id);
        const hasChildren = children.length > 0;
        const isCollapsed = !!todo.collapsed;
        const childrenHTML = (!isCollapsed && hasChildren) ? renderTaskTree(todo.id, level + 1) : '';

        const state = getTaskState(todo.id);
        let miniColorClass = 'mini-red';
        if (state === 'green') miniColorClass = 'mini-green';
        else if (state === 'orange') miniColorClass = 'mini-orange';

        let prioBorder = '';
        if (todo.priority === 1) prioBorder = 'border-l-4 border-l-slate-400';
        else if (todo.priority === 2) prioBorder = 'border-l-4 border-l-blue-500';
        else if (todo.priority === 3) prioBorder = 'border-l-4 border-l-orange-500';
        else if (todo.priority === 4) prioBorder = 'border-l-4 border-l-red-500';

        const arrowSvg = isCollapsed 
          ? `<svg class="w-4 h-4 text-slate-500 fill-current" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6V4z"/></svg>`
          : `<svg class="w-4 h-4 text-slate-500 fill-current" viewBox="0 0 20 20"><path d="M4 6l6 10 6-10H4z"/></svg>`;

        return `
          <div class="task-item-wrapper flex items-start gap-1 transition-all rounded-2xl ${level > 0 ? 'ml-4 mt-1.5 pl-1 border-l-2 border-slate-200/70' : ''}"
               ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${todo.id})" ondragenter="handleDragEnter(event)" ondragleave="handleDragLeave(event)">
            
            <div draggable="true" ondragstart="handleDragStart(event, ${todo.id})" class="cursor-grab active:cursor-grabbing text-slate-300 hover:text-slate-500 mt-[14px] px-1 drag-handle shrink-0" title="Déplacer (Drag & Drop)">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20"><path d="M7 2a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0zm8-16a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0zm0 8a2 2 0 10-4 0 2 2 0 004 0z"/></svg>
            </div>

            <div class="flex-1 w-full min-w-0">
              <div id="task-card-${todo.id}"
                onclick="openModal(${todo.id})"
                class="task-card-bg flex items-start justify-between gap-2.5 p-2.5 rounded-2xl border transition-all cursor-pointer ${miniColorClass} ${
                  todo.completed ? 'bg-slate-50 border-slate-100 opacity-60' : 
                  isGriser ? 'bg-slate-100/70 border-slate-200 opacity-50' : 
                  'bg-white border-slate-200 shadow-sm hover:border-slate-300'
                } ${prioBorder}"
              >
                <input 
                  type="checkbox" 
                  ${todo.completed ? 'checked' : ''} 
                  class="w-5 h-5 accent-slate-900 rounded cursor-pointer mt-0.5"
                  onclick="toggleTask(event, ${todo.id})"
                >

                <div class="flex-1 min-w-0">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-sm font-semibold leading-relaxed ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
                      ${formatTextWithLinks(todo.text)}
                    </span>
                    ${todo.paused ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded-md">PAUSE</span>` : ''}
                    ${hasChildren && isCollapsed ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-md">+${children.length} masquée${children.length > 1 ? 's' : ''}</span>` : ''}
                  </div>

                  <div class="flex flex-wrap gap-1 mt-1">
                    <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">${escapeHtml(todo.category)}</span>
                    ${(todo.tags || []).map(tag => `<span class="text-[10px] font-bold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md">#${escapeHtml(tag)}</span>`).join('')}
                  </div>

                  ${todo.notes ? `<p class="text-xs text-slate-500 mt-1.5 italic bg-slate-50 p-2 rounded-xl border border-slate-100 leading-relaxed">${formatTextWithLinks(todo.notes)}</p>` : ''}
                </div>

                <div class="flex items-center gap-1 shrink-0">
                  ${hasChildren ? `<button onclick="toggleCollapse(event, ${todo.id})" class="p-1 text-slate-400 hover:text-slate-900 rounded-lg shrink-0" title="${isCollapsed ? 'Déplier' : 'Plier'}">${arrowSvg}</button>` : ''}
                  <button onclick="addSubtask(event, ${todo.id})" class="text-slate-400 hover:text-slate-900 font-bold px-2 py-1 text-base rounded-lg" title="Sous-tâche">+</button>
                  <button onclick="deleteTask(event, ${todo.id})" class="text-slate-400 hover:text-rose-500 font-bold px-2 py-1 text-base rounded-lg" title="Supprimer">&times;</button>
                </div>
              </div>
              ${childrenHTML}
            </div>
          </div>
        `;
      }).join('');
    }

    function render() {
      const treeContainer = document.getElementById('task-tree');
      const countEl = document.getElementById('task-count');
      const html = renderTaskTree(null, 0);
      if (!html) treeContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">Aucune tâche dans cette catégorie</p>`;
      else treeContainer.innerHTML = html;
      const activeCount = todos.filter(t => !t.completed).length;
      countEl.textContent = `${activeCount} tâche${activeCount > 1 ? 's' : ''} restante${activeCount > 1 ? 's' : ''}`;
    }

    updateCategories(); initRealtime(); syncCloud(); 
    
    // Initialisation du zoom à l'ouverture de l'application
    applyZoom(0.9); 
  </script>
</body>
</html>
