<!-- TODOAPP - Version 1.3.8 (890 lignes) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TODOAPP - v1.3.8</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      background-color: #0f172a;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input, select, textarea {
      font-size: 16px !important;
    }
    #splash-screen {
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    #splash-screen.hidden-splash {
      opacity: 0;
      visibility: hidden;
    }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans min-h-screen">

  <!-- BANDEAU D'ALERTE DIAGNOSTIC BDD -->
  <div id="debug-banner" class="hidden bg-rose-600 text-white text-xs font-bold px-4 py-2 text-center fixed top-0 left-0 right-0 z-[110] shadow-md flex justify-between items-center">
    <span id="debug-msg" class="truncate pr-2">Erreur Supabase</span>
    <button onclick="document.getElementById('debug-banner').classList.add('hidden')" class="bg-rose-800 px-2 py-0.5 rounded text-[10px]">✕</button>
  </div>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center">
    <img src="splashlogo.jpg" alt="Splash Screen" class="w-full h-full object-cover">
  </div>

  <div class="max-w-2xl mx-auto min-h-screen flex flex-col justify-between pt-2">
    <div>
      <header class="mb-4">
        <div class="flex justify-between items-center mb-3 gap-2">
          <div class="flex items-center gap-2">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">TODOAPP</h1>
            <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shrink-0"></span>
            <span class="text-xs text-slate-400 font-medium">v1.3.8</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="syncCloud()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center" title="Synchroniser">
              <span id="sync-icon">🔄</span>
            </button>
            <button onclick="openSettingsModal()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center" title="Réglages">
              <span>⚙️</span>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto pb-2 border-b border-slate-100 scrollbar-none" id="category-tabs"></div>
      </header>

      <form onsubmit="addTask(event)" class="flex gap-1.5 mb-4">
        <input type="text" id="task-input" placeholder="Ajouter une tâche..." class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900" required>
        <button type="submit" class="bg-slate-900 text-white rounded-xl px-3 py-1.5 font-bold text-sm hover:bg-slate-800">+</button>
      </form>

      <div id="task-tree" class="space-y-3"></div>
    </div>

    <footer class="mt-8 pt-4 border-t border-slate-100 text-xs text-slate-400 flex justify-between items-center pb-6">
      <span id="task-count">0 tâche</span>
      <span id="sync-status" class="text-emerald-600 font-medium">● Synchro Temps Réel</span>
    </footer>
  </div>

  <!-- MODALE ÉDITION -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeModalOnOut(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900" id="modal-heading">Éditer la tâche</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Titre</label>
        <textarea id="modal-title" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Catégorie</label>
        <div class="flex flex-wrap gap-2 items-center" id="modal-categories-container"></div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Priorité</label>
        <div class="grid grid-cols-5 gap-1.5" id="modal-priority-container">
          <button type="button" onclick="setModalPriority(0)" data-prio="0" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">Aucun</button>
          <button type="button" onclick="setModalPriority(1)" data-prio="1" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">1</button>
          <button type="button" onclick="setModalPriority(2)" data-prio="2" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">2</button>
          <button type="button" onclick="setModalPriority(3)" data-prio="3" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">3</button>
          <button type="button" onclick="setModalPriority(4)" data-prio="4" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">4</button>
        </div>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tags (séparés par virgules)</label>
        <input type="text" id="modal-tags" placeholder="ex: maison, urgent..." oninput="handleTagAutocomplete(event)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        <ul id="tag-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-20 max-h-32 overflow-y-auto"></ul>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Notes</label>
        <textarea id="modal-notes" rows="3" placeholder="Notes..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
      </div>
      <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-bold text-slate-700 uppercase">Mise en pause</span>
          <input type="checkbox" id="modal-paused" onchange="togglePauseOptions()" class="w-5 h-5 accent-slate-900 rounded">
        </label>
        <div id="pause-options" class="hidden pt-2 border-t border-slate-200 space-y-1.5">
          <span class="text-[11px] font-semibold text-slate-500 block">Option de pause :</span>
          <div class="flex gap-4 text-xs font-medium text-slate-700">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="griser" class="accent-slate-900"> Griser</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="masquer" class="accent-slate-900"> Masquer</label>
          </div>
        </div>
      </div>
      <button onclick="saveModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl shadow-md">Enregistrer</button>
    </div>
  </div>

  <!-- MODALE RÉGLAGES -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeSettingsModalOnOut(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900">Réglages</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      </div>
      <div class="flex items-center justify-between gap-3 p-1">
        <label for="sort-select" class="text-xs font-bold text-slate-700 uppercase">Ordre d'affichage</label>
        <select id="sort-select" onchange="setSortOption(this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
          <option value="date-desc">Plus récents d'abord</option>
          <option value="date-asc">Plus anciens d'abord</option>
          <option value="prio-desc">Priorité haute d'abord</option>
          <option value="prio-asc">Priorité basse d'abord</option>
        </select>
      </div>
      <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
        <div>
          <div class="text-xs font-bold text-slate-800">Version de l'application</div>
          <div class="text-[11px] text-slate-500">v1.3.8 (Cache: todoapp_v138)</div>
        </div>
        <button onclick="forceAppUpdate()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800">Forcer MaJ</button>
      </div>
    </div>
  </div>

  <script>
    const CACHE_NAME = 'todoapp_v138';

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = '${CACHE_NAME}';
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => {
          e.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log(err));
    }

    function forceAppUpdate() {
      if ('caches' in window) { caches.keys().then(names => names.forEach(n => caches.delete(n))); }
      localStorage.clear();
      window.location.reload(true);
    }

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://bwirwhcetlfwzqswbfwr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6f1T8ttm3Lc0yTSqsHUikA_XW5eo3X7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STORAGE_KEY = 'todoapp_tasks_v138';

    let todos = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || 
      localStorage.getItem('todoapp_tasks_v137') || 
      localStorage.getItem('todoapp_tasks_v136') || '[]'
    );
    let categories = ["Tout", "Général", "Maison", "Jardin", "Voiture", "Aster", "Aimé", "Masquées"];
    let activeCategory = "Tout";
    let currentSort = localStorage.getItem('todoapp_sort') || 'date-desc';
    let currentEditing = { id: null, selectedCategory: 'Général', selectedPriority: 0 };

    function showDebugError(msg) {
      const banner = document.getElementById('debug-banner');
      const msgEl = document.getElementById('debug-msg');
      if (banner && msgEl) {
        msgEl.textContent = "Erreur Supabase: " + msg;
        banner.classList.remove('hidden');
      }
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      render();
    }

    function generateSafeId() {
      return Math.floor((Date.now() % 1000000000)) + Math.floor(Math.random() * 1000);
    }

    const splashStartTime = Date.now();
    function hideSplashScreen() {
      const elapsed = Date.now() - splashStartTime;
      const remaining = Math.max(0, 500 - elapsed);
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden-splash');
          setTimeout(() => splash.style.display = 'none', 450);
        }
      }, remaining);
    }

    function updateTaskIdLocally(oldId, newId) {
      if (oldId === newId) return;
      todos.forEach(t => {
        if (t.id === oldId) t.id = newId;
        if (t.parent_id === oldId) t.parent_id = newId;
      });
      saveLocal();
    }

    function updateSyncStatus(online, msg) {
      const syncStatus = document.getElementById('sync-status');
      const syncDot = document.getElementById('sync-dot');
      if (syncStatus) {
        syncStatus.textContent = online ? "● Synchro Temps Réel" : "● " + (msg || "Erreur BDD");
        syncStatus.className = online ? "text-emerald-600 font-medium" : "text-amber-600 font-medium";
      }
      if (syncDot) {
        syncDot.className = online ? "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0" : "w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0";
      }
    }

    async function pushTaskToCloud(todo) {
      const payload = {
        id: Number(todo.id),
        text: todo.text || '',
        completed: !!todo.completed,
        category: todo.category || 'Général',
        priority: Number(todo.priority || 0),
        tags: Array.isArray(todo.tags) ? todo.tags : [],
        notes: todo.notes || '',
        paused: !!todo.paused,
        parent_id: todo.parent_id ? Number(todo.parent_id) : null
      };

      try {
        const res = await supabaseClient.from('todos').upsert([payload]).select();

        if (res.error) {
          console.error("Supabase Push Error:", res.error);
          showDebugError(res.error.message);
          updateSyncStatus(false, res.error.message);
        } else {
          updateSyncStatus(true);
        }
      } catch (err) {
        console.error("Exception pushTaskToCloud:", err);
        showDebugError("Erreur Réseau");
        updateSyncStatus(false, "Hors-ligne");
      }
    }

    let realtimeChannel = null;
    function initRealtime() {
      if (realtimeChannel) {
        try { supabaseClient.removeChannel(realtimeChannel); } catch(e){}
      }

      realtimeChannel = supabaseClient
        .channel('todos_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => syncCloud())
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            updateSyncStatus(true);
          } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
            updateSyncStatus(false, "Canal fermé");
          }
        });
    }

    window.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        initRealtime();
        syncCloud();
      }
    });
    window.addEventListener('focus', () => {
      initRealtime();
      syncCloud();
    });
    window.addEventListener('online', () => {
      initRealtime();
      syncCloud();
    });

    async function syncCloud() {
      const syncIcon = document.getElementById('sync-icon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const { data, error } = await supabaseClient.from('todos').select('*');

        if (error) {
          console.error("Erreur Sync Supabase:", error);
          showDebugError(error.message);
          updateSyncStatus(false, error.message);
          hideSplashScreen();
          return;
        }

        updateSyncStatus(true);

        if (Array.isArray(data)) {
          const serverMap = new Map();
          data.forEach(item => serverMap.set(Number(item.id), item));

          const mergedTodos = [];
          const processedServerIds = new Set();

          todos.forEach(localTask => {
            const lId = Number(localTask.id);
            if (serverMap.has(lId)) {
              const sItem = serverMap.get(lId);
              processedServerIds.add(lId);
              mergedTodos.push({
                id: lId,
                text: sItem.text || sItem.title || localTask.text,
                completed: sItem.completed !== undefined ? !!sItem.completed : localTask.completed,
                category: sItem.category || localTask.category || 'Général',
                priority: sItem.priority !== undefined ? Number(sItem.priority) : (localTask.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : (localTask.tags || []),
                notes: sItem.notes !== undefined ? sItem.notes : (localTask.notes || ''),
                paused: sItem.paused !== undefined ? !!sItem.paused : (localTask.paused || false),
                pauseMode: localTask.pauseMode || 'griser',
                collapsed: !!localTask.collapsed,
                parent_id: sItem.parent_id ? Number(sItem.parent_id) : null,
                created_at: localTask.created_at || sItem.created_at || new Date().toISOString()
              });
            } else if (lId > 1000000) {
              mergedTodos.push(localTask);
            }
          });

          data.forEach(sItem => {
            const sId = Number(sItem.id);
            if (!processedServerIds.has(sId)) {
              mergedTodos.push({
                id: sId,
                text: sItem.text || sItem.title || '',
                completed: !!sItem.completed,
                category: sItem.category || 'Général',
                priority: Number(sItem.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : [],
                notes: sItem.notes || '',
                paused: !!sItem.paused,
                pauseMode: 'griser',
                collapsed: false,
                parent_id: sItem.parent_id ? Number(sItem.parent_id) : null,
                created_at: sItem.created_at || new Date().toISOString()
              });
            }
          });

          todos = mergedTodos;
          saveLocal();
        }
      } catch (err) {
        console.error("Exception syncCloud:", err);
        showDebugError("Erreur réseau");
        updateSyncStatus(false, "Hors-ligne");
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        hideSplashScreen();
      }
    }

    async function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      const targetCat = (activeCategory === 'Tout' || activeCategory === 'Masquées') ? 'Général' : activeCategory;
      const newTodo = {
        id: generateSafeId(),
        text: text,
        completed: false,
        category: targetCat,
        priority: 0,
        tags: [],
        notes: '',
        paused: false,
        pauseMode: 'griser',
        collapsed: false,
        parent_id: null,
        created_at: new Date().toISOString()
      };

      todos.unshift(newTodo);
      input.value = '';
      saveLocal();

      await pushTaskToCloud(newTodo);
      await syncCloud();
    }

    async function addSubtask(e, parentId) {
      if (e) e.stopPropagation();
      const parent = todos.find(t => t.id === parentId);
      if (!parent) return;

      const text = prompt("Nom de la sous-tâche :");
      if (!text || !text.trim()) return;

      parent.collapsed = false;

      const newSub = {
        id: generateSafeId(),
        text: text.trim(),
        completed: false,
        category: parent.category || 'Général',
        priority: 0,
        tags: [],
        notes: '',
        paused: false,
        pauseMode: 'griser',
        collapsed: false,
        parent_id: parent.id,
        created_at: new Date().toISOString()
      };

      todos.push(newSub);
      saveLocal();

      await pushTaskToCloud(newSub);
      await syncCloud();
    }

    function toggleCollapse(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === id);
      if (!task) return;
      task.collapsed = !task.collapsed;
      saveLocal();
    }

    function uncheckDescendants(taskId, updatedList) {
      const children = todos.filter(t => t.parent_id === taskId);
      for (const child of children) {
        if (child.completed) {
          child.completed = false;
          if (!updatedList.some(u => u.id === child.id)) updatedList.push(child);
        }
        uncheckDescendants(child.id, updatedList);
      }
    }

    function uncheckAncestors(parentId, updatedList) {
      if (!parentId) return;
      const parent = todos.find(t => t.id === parentId);
      if (parent && parent.completed) {
        parent.completed = false;
        if (!updatedList.some(u => u.id === parent.id)) updatedList.push(parent);
        if (parent.parent_id) uncheckAncestors(parent.parent_id, updatedList);
      }
    }

    async function toggleTask(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === id);
      if (!task) return;

      const newStatus = !task.completed;
      const updatedTasks = [];

      task.completed = newStatus;
      updatedTasks.push(task);

      if (newStatus === false) {
        uncheckDescendants(id, updatedTasks);
        if (task.parent_id) uncheckAncestors(task.parent_id, updatedTasks);
      }

      saveLocal();

      for (const t of updatedTasks) {
        await pushTaskToCloud(t);
      }
      await syncCloud();
    }

    async function deleteTask(e, id) {
      if (e) e.stopPropagation();
      
      const idsToDelete = [];
      function collectIds(targetId) {
        idsToDelete.push(targetId);
        todos.filter(t => t.parent_id === targetId).forEach(child => collectIds(child.id));
      }
      collectIds(id);

      todos = todos.filter(t => !idsToDelete.includes(t.id));
      saveLocal();

      try {
        for (const delId of idsToDelete) {
          if (delId <= 1000000) {
            await supabaseClient.from('todos').delete().eq('id', delId);
          }
        }
      } catch (err) {
        console.error("Erreur deleteTask:", err);
      }
      await syncCloud();
    }

    function openModal(id) {
      const item = todos.find(t => t.id === id);
      if (!item) return;

      currentEditing = { id, selectedCategory: item.category || 'Général', selectedPriority: item.priority || 0 };

      document.getElementById('modal-heading').textContent = item.parent_id ? 'Éditer la sous-tâche' : 'Éditer la tâche';
      document.getElementById('modal-title').value = item.text || '';
      document.getElementById('modal-tags').value = (item.tags || []).join(', ');
      document.getElementById('modal-notes').value = item.notes || '';

      const pausedCb = document.getElementById('modal-paused');
      pausedCb.checked = !!item.paused;

      const pauseModes = document.getElementsByName('pause-mode');
      pauseModes.forEach(r => r.checked = (r.value === (item.pauseMode || 'griser')));

      togglePauseOptions();
      renderModalCategories();
      setModalPriority(item.priority || 0);

      document.getElementById('edit-modal').classList.remove('hidden');
      document.getElementById('edit-modal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('edit-modal').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('flex');
      document.getElementById('tag-suggestions').classList.add('hidden');
    }

    function closeModalOnOut(e) {
      if (e.target.id === 'edit-modal') closeModal();
    }

    function openSettingsModal() {
      const select = document.getElementById('sort-select');
      if (select) select.value = currentSort;
      document.getElementById('settings-modal').classList.remove('hidden');
      document.getElementById('settings-modal').classList.add('flex');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
      document.getElementById('settings-modal').classList.remove('flex');
    }

    function closeSettingsModalOnOut(e) {
      if (e.target.id === 'settings-modal') closeSettingsModal();
    }

    function setSortOption(opt) {
      currentSort = opt;
      localStorage.setItem('todoapp_sort', opt);
      render();
    }

    function renderModalCategories() {
      const container = document.getElementById('modal-categories-container');
      const catsToDisplay = categories.filter(c => c !== 'Tout' && c !== 'Masquées');

      container.innerHTML = catsToDisplay.map(cat => `
        <button type="button" onclick="selectModalCategory('${escapeHtml(cat)}')" 
          class="px-3 py-1.5 rounded-xl text-xs font-bold transition-all border ${currentEditing.selectedCategory === cat ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-600 border-slate-200'}">
          ${escapeHtml(cat)}
        </button>
      `).join('') + `
        <button type="button" onclick="addNewCategory()" class="px-2.5 py-1.5 bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-xl text-xs font-bold">+</button>
      `;
    }

    function selectModalCategory(cat) {
      currentEditing.selectedCategory = cat;
      renderModalCategories();
    }

    function addNewCategory() {
      const name = prompt("Nom de la nouvelle catégorie :");
      if (name && name.trim()) {
        const clean = name.trim();
        if (!categories.includes(clean)) {
          categories.splice(categories.length - 1, 0, clean);
          currentEditing.selectedCategory = clean;
          renderCategoryTabs();
          renderModalCategories();
        }
      }
    }

    function setModalPriority(prio) {
      currentEditing.selectedPriority = prio;
      const btns = document.querySelectorAll('.prio-btn');
      btns.forEach(btn => {
        const p = parseInt(btn.getAttribute('data-prio'));
        btn.className = (p === prio) 
          ? "prio-btn py-2 text-xs font-bold rounded-xl border bg-slate-900 text-white border-slate-900 shadow-sm"
          : "prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600";
      });
    }

    function togglePauseOptions() {
      const isPaused = document.getElementById('modal-paused').checked;
      const opt = document.getElementById('pause-options');
      if (isPaused) opt.classList.remove('hidden');
      else opt.classList.add('hidden');
    }

    function getAllExistingTags() {
      const tagsSet = new Set();
      todos.forEach(t => (t.tags || []).forEach(tag => tagsSet.add(tag)));
      return Array.from(tagsSet);
    }

    function handleTagAutocomplete(e) {
      const val = e.target.value;
      const parts = val.split(',');
      const currentPart = parts[parts.length - 1].trim().toLowerCase();
      const suggestionsList = document.getElementById('tag-suggestions');

      if (!currentPart) { suggestionsList.classList.add('hidden'); return; }

      const allTags = getAllExistingTags();
      const filtered = allTags.filter(t => t.toLowerCase().includes(currentPart) && !parts.slice(0, -1).map(p => p.trim()).includes(t));

      if (filtered.length > 0) {
        suggestionsList.innerHTML = filtered.map(tag => `
          <li class="px-3 py-2 text-xs font-medium hover:bg-slate-100 cursor-pointer border-b border-slate-50 last:border-0" onclick="insertTagSuggestion('${escapeHtml(tag)}')">
            #${escapeHtml(tag)}
          </li>
        `).join('');
        suggestionsList.classList.remove('hidden');
      } else {
        suggestionsList.classList.add('hidden');
      }
    }

    function insertTagSuggestion(tag) {
      const input = document.getElementById('modal-tags');
      const parts = input.value.split(',');
      parts[parts.length - 1] = ' ' + tag;
      input.value = parts.join(', ') + ', ';
      document.getElementById('tag-suggestions').classList.add('hidden');
      input.focus();
    }

    async function saveModal() {
      const title = document.getElementById('modal-title').value.trim();
      if (!title) return;

      const rawTags = document.getElementById('modal-tags').value;
      const tags = rawTags.split(',').map(t => t.trim()).filter(Boolean);
      const notes = document.getElementById('modal-notes').value.trim();
      const paused = document.getElementById('modal-paused').checked;

      const pauseModes = document.getElementsByName('pause-mode');
      let pauseMode = 'griser';
      pauseModes.forEach(r => { if (r.checked) pauseMode = r.value; });

      const task = todos.find(t => t.id === currentEditing.id);
      if (task) {
        task.text = title;
        task.category = currentEditing.selectedCategory;
        task.priority = currentEditing.selectedPriority;
        task.tags = tags;
        task.notes = notes;
        task.paused = paused;
        task.pauseMode = pauseMode;

        saveLocal();
        closeModal();
        await pushTaskToCloud(task);
        await syncCloud();
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      let otherCategories = categories.filter(c => c !== 'Masquées');
      let orderedCategories = [...otherCategories, 'Masquées'];
      
      container.innerHTML = orderedCategories.map(cat => `
        <button onclick="setCategory('${escapeHtml(cat)}')" class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all border ${activeCategory === cat ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">
          ${escapeHtml(cat)}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategoryTabs();
      render();
    }

    function hasAncestorWithCategory(parentId, categoryName) {
      if (!parentId) return false;
      const parent = todos.find(t => t.id === parentId);
      if (!parent) return false;
      if (parent.category === categoryName) return true;
      return hasAncestorWithCategory(parent.parent_id, categoryName);
    }

    function getTaskTime(t) {
      if (t.created_at) {
        const time = new Date(t.created_at).getTime();
        if (!isNaN(time)) return time;
      }
      return t.id || 0;
    }

    function sortTasks(items) {
      return items.sort((a, b) => {
        const timeA = getTaskTime(a);
        const timeB = getTaskTime(b);
        if (currentSort === 'date-desc') return timeB - timeA;
        if (currentSort === 'date-asc') return timeA - timeB;
        if (currentSort === 'prio-desc') return (b.priority || 0) - (a.priority || 0) || (timeB - timeA);
        if (currentSort === 'prio-asc') return (a.priority || 0) - (b.priority || 0) || (timeB - timeA);
        return 0;
      });
    }

    function renderTaskTree(parentId = null, level = 0) {
      let items = todos.filter(t => {
        const isMasquer = t.paused && t.pauseMode === 'masquer';

        if (activeCategory === 'Masquées') {
          return level === 0 ? (isMasquer && t.parent_id === null) : (t.parent_id === parentId);
        }

        if (isMasquer) return false;

        if (level === 0) {
          if (activeCategory === 'Tout') {
            if (t.parent_id !== null) return false;
          } else {
            if (t.category !== activeCategory) return false;
            if (hasAncestorWithCategory(t.parent_id, activeCategory)) return false;
          }
        } else {
          if (t.parent_id !== parentId) return false;
        }

        return true;
      });

      if (items.length === 0) return '';
      items = sortTasks(items);

      return items.map(todo => {
        const isGriser = todo.paused && todo.pauseMode !== 'masquer';
        const children = todos.filter(c => c.parent_id === todo.id);
        const hasChildren = children.length > 0;
        const isCollapsed = !!todo.collapsed;
        const childrenHTML = (!isCollapsed && hasChildren) ? renderTaskTree(todo.id, level + 1) : '';

        let prioBorder = '';
        if (todo.priority === 1) prioBorder = 'border-l-4 border-l-slate-400';
        else if (todo.priority === 2) prioBorder = 'border-l-4 border-l-blue-500';
        else if (todo.priority === 3) prioBorder = 'border-l-4 border-l-orange-500';
        else if (todo.priority === 4) prioBorder = 'border-l-4 border-l-red-500';

        const arrowSvg = isCollapsed 
          ? `<svg class="w-4 h-4 text-slate-500 fill-current" viewBox="0 0 20 20"><path d="M6 4l10 6-10 6V4z"/></svg>`
          : `<svg class="w-4 h-4 text-slate-500 fill-current" viewBox="0 0 20 20"><path d="M4 6l6 10 6-10H4z"/></svg>`;

        return `
          <div class="${level > 0 ? 'ml-4 mt-2 pl-2 border-l-2 border-slate-200/70' : 'mt-2.5'}">
            <div 
              onclick="openModal(${todo.id})"
              class="flex items-start justify-between gap-2.5 p-3 rounded-2xl border transition-all cursor-pointer ${
                todo.completed ? 'bg-slate-50 border-slate-100 opacity-60' : 
                isGriser ? 'bg-slate-100/70 border-slate-200 opacity-50' : 
                'bg-white border-slate-200 shadow-sm hover:border-slate-300'
              } ${prioBorder}"
            >
              <input 
                type="checkbox" 
                ${todo.completed ? 'checked' : ''} 
                class="w-5 h-5 accent-slate-900 rounded cursor-pointer mt-0.5"
                onclick="toggleTask(event, ${todo.id})"
              >

              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 flex-wrap">
                  <span class="text-sm font-semibold ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
                    ${escapeHtml(todo.text)}
                  </span>
                  ${todo.paused ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-amber-100 text-amber-700 rounded-md">PAUSE</span>` : ''}
                  ${hasChildren && isCollapsed ? `<span class="text-[10px] font-bold px-1.5 py-0.5 bg-slate-100 text-slate-500 rounded-md">+${children.length} masquée${children.length > 1 ? 's' : ''}</span>` : ''}
                </div>

                <div class="flex flex-wrap gap-1 mt-1">
                  <span class="text-[10px] font-bold bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md">${escapeHtml(todo.category)}</span>
                  ${(todo.tags || []).map(tag => `<span class="text-[10px] font-bold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md">#${escapeHtml(tag)}</span>`).join('')}
                </div>

                ${todo.notes ? `<p class="text-xs text-slate-500 mt-1.5 italic bg-slate-50 p-2 rounded-xl border border-slate-100">${escapeHtml(todo.notes)}</p>` : ''}
              </div>

              <div class="flex items-center gap-1 shrink-0">
                ${hasChildren ? `
                  <button onclick="toggleCollapse(event, ${todo.id})" class="p-1 text-slate-400 hover:text-slate-900 rounded-lg shrink-0" title="${isCollapsed ? 'Déplier' : 'Plier'}">
                    ${arrowSvg}
                  </button>
                ` : ''}
                <button onclick="addSubtask(event, ${todo.id})" class="text-slate-400 hover:text-slate-900 font-bold px-2 py-1 text-base rounded-lg" title="Sous-tâche">+</button>
                <button onclick="deleteTask(event, ${todo.id})" class="text-slate-400 hover:text-rose-500 font-bold px-2 py-1 text-base rounded-lg" title="Supprimer">&times;</button>
              </div>
            </div>

            ${childrenHTML}
          </div>
        `;
      }).join('');
    }

    function render() {
      const treeContainer = document.getElementById('task-tree');
      const countEl = document.getElementById('task-count');

      const html = renderTaskTree(null, 0);

      if (!html) {
        treeContainer.innerHTML = `<p class="text-center text-slate-400 text-sm py-8">Aucune tâche dans cette catégorie</p>`;
      } else {
        treeContainer.innerHTML = html;
      }

      const activeCount = todos.filter(t => !t.completed).length;
      countEl.textContent = `${activeCount} tâche${activeCount > 1 ? 's' : ''} restante${activeCount > 1 ? 's' : ''}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    renderCategoryTabs();
    render();
    initRealtime();
    syncCloud();
  </script>
</body>
</html>
