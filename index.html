<!-- TODOAPP - Version 1.4.6 -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TODOAPP - v1.4.6</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html, body {
      background-color: #0f172a;
      overflow: hidden; /* Empêche le scroll global pour gérer le viewport de zoom */
      height: 100vh;
      margin: 0;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: max(0.75rem, env(safe-area-inset-top));
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      padding-right: max(1rem, env(safe-area-inset-right));
    }
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    input, select, textarea {
      font-size: 16px !important;
    }
    #splash-screen {
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    #splash-screen.hidden-splash {
      opacity: 0;
      visibility: hidden;
    }
    @keyframes highlightPulse {
      0% { background-color: rgba(250, 204, 21, 0.6); transform: scale(1.02); box-shadow: 0 0 15px rgba(250, 204, 21, 0.4); }
      100% { background-color: transparent; transform: scale(1); box-shadow: none; }
    }
    .highlight-task {
      animation: highlightPulse 1.5s ease-out;
      z-index: 10;
      position: relative;
    }
    .drop-target-active > div.task-card-bg {
      border-color: #6366f1 !important;
      border-width: 2px !important;
      background-color: #eef2ff !important;
    }
    #category-tabs {
      cursor: pointer;
      user-select: none;
    }

    /* Styles pour le Viewport et Zoom */
    #viewport {
      width: 100%;
      height: calc(100vh - 140px);
      overflow: auto;
      position: relative;
      touch-action: pan-x pan-y;
    }
    #zoom-container {
      transform-origin: 0 0;
      will-change: transform;
      min-width: 100%;
      padding-bottom: 100px;
    }

    /* Mode Mini-Blocs (< 10% de zoom) */
    #zoom-container.mini-mode .task-item-wrapper {
      display: inline-block !important;
      width: 12px !important;
      height: 12px !important;
      margin: 2px !important;
      vertical-align: middle;
      border: none !important;
    }
    #zoom-container.mini-mode .task-card-bg {
      padding: 0 !important;
      width: 12px !important;
      height: 12px !important;
      min-height: 0 !important;
      border-radius: 2px !important;
      border: none !important;
      box-shadow: none !important;
    }
    #zoom-container.mini-mode .task-card-bg > * {
      display: none !important; /* Cache tout le texte et boutons */
    }
    /* Couleurs des mini-blocs selon l'état */
    #zoom-container.mini-mode .task-card-bg.mini-red { background-color: #f43f5e !important; }
    #zoom-container.mini-mode .task-card-bg.mini-orange { background-color: #fbbf24 !important; }
    #zoom-container.mini-mode .task-card-bg.mini-green { background-color: #10b981 !important; }
    #zoom-container.mini-mode .drag-handle,
    #zoom-container.mini-mode .ml-4 {
      margin-left: 0 !important;
      display: inline !important;
    }
  </style>
</head>
<body class="bg-white text-slate-800 font-sans h-screen flex flex-col relative">

  <!-- SUGGESTIONS DE LIENS DE TÂCHES -->
  <ul id="task-link-suggestions" class="hidden absolute bg-white border border-slate-200 rounded-xl shadow-2xl z-[200] max-h-40 overflow-y-auto w-64 text-sm"></ul>

  <!-- BANDEAU D'ALERTE DIAGNOSTIC BDD -->
  <div id="debug-banner" class="hidden bg-rose-600 text-white text-xs font-bold px-4 py-2 text-center fixed top-0 left-0 right-0 z-[110] shadow-md flex justify-between items-center">
    <span id="debug-msg" class="truncate pr-2">Erreur Supabase</span>
    <button onclick="document.getElementById('debug-banner').classList.add('hidden')" class="bg-rose-800 px-2 py-0.5 rounded text-[10px]">✕</button>
  </div>

  <!-- SPLASH SCREEN -->
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-slate-900 flex items-center justify-center">
    <img src="splashlogo.jpg" alt="Splash Screen" class="w-full h-full object-cover">
  </div>

  <div class="max-w-2xl mx-auto w-full h-full flex flex-col justify-between pt-2 px-4">
    <div class="flex flex-col h-full overflow-hidden">
      <header class="mb-3 shrink-0">
        <div class="flex justify-between items-center mb-2 gap-2">
          <div class="flex items-center gap-2">
            <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">TODOAPP</h1>
            <span id="sync-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block shrink-0"></span>
            <span class="text-xs text-slate-400 font-medium">v1.4.6</span>
          </div>

          <!-- BARRE DE ZOOM DISCRÈTE -->
          <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-1 rounded-xl border border-slate-200">
            <button onclick="adjustZoom(-0.1)" class="text-slate-600 hover:text-slate-900 font-bold text-xs px-1" title="Dézoomer">-</button>
            <input type="range" id="zoom-range" min="0.05" max="2.0" step="0.05" value="1.0" oninput="onZoomSliderChange(this.value)" class="w-20 accent-slate-900 cursor-pointer h-1 bg-slate-300 rounded-lg">
            <button onclick="adjustZoom(0.1)" class="text-slate-600 hover:text-slate-900 font-bold text-xs px-1" title="Zoomer">+</button>
            <span id="zoom-level-label" class="text-[10px] font-bold text-slate-500 w-8 text-right">100%</span>
          </div>

          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="syncCloud()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center" title="Synchroniser">
              <span id="sync-icon">🔄</span>
            </button>
            <button onclick="openSettingsModal()" class="w-8 h-8 bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 text-xs font-semibold flex items-center justify-center" title="Réglages">
              <span>⚙</span>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-1.5 overflow-x-auto pb-1 border-b border-slate-100 scrollbar-none" id="category-tabs"></div>
      </header>

      <form onsubmit="addTask(event)" class="flex gap-1.5 mb-3 shrink-0 relative">
        <input type="text" id="task-input" placeholder="Ajouter une tâche... (utilisez $ pour lier)" oninput="handleTaskLinkAutocomplete(event)" class="flex-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-1.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-900" required>
        <button type="submit" class="bg-slate-900 text-white rounded-xl px-3 py-1.5 font-bold text-sm hover:bg-slate-800">+</button>
      </form>

      <!-- VIEWPORT ET CONTENEUR ZOOMABLE -->
      <div id="viewport">
        <div id="zoom-container">
          <div id="task-tree" class="space-y-2"></div>
        </div>
      </div>
    </div>

    <footer class="mt-2 pt-2 border-t border-slate-100 text-xs text-slate-400 flex justify-between items-center pb-4 shrink-0">
      <span id="task-count">0 tâche</span>
      <span id="sync-status" class="text-emerald-600 font-medium">● Synchro Temps Réel</span>
    </footer>
  </div>

  <!-- MODALE ÉDITION -->
  <div id="edit-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeModalOnOut(event)" onkeydown="handleModalKeyDown(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900" id="modal-heading">Éditer la tâche</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Titre</label>
        <textarea id="modal-title" oninput="handleTaskLinkAutocomplete(event)" rows="2" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Catégorie</label>
        <div class="flex flex-wrap gap-2 items-center" id="modal-categories-container"></div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1.5">Priorité</label>
        <div class="grid grid-cols-5 gap-1.5" id="modal-priority-container">
          <button type="button" onclick="setModalPriority(0)" data-prio="0" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">Aucun</button>
          <button type="button" onclick="setModalPriority(1)" data-prio="1" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">1</button>
          <button type="button" onclick="setModalPriority(2)" data-prio="2" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">2</button>
          <button type="button" onclick="setModalPriority(3)" data-prio="3" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">3</button>
          <button type="button" onclick="setModalPriority(4)" data-prio="4" class="prio-btn py-2 text-xs font-bold rounded-xl border border-slate-200 bg-slate-50 text-slate-600">4</button>
        </div>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Tags (séparés par virgules)</label>
        <input type="text" id="modal-tags" placeholder="ex: maison, urgent..." oninput="handleTagAutocomplete(event)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        <ul id="tag-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg z-20 max-h-32 overflow-y-auto"></ul>
      </div>
      <div class="relative">
        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Notes</label>
        <textarea id="modal-notes" oninput="handleTaskLinkAutocomplete(event)" rows="3" placeholder="Notes..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 resize-none"></textarea>
      </div>
      <div class="p-3 bg-slate-50 border border-slate-200 rounded-2xl space-y-3">
        <label class="flex items-center justify-between cursor-pointer">
          <span class="text-xs font-bold text-slate-700 uppercase">Mise en pause</span>
          <input type="checkbox" id="modal-paused" onchange="togglePauseOptions()" class="w-5 h-5 accent-slate-900 rounded">
        </label>
        <div id="pause-options" class="hidden pt-2 border-t border-slate-200 space-y-1.5">
          <span class="text-[11px] font-semibold text-slate-500 block">Option de pause :</span>
          <div class="flex gap-4 text-xs font-medium text-slate-700">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="griser" class="accent-slate-900"> Griser</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="pause-mode" value="masquer" class="accent-slate-900"> Masquer</label>
          </div>
        </div>
      </div>
      <button onclick="saveModal()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-2xl shadow-md">Enregistrer</button>
    </div>
  </div>

  <!-- MODALE RÉGLAGES -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50" onclick="closeSettingsModalOnOut(event)">
    <div class="bg-white rounded-3xl p-6 w-full max-w-lg shadow-2xl border border-slate-100 space-y-5" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center border-b pb-3 border-slate-100">
        <h3 class="font-extrabold text-lg text-slate-900">Réglages</h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-700 text-2xl font-bold">&times;</button>
      </div>
      <div class="flex items-center justify-between gap-3 p-1">
        <label for="sort-select" class="text-xs font-bold text-slate-700 uppercase">Ordre d'affichage</label>
        <select id="sort-select" onchange="setSortOption(this.value)" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
          <option value="perso">Personnalisé (Glisser-Déposer)</option>
          <option value="date-desc">Plus récents d'abord</option>
          <option value="date-asc">Plus anciens d'abord</option>
          <option value="prio-desc">Priorité haute d'abord</option>
          <option value="prio-asc">Priorité basse d'abord</option>
        </select>
      </div>
      <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
        <div>
          <div class="text-xs font-bold text-slate-800">Version de l'application</div>
          <div class="text-[11px] text-slate-500">v1.4.6 (Cache: todoapp_v146)</div>
        </div>
        <button onclick="forceAppUpdate()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold hover:bg-slate-800">Forcer MaJ</button>
      </div>
    </div>
  </div>

  <script>
    const CACHE_NAME = 'todoapp_v146';

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = '${CACHE_NAME}';
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => {
          e.waitUntil(caches.keys().then((keys) => Promise.all(keys.filter((k) => k !== CACHE_NAME).map((k) => caches.delete(k)))).then(() => self.clients.claim()));
        });
        self.addEventListener('fetch', (e) => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(err => console.log(err));
    }

    function forceAppUpdate() {
      if ('caches' in window) { caches.keys().then(names => names.forEach(n => caches.delete(n))); }
      localStorage.clear();
      window.location.reload(true);
    }

    // SYSTÈME DE ZOOM & GESTURES
    let currentZoom = 1.0;
    const minZoom = 0.05;
    const maxZoom = 2.0;

    function applyZoom(newZoom) {
      currentZoom = Math.max(minZoom, Math.min(maxZoom, newZoom));
      const container = document.getElementById('zoom-container');
      const range = document.getElementById('zoom-range');
      const label = document.getElementById('zoom-level-label');

      if (container) {
        container.style.transform = `scale(${currentZoom})`;
        if (currentZoom < 0.1) {
          container.classList.add('mini-mode');
        } else {
          container.classList.remove('mini-mode');
        }
      }
      if (range) range.value = currentZoom;
      if (label) label.textContent = Math.round(currentZoom * 100) + '%';
    }

    function adjustZoom(delta) {
      applyZoom(currentZoom + delta);
    }

    function onZoomSliderChange(val) {
      applyZoom(parseFloat(val));
    }

    // Ctrl + Scroll & Pinch to Zoom
    const viewportEl = document.getElementById('viewport');
    if (viewportEl) {
      viewportEl.addEventListener('wheel', (e) => {
        if (e.ctrlKey) {
          e.preventDefault();
          const delta = e.deltaY < 0 ? 0.1 : -0.1;
          applyZoom(currentZoom + delta);
        }
      }, { passive: false });

      let initialTouchDistance = null;
      viewportEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          initialTouchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      viewportEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && initialTouchDistance !== null) {
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = currentDistance / initialTouchDistance;
          applyZoom(currentZoom * (factor > 1 ? 1.02 : 0.98));
          initialTouchDistance = currentDistance;
        }
      }, { passive: true });

      viewportEl.addEventListener('touchend', () => {
        initialTouchDistance = null;
      });
    }

    // Scroll horizontal des catégories
    document.addEventListener('DOMContentLoaded', () => {
      const catTabs = document.getElementById('category-tabs');
      if (catTabs) {
        catTabs.addEventListener('wheel', (e) => {
          if (e.deltaY !== 0) { e.preventDefault(); catTabs.scrollLeft += e.deltaY * 1.5; }
        }, { passive: false });

        let isDown = false, startX, scrollLeft, isDragging = false;
        catTabs.addEventListener('mousedown', (e) => {
          isDown = true; isDragging = false;
          startX = e.pageX - catTabs.offsetLeft; scrollLeft = catTabs.scrollLeft;
        });
        catTabs.addEventListener('mouseleave', () => { isDown = false; });
        catTabs.addEventListener('mouseup', () => { isDown = false; });
        catTabs.addEventListener('mousemove', (e) => {
          if (!isDown) return;
          e.preventDefault();
          const x = e.pageX - catTabs.offsetLeft;
          const walk = (x - startX) * 2;
          if (Math.abs(walk) > 5) isDragging = true;
          catTabs.scrollLeft = scrollLeft - walk;
        });
        catTabs.addEventListener('click', (e) => {
          if (isDragging) { e.preventDefault(); e.stopPropagation(); }
        }, { capture: true });
      }
    });

    // CONFIGURATION SUPABASE
    const SUPABASE_URL = "https://bwirwhcetlfwzqswbfwr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6f1T8ttm3Lc0yTSqsHUikA_XW5eo3X7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STORAGE_KEY = 'todoapp_tasks_v146';

    function generateSafeId() {
      return Math.floor((Date.now() % 1000000000)) * 1000 + Math.floor(Math.random() * 1000);
    }

    function sanitizeTodosList(list) {
      if (!Array.isArray(list)) return [];
      return list.map(t => {
        let safeId = Number(t.id);
        if (!safeId || isNaN(safeId)) safeId = generateSafeId();
        let safeParentId = t.parent_id ? Number(t.parent_id) : null;
        if (safeParentId && isNaN(safeParentId)) safeParentId = null;

        return {
          ...t,
          id: safeId,
          parent_id: safeParentId,
          pauseMode: t.pauseMode || t.pause_mode || 'griser',
          manual_order: Number(t.manual_order || 0)
        };
      });
    }

    let rawLocal = localStorage.getItem(STORAGE_KEY) || 
                   localStorage.getItem('todoapp_tasks_v145') || 
                   localStorage.getItem('todoapp_tasks_v144') || '[]';
    
    let todos = sanitizeTodosList(JSON.parse(rawLocal));

    // GESTION CATÉGORIES
    const BASE_CATEGORIES = ["Général", "Maison", "Jardin", "Voiture", "Aster", "Aimé"];
    let categories = [];
    let activeCategory = "Tout";

    function updateCategories() {
      const localCustomCats = JSON.parse(localStorage.getItem('todoapp_custom_cats') || '[]');
      const usedCategories = todos.map(t => t.category).filter(c => c && c.trim() !== '');
      
      const mergedCats = new Set([...BASE_CATEGORIES, ...localCustomCats, ...usedCategories]);
      
      mergedCats.delete('Tout');
      mergedCats.delete('Masquées');
      
      categories = ['Tout', ...Array.from(mergedCats), 'Masquées'];
      
      if (!categories.includes(activeCategory)) activeCategory = "Tout";
      
      renderCategoryTabs();
    }

    let currentSort = localStorage.getItem('todoapp_sort') || 'perso';
    let currentEditing = { id: null, parentId: null, selectedCategory: 'Général', selectedPriority: 0 };
    let currentLinkInput = null;
    let draggedTaskId = null;

    function showDebugError(msg) {
      const banner = document.getElementById('debug-banner');
      const msgEl = document.getElementById('debug-msg');
      if (banner && msgEl) {
        msgEl.textContent = "Erreur Supabase: " + msg;
        banner.classList.remove('hidden');
      }
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      updateCategories();
      render();
    }

    const splashStartTime = Date.now();
    function hideSplashScreen() {
      const elapsed = Date.now() - splashStartTime;
      const remaining = Math.max(0, 500 - elapsed);
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) {
          splash.classList.add('hidden-splash');
          setTimeout(() => splash.style.display = 'none', 450);
        }
      }, remaining);
    }

    function updateSyncStatus(online, msg) {
      const syncStatus = document.getElementById('sync-status');
      const syncDot = document.getElementById('sync-dot');
      if (syncStatus) {
        syncStatus.textContent = online ? "● Synchro Temps Réel" : "● " + (msg || "Erreur BDD");
        syncStatus.className = online ? "text-emerald-600 font-medium" : "text-amber-600 font-medium";
      }
      if (syncDot) {
        syncDot.className = online ? "w-2.5 h-2.5 rounded-full bg-emerald-500 shrink-0" : "w-2.5 h-2.5 rounded-full bg-amber-500 shrink-0";
      }
    }

    async function pushTaskToCloud(todo) {
      if (!todo) return;
      let safeId = Number(todo.id);
      if (!safeId || isNaN(safeId)) { safeId = generateSafeId(); todo.id = safeId; }
      let safeParentId = todo.parent_id ? Number(todo.parent_id) : null;
      if (safeParentId && isNaN(safeParentId)) safeParentId = null;

      const payload = {
        id: safeId,
        text: todo.text || '',
        completed: !!todo.completed,
        category: todo.category || 'Général',
        priority: Number(todo.priority || 0),
        tags: Array.isArray(todo.tags) ? todo.tags : [],
        notes: todo.notes || '',
        paused: !!todo.paused,
        pause_mode: todo.pauseMode || 'griser',
        parent_id: safeParentId,
        manual_order: Number(todo.manual_order || 0)
      };

      try {
        const res = await supabaseClient.from('todos').upsert([payload]).select();
        if (res.error) {
          console.error("Supabase Push Error:", res.error);
          showDebugError(res.error.message);
          updateSyncStatus(false, res.error.message);
        } else updateSyncStatus(true);
      } catch (err) {
        console.error("Exception pushTaskToCloud:", err);
        showDebugError("Erreur Réseau");
        updateSyncStatus(false, "Hors-ligne");
      }
    }

    let realtimeChannel = null;
    function initRealtime() {
      if (realtimeChannel) {
        try { supabaseClient.removeChannel(realtimeChannel); } catch(e){}
      }
      realtimeChannel = supabaseClient
        .channel('todos_realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'todos' }, () => syncCloud())
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') updateSyncStatus(true);
          else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') updateSyncStatus(false, "Canal fermé");
        });
    }

    window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { initRealtime(); syncCloud(); } });
    window.addEventListener('focus', () => { initRealtime(); syncCloud(); });
    window.addEventListener('online', () => { initRealtime(); syncCloud(); });

    async function syncCloud() {
      const syncIcon = document.getElementById('sync-icon');
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const { data, error } = await supabaseClient.from('todos').select('*');
        if (error) {
          console.error("Erreur Sync Supabase:", error);
          showDebugError(error.message);
          updateSyncStatus(false, error.message);
          hideSplashScreen();
          return;
        }

        updateSyncStatus(true);
        if (Array.isArray(data)) {
          const serverMap = new Map();
          data.forEach(item => { const sId = Number(item.id); if (sId && !isNaN(sId)) serverMap.set(sId, item); });
          const mergedTodos = [];
          const processedServerIds = new Set();

          todos.forEach(localTask => {
            const lId = Number(localTask.id);
            if (!lId || isNaN(lId)) return;
            if (serverMap.has(lId)) {
              const sItem = serverMap.get(lId);
              processedServerIds.add(lId);
              mergedTodos.push({
                id: lId,
                text: sItem.text || sItem.title || localTask.text,
                completed: sItem.completed !== undefined ? !!sItem.completed : localTask.completed,
                category: sItem.category || localTask.category || 'Général',
                priority: sItem.priority !== undefined ? Number(sItem.priority) : (localTask.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : (localTask.tags || []),
                notes: sItem.notes !== undefined ? sItem.notes : (localTask.notes || ''),
                paused: sItem.paused !== undefined ? !!sItem.paused : (localTask.paused || false),
                pauseMode: sItem.pause_mode || localTask.pauseMode || 'griser',
                collapsed: !!localTask.collapsed,
                parent_id: (sItem.parent_id && !isNaN(Number(sItem.parent_id))) ? Number(sItem.parent_id) : null,
                manual_order: sItem.manual_order !== undefined ? Number(sItem.manual_order) : Number(localTask.manual_order || 0),
                created_at: localTask.created_at || sItem.created_at || new Date().toISOString()
              });
            }
          });

          data.forEach(sItem => {
            const sId = Number(sItem.id);
            if (sId && !isNaN(sId) && !processedServerIds.has(sId)) {
              mergedTodos.push({
                id: sId,
                text: sItem.text || sItem.title || '',
                completed: !!sItem.completed,
                category: sItem.category || 'Général',
                priority: Number(sItem.priority || 0),
                tags: Array.isArray(sItem.tags) ? sItem.tags : [],
                notes: sItem.notes || '',
                paused: !!sItem.paused,
                pauseMode: sItem.pause_mode || 'griser',
                collapsed: false,
                parent_id: (sItem.parent_id && !isNaN(Number(sItem.parent_id))) ? Number(sItem.parent_id) : null,
                manual_order: Number(sItem.manual_order || 0),
                created_at: sItem.created_at || new Date().toISOString()
              });
            }
          });
          todos = sanitizeTodosList(mergedTodos);
          saveLocal();
        }
      } catch (err) {
        console.error("Exception syncCloud:", err);
        showDebugError("Erreur réseau");
        updateSyncStatus(false, "Hors-ligne");
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        hideSplashScreen();
      }
    }

    async function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;
      const targetCat = (activeCategory === 'Tout' || activeCategory === 'Masquées') ? 'Général' : activeCategory;
      
      const categoryTasks = todos.filter(t => t.parent_id === null);
      const newOrder = categoryTasks.length > 0 ? Math.min(...categoryTasks.map(t => t.manual_order || 0)) - 10 : 0;

      const newTodo = {
        id: generateSafeId(),
        text: text, completed: false, category: targetCat, priority: 0, tags: [], notes: '',
        paused: false, pauseMode: 'griser', collapsed: false, parent_id: null, manual_order: newOrder, created_at: new Date().toISOString()
      };
      todos.unshift(newTodo);
      input.value = '';
      saveLocal();
      await pushTaskToCloud(newTodo);
      await syncCloud();
    }

    function addSubtask(e, parentId) {
      if (e) e.stopPropagation();
      const parent = todos.find(t => t.id === Number(parentId));
      if (!parent) return;

      currentEditing = { id: 'new-subtask', parentId: parent.id, selectedCategory: parent.category || 'Général', selectedPriority: 0 };
      
      document.getElementById('modal-heading').textContent = 'Nouvelle sous-tâche';
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-tags').value = '';
      document.getElementById('modal-notes').value = '';
      document.getElementById('modal-paused').checked = false;
      const pauseModes = document.getElementsByName('pause-mode');
      pauseModes.forEach(r => r.checked = (r.value === 'griser'));
      togglePauseOptions();
      renderModalCategories();
      setModalPriority(0);
      
      document.getElementById('edit-modal').classList.remove('hidden');
      document.getElementById('edit-modal').classList.add('flex');
    }

    function toggleCollapse(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === Number(id));
      if (!task) return;
      task.collapsed = !task.collapsed;
      saveLocal();
    }

    function uncollapseAncestors(taskId, updatedList = []) {
      const task = todos.find(t => t.id === taskId);
      if (task && task.parent_id) {
        const parent = todos.find(t => t.id === task.parent_id);
        if (parent && parent.collapsed) {
          parent.collapsed = false;
          updatedList.push(parent);
        }
        uncollapseAncestors(parent.id, updatedList);
      }
    }

    function uncheckDescendants(taskId, updatedList) {
      const children = todos.filter(t => t.parent_id === taskId);
      for (const child of children) {
        if (child.completed) {
          child.completed = false;
          if (!updatedList.some(u => u.id === child.id)) updatedList.push(child);
        }
        uncheckDescendants(child.id, updatedList);
      }
    }

    function uncheckAncestors(parentId, updatedList) {
      if (!parentId) return;
      const parent = todos.find(t => t.id === parentId);
      if (parent && parent.completed) {
        parent.completed = false;
        if (!updatedList.some(u => u.id === parent.id)) updatedList.push(parent);
        if (parent.parent_id) uncheckAncestors(parent.parent_id, updatedList);
      }
    }

    async function toggleTask(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === Number(id));
      if (!task) return;
      const newStatus = !task.completed;
      const updatedTasks = [];
      task.completed = newStatus;
      updatedTasks.push(task);

      if (newStatus === false) {
        uncheckDescendants(task.id, updatedTasks);
        uncheckAncestors(task.parent_id, updatedTasks);
      } else {
        uncollapseAncestors(task.id, updatedTasks);
      }

      saveLocal();
      for (const t of updatedTasks) {
        await pushTaskToCloud(t);
      }
      await syncCloud();
    }

    async function deleteTask(e, id) {
      if (e) e.stopPropagation();
      const targetId = Number(id);
      const idsToDelete = [];
      
      function collectChildren(pId) {
        idsToDelete.push(pId);
        todos.filter(t => t.parent_id === pId).forEach(c => collectChildren(c.id));
      }
      collectChildren(targetId);

      todos = todos.filter(t => !idsToDelete.includes(t.id));
      saveLocal();

      try {
        await supabaseClient.from('todos').delete().in('id', idsToDelete);
        updateSyncStatus(true);
      } catch (err) {
        console.error("Erreur suppression Cloud:", err);
        showDebugError("Erreur suppression");
      }
      await syncCloud();
    }

    function editTask(e, id) {
      if (e) e.stopPropagation();
      const task = todos.find(t => t.id === Number(id));
      if (!task) return;

      currentEditing = {
        id: task.id,
        parentId: task.parent_id,
        selectedCategory: task.category || 'Général',
        selectedPriority: Number(task.priority || 0)
      };

      document.getElementById('modal-heading').textContent = 'Éditer la tâche';
      document.getElementById('modal-title').value = task.text || '';
      document.getElementById('modal-tags').value = Array.isArray(task.tags) ? task.tags.join(', ') : '';
      document.getElementById('modal-notes').value = task.notes || '';
      document.getElementById('modal-paused').checked = !!task.paused;
      
      const pauseModes = document.getElementsByName('pause-mode');
      pauseModes.forEach(r => r.checked = (r.value === (task.pauseMode || 'griser')));
      togglePauseOptions();

      renderModalCategories();
      setModalPriority(task.priority || 0);

      document.getElementById('edit-modal').classList.remove('hidden');
      document.getElementById('edit-modal').classList.add('flex');
    }

      document.getElementById('edit-modal').classList.add('hidden');
      document.getElementById('edit-modal').classList.remove('flex');
      hideTaskSuggestions();
      hideTagSuggestions();
    }

    function closeModalOnOut(e) {
      if (e.target.id === 'edit-modal') closeModal();

    function handleModalKeyDown(e) {

    }

      document.getElementById('sort-select').value = currentSort;
      document.getElementById('settings-modal').classList.remove('hidden');
      document.getElementById('settings-modal').classList.add('flex');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
      document.getElementById('settings-modal').classList.remove('flex');
    }

    function closeSettingsModalOnOut(e) {
      if (e.target.id === 'settings-modal') closeSettingsModal();
    }

    function setSortOption(val) {
      currentSort = val;
      localStorage.setItem('todoapp_sort', val);
      render();
    }

    function togglePauseOptions() {
      const isPaused = document.getElementById('modal-paused').checked;
      const optionsDiv = document.getElementById('pause-options');
      if (optionsDiv) {
        optionsDiv.style.display = isPaused ? 'block' : 'none';

    function setModalPriority(p) {
      currentEditing.selectedPriority = Number(p);
      const btns = document.querySelectorAll('.prio-btn');
      btns.forEach(btn => {
        const prioVal = Number(btn.getAttribute('data-prio'));

    function renderModalCategories() {
      const container = document.getElementById('modal-categories-container');
      if (!container) return;
      container.innerHTML = '';

      const filterCats = categories.filter(c => c !== 'Tout' && c !== 'Masquées');
      filterCats.forEach(cat => {

        btn.className = isSel 
          ? "px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white shadow-sm"
          : "px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-slate-200";

        btn.onclick = () => {
          currentEditing.selectedCategory = cat;
          renderModalCategories();
        };

      });

    async function saveModal() {
      const title = document.getElementById('modal-title').value.trim();
      if (!title) return;

      const tagsRaw = document.getElementById('modal-tags').value;
      const tags = tagsRaw.split(',').map(t => t.trim()).filter(t => t.length > 0);
      const notes = document.getElementById('modal-notes').value.trim();
      const paused = document.getElementById('modal-paused').checked;

      let pauseMode = 'griser';
      const pauseRadios = document.getElementsByName('pause-mode');
      pauseRadios.forEach(r => { if (r.checked) pauseMode = r.value; });

      if (currentEditing.id === 'new-subtask') {
        const parentTasks = todos.filter(t => t.parent_id === currentEditing.parentId);
        const newOrder = parentTasks.length > 0 ? Math.max(...parentTasks.map(t => t.manual_order || 0)) + 10 : 0;
        const newSubtask = {
          id: generateSafeId(),
          text: title,
          completed: false,
          category: currentEditing.selectedCategory,
          priority: currentEditing.selectedPriority,
          tags: tags,
          notes: notes,
          paused: paused,
          pauseMode: pauseMode,
          collapsed: false,
          parent_id: currentEditing.parentId,
          manual_order: newOrder,
          created_at: new Date().toISOString()
        };
        todos.push(newSubtask);
        saveLocal();
        await pushTaskToCloud(newSubtask);
      } else {
        const task = todos.find(t => t.id === currentEditing.id);
        if (task) {
          task.text = title;
          task.category = currentEditing.selectedCategory;
          task.priority = currentEditing.selectedPriority;
          task.tags = tags;
          task.notes = notes;
          task.paused = paused;
          task.pauseMode = pauseMode;

          saveLocal();
          await pushTaskToCloud(task);
        }
      }

      closeModal();
      await syncCloud();
    }

    function handleTagAutocomplete(e) {
      const input = e.target;
      const val = input.value;
      const parts = val.split(',');
      const currentQuery = parts[parts.length - 1].trim().toLowerCase();
      const suggestionsUl = document.getElementById('tag-suggestions');

      if (!currentQuery) {
        suggestionsUl.classList.add('hidden');
        return;
      }

      const allTags = new Set();
      todos.forEach(t => { if (Array.isArray(t.tags)) t.tags.forEach(tg => allTags.add(tg)); });

      const matches = Array.from(allTags).filter(tg => tg.toLowerCase().includes(currentQuery));
      if (matches.length === 0) {
        suggestionsUl.classList.add('hidden');
        return;
      }

      suggestionsUl.innerHTML = '';
      matches.forEach(m => {
        const li = document.createElement('li');
        li.className = 'px-3 py-1.5 hover:bg-slate-100 cursor-pointer text-xs font-semibold text-slate-700';
        li.textContent = m;
        li.onclick = () => {
          parts[parts.length - 1] = ' ' + m;
          input.value = parts.join(', ') + ', ';
          suggestionsUl.classList.add('hidden');
          input.focus();
        };
        suggestionsUl.appendChild(li);
      });
      suggestionsUl.classList.remove('hidden');
    }

    function hideTagSuggestions() {
      const suggestionsUl = document.getElementById('tag-suggestions');
      if (suggestionsUl) suggestionsUl.classList.add('hidden');
    }

    function handleTaskLinkAutocomplete(e) {
      const input = e.target;
      currentLinkInput = input;
      const val = input.value;
      const cursorPos = input.selectionStart;
      const textBeforeCursor = val.slice(0, cursorPos);
      const lastDollarIndex = textBeforeCursor.lastIndexOf('$');

      if (lastDollarIndex === -1) {
        hideTaskSuggestions();
        return;
      }

      const query = textBeforeCursor.slice(lastDollarIndex + 1).toLowerCase();
      if (query.includes(' ')) {
        hideTaskSuggestions();
        return;
      }

      const suggestionsUl = document.getElementById('task-link-suggestions');
      const matches = todos.filter(t => t.text.toLowerCase().includes(query) && t.id !== currentEditing.id);

      if (matches.length === 0) {
        hideTaskSuggestions();
        return;
      }

      const rect = input.getBoundingClientRect();
      suggestionsUl.style.top = (rect.bottom + window.scrollY) + 'px';
      suggestionsUl.style.left = (rect.left + window.scrollX) + 'px';

      suggestionsUl.innerHTML = '';
      matches.slice(0, 5).forEach(t => {
        const li = document.createElement('li');
        li.className = 'px-3 py-2 hover:bg-slate-100 cursor-pointer text-xs font-semibold text-slate-700 truncate border-b border-slate-100 last:border-none';
        li.textContent = `#${t.id} - ${t.text}`;
        li.onclick = () => {
          const before = val.slice(0, lastDollarIndex);
          const after = val.slice(cursorPos);
          input.value = `${before}$[${t.text}](#${t.id})${after}`;
          hideTaskSuggestions();
          input.focus();
        };
        suggestionsUl.appendChild(li);
      });
      suggestionsUl.classList.remove('hidden');
    }

    function hideTaskSuggestions() {
      const suggestionsUl = document.getElementById('task-link-suggestions');
      if (suggestionsUl) suggestionsUl.classList.add('hidden');
    }

    function scrollToTask(id) {
      const el = document.getElementById(`task-card-${id}`);
      if (el) {
        uncollapseAncestors(id);
        render();
        setTimeout(() => {
          const targetEl = document.getElementById(`task-card-${id}`);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetEl.classList.add('highlight-task');
            setTimeout(() => targetEl.classList.remove('highlight-task'), 1500);
          }
        }, 50);
      }
    }

    function formatTextWithLinks(text) {
      if (!text) return '';
      const escaped = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return escaped.replace(/\$\[(.*?)\]\(#(\d+)\)/g, (match, title, id) => {
        return `<button onclick="scrollToTask(${id})" class="text-indigo-600 underline font-bold bg-indigo-50 px-1 py-0.5 rounded text-xs hover:bg-indigo-100 inline-block my-0.5">🔗 ${title}</button>`;
      });
    }

    // DRAG & DROP
    function handleDragStart(e, id) {
      draggedTaskId = Number(id);
      e.dataTransfer.setData('text/plain', id);
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e, targetId) {
      e.preventDefault();
      if (draggedTaskId === Number(targetId)) return;
      const card = document.getElementById(`task-item-${targetId}`);
      if (card) card.classList.add('drop-target-active');
    }

    function handleDragLeave(e, targetId) {
      const card = document.getElementById(`task-item-${targetId}`);
      if (card) card.classList.remove('drop-target-active');
    }

    async function handleDrop(e, targetId) {
      e.preventDefault();
      const card = document.getElementById(`task-item-${targetId}`);
      if (card) card.classList.remove('drop-target-active');

      const sourceId = draggedTaskId;
      const destId = Number(targetId);

      if (!sourceId || sourceId === destId) return;

      function isDescendant(parent, childId) {
        const children = todos.filter(t => t.parent_id === parent);
        for (let c of children) {
          if (c.id === childId || isDescendant(c.id, childId)) return true;
        }
        return false;
      }

      if (isDescendant(sourceId, destId)) return;

      const sourceTask = todos.find(t => t.id === sourceId);
      const destTask = todos.find(t => t.id === destId);
      if (!sourceTask || !destTask) return;

      sourceTask.parent_id = destTask.id;
      sourceTask.category = destTask.category;

      saveLocal();
      await pushTaskToCloud(sourceTask);
      await syncCloud();
    }

    // ONGLETS CATÉGORIES
    function renderCategoryTabs() {
      const container = document.getElementById('category-tabs');
      if (!container) return;
      container.innerHTML = '';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isActive = (cat === activeCategory);
        btn.className = isActive
          ? "px-3 py-1 rounded-full text-xs font-extrabold bg-slate-900 text-white shrink-0 shadow-sm"
          : "px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0";
        btn.textContent = cat;
        btn.onclick = () => {
          activeCategory = cat;
          renderCategoryTabs();
          render();
        };
        container.appendChild(btn);
      });
    }

    // RENDU ARBORESCENCE
    function render() {
      const treeContainer = document.getElementById('task-tree');
      if (!treeContainer) return;
      treeContainer.innerHTML = '';

      let filteredTodos = todos;

      if (activeCategory === 'Masquées') {
        filteredTodos = todos.filter(t => t.paused && t.pauseMode === 'masquer');
      } else if (activeCategory !== 'Tout') {
        filteredTodos = todos.filter(t => t.category === activeCategory);
      } else {
        filteredTodos = todos.filter(t => !(t.paused && t.pauseMode === 'masquer'));
      }

      const sortedTodos = [...filteredTodos].sort((a, b) => {
        if (currentSort === 'date-desc') return new Date(b.created_at || 0) - new Date(a.created_at || 0);
        if (currentSort === 'date-asc') return new Date(a.created_at || 0) - new Date(b.created_at || 0);
        if (currentSort === 'prio-desc') return (b.priority || 0) - (a.priority || 0);
        if (currentSort === 'prio-asc') return (a.priority || 0) - (b.priority || 0);
        return (a.manual_order || 0) - (b.manual_order || 0);
      });

      const rootTasks = sortedTodos.filter(t => {
        if (activeCategory !== 'Tout' && activeCategory !== 'Masquées') {
          return t.parent_id === null || !todos.some(p => p.id === t.parent_id && p.category === activeCategory);
        }
        return t.parent_id === null || !todos.some(p => p.id === t.parent_id);
      });

      if (rootTasks.length === 0) {
        treeContainer.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs font-medium">Aucune tâche disponible</div>`;
      } else {
        rootTasks.forEach(task => {
          treeContainer.appendChild(createTaskNode(task, sortedTodos, 0));
        });
      }

      const countEl = document.getElementById('task-count');
      if (countEl) {
        const activeCount = todos.filter(t => !t.completed).length;
        countEl.textContent = `${activeCount} tâche${activeCount > 1 ? 's' : ''} restante${activeCount > 1 ? 's' : ''}`;
      }
    }

    function createTaskNode(task, allTasks, level) {
      const wrapper = document.createElement('div');
      wrapper.id = `task-item-${task.id}`;
      wrapper.className = `task-item-wrapper ${level > 0 ? 'ml-4 pl-2 border-l-2 border-slate-100' : ''}`;

      const isPausedGriser = task.paused && task.pauseMode === 'griser';
      const children = allTasks.filter(t => t.parent_id === task.id);
      const hasChildren = children.length > 0;

      let miniColorClass = 'mini-orange';
      if (task.completed) miniColorClass = 'mini-green';
      else if (task.priority >= 3) miniColorClass = 'mini-red';

      const priorityBadges = {
        0: '',
        1: '<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-blue-100 text-blue-700">P1</span>',
        2: '<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-amber-100 text-amber-700">P2</span>',
        3: '<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-orange-100 text-orange-700">P3</span>',
        4: '<span class="px-1.5 py-0.5 rounded text-[10px] font-extrabold bg-rose-100 text-rose-700">P4</span>'
      };

      const tagsHtml = (Array.isArray(task.tags) && task.tags.length > 0)
        ? task.tags.map(tg => `<span class="px-1.5 py-0.5 bg-slate-100 text-slate-600 rounded text-[10px] font-semibold">#${tg}</span>`).join(' ')
        : '';

      const card = document.createElement('div');
      card.id = `task-card-${task.id}`;
      card.className = `task-card-bg bg-white border border-slate-200/80 rounded-2xl p-3 shadow-sm hover:shadow transition-all duration-150 mb-2 group relative ${isPausedGriser ? 'opacity-40 grayscale bg-slate-50' : ''}`;
      card.setAttribute('draggable', 'true');
      card.ondragstart = (e) => handleDragStart(e, task.id);
      card.ondragover = (e) => handleDragOver(e);
      card.ondragenter = (e) => handleDragEnter(e, task.id);
      card.ondragleave = (e) => handleDragLeave(e, task.id);
      card.ondrop = (e) => handleDrop(e, task.id);

      card.classList.add(miniColorClass);

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div class="flex items-start gap-2.5 flex-1 min-w-0">
            <button onclick="toggleTask(event, ${task.id})" class="mt-0.5 w-5 h-5 rounded-lg border-2 flex items-center justify-center shrink-0 transition-colors ${task.completed ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 hover:border-slate-400 bg-white'}">
              ${task.completed ? '✓' : ''}
            </button>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-1.5 flex-wrap">
                ${hasChildren ? `
                  <button onclick="toggleCollapse(event, ${task.id})" class="text-slate-400 hover:text-slate-700 text-xs font-bold w-4 h-4 flex items-center justify-center">
                    ${task.collapsed ? '▶' : '▼'}
                  </button>
                ` : ''}
                <span class="text-sm font-semibold ${task.completed ? 'line-through text-slate-400' : 'text-slate-800'} break-words">
                  ${formatTextWithLinks(task.text)}
                </span>
                ${priorityBadges[task.priority] || ''}
                ${task.paused ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-purple-100 text-purple-700">⏸ Pause</span>` : ''}
              </div>
              ${(tagsHtml || task.notes) ? `
                <div class="mt-1 flex flex-wrap items-center gap-1.5 text-xs text-slate-500">
                  ${tagsHtml}${task.notes ? `<div class="text-[11px] text-slate-400 bg-slate-50 px-2 py-0.5 rounded-md border border-slate-100 w-full mt-1">${formatTextWithLinks(task.notes)}</div>` : ''}
                </div>
              ` : ''}
            </div>
          </div>
          <div class="flex items-center gap-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity shrink-0">
            <button onclick="addSubtask(event, ${task.id})" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold flex items-center justify-center" title="Ajouter une sous-tâche">+</button>
            <button onclick="editTask(event, ${task.id})" class="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold flex items-center justify-center" title="Éditer">✏️</button>
            <button onclick="deleteTask(event, ${task.id})" class="w-7 h-7 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold flex items-center justify-center" title="Supprimer">🗑️</button>
          </div>
        </div>
      `;

      wrapper.appendChild(card);

      if (hasChildren && !task.collapsed) {
        const childrenContainer = document.createElement('div');
        childrenContainer.className = 'children-container space-y-1';
        children.forEach(child => {
          childrenContainer.appendChild(createTaskNode(child, allTasks, level + 1));
        });
        wrapper.appendChild(childrenContainer);
      }

      return wrapper;
    }

    // INITIALISATION
    document.addEventListener('DOMContentLoaded', () => {
      updateCategories();
      renderCategoryTabs();
      render();
      initRealtime();
      syncCloud();
    });
  </script>
</body>
</html>
