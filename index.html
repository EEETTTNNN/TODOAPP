  <style>
    body { -webkit-tap-highlight-color: transparent; overflow-x: hidden; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* Vue Zoom Dynamique */
    #todo-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(calc(var(--zoom-level, 100) * 1%), 1fr));
      gap: calc(var(--zoom-gap, 12) * 1px);
      transition: all 0.3s ease;
    }

    /* Swipe Container */
    .swipe-wrapper { position: relative; overflow: hidden; border-radius: 1rem; margin-bottom: 0.75rem; }
    .swipe-background { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 1rem; color: white; font-weight: bold; font-size: 0.875rem; border-radius: 1rem; z-index: 0; }
    .swipe-bg-left { background-color: #22c55e; width: 50%; display: flex; align-items: center; justify-content: flex-start; padding-left: 20px;}
    .swipe-bg-right { background-color: #f43f5e; width: 50%; position: absolute; right: 0; height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 20px; }
    .swipe-bg-pause { background-color: #f59e0b; width: 50%; position: absolute; right: 0; height: 100%; display: flex; align-items: center; justify-content: flex-end; padding-right: 80px; opacity: 0;}
    .swipe-content {
      position: relative; z-index: 10; background: white; transition: transform 0.2s ease-out; width: 100%; height: 100%;
    }

    /* Comportement Cube (Zoom fort) */
    .view-cube .swipe-content { padding: 0 !important; border: none !important; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
    .view-cube .task-details, .view-cube .subtask-container, .view-cube .task-progress-bar { display: none !important; }
    .view-cube .cube-indicator { display: block !important; width: 100%; height: 100%; border-radius: 0.5rem; }

    /* Couleurs de progression & Priorités */
    .progress-red { background-color: #ef4444; }
    .progress-orange { background-color: #f97316; }
    .progress-yellow { background-color: #eab308; }
    .progress-green { background-color: #22c55e; }

    .prio-1 { border-left: 8px solid #cbd5e1 !important; }
    .prio-2 { border-left: 8px solid #3b82f6 !important; }
    .prio-3 { border-left: 8px solid #f97316 !important; }
    .prio-4 { border-left: 8px solid #ef4444 !important; }

    .cube-indicator { display: none; }
  </style>
</head>

  <!-- POPUP SETTINGS -->
  <div id="settings-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-50" onclick="document.getElementById('settings-modal').classList.add('hidden')">

  <script>
    const SUPABASE_URL = "https://bwirwhcetlfwzqswbfwr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6f1T8ttm3Lc0yTSqsHUikA_XW5eo3X7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let todos = [];
    let currentCategory = 'Tous';
    let zoomLevel = 100;
    
    function updateZoom() {
      const slider = document.getElementById('zoom-slider');
      zoomLevel = parseInt(slider.value);
      const list = document.getElementById('todo-list');
      
      if (zoomLevel <= 30) {
        list.style.setProperty('--zoom-level', '12'); // Petit cubes
        list.style.setProperty('--zoom-gap', '4');
        list.classList.add('view-cube');
      } else {
        list.style.setProperty('--zoom-level', '100'); // Lignes pleines
        list.style.setProperty('--zoom-gap', '12');
        list.classList.remove('view-cube');
        const scale = 0.5 + (zoomLevel / 200);
        list.style.zoom = scale; 
      }
    }

    function extractGlobalCategories() {
      let cats = new Set(['Tous', 'Général', 'Travail', 'Maison', 'Voiture']);
      todos.forEach(t => { if (t.category) cats.add(t.category); });
      const customCats = JSON.parse(localStorage.getItem('todoapp_custom_cats') || '[]');
      customCats.forEach(c => cats.add(c));
      return Array.from(cats);
    }

    function loadLocal() {
      const stored = localStorage.getItem('todoapp_v104');
      if (stored) { todos = JSON.parse(stored); render(); }
    }
    
    function saveLocal() {
      localStorage.setItem('todoapp_v104', JSON.stringify(todos));
      render();
    }

    async function syncCloud() {
      const { data, error } = await supabaseClient.from('todos').select('*');
      if (!error && data) { 
        todos = data; 
        saveLocal(); 
      }
    }

    function handleInputKey(e) {
      if (e.key === 'Enter') {
        if (e.shiftKey) {
          // Maj+Entrée ajoute une simple ligne (comportement naturel d'une tâche textuelle)
          setTimeout(() => { 
            const input = e.target;
            input.style.height = 'auto'; 
            input.style.height = (input.scrollHeight) + 'px'; 
          }, 0);
        } else {
          e.preventDefault();
          submitNewTask();
        }
      }
    }

    async function submitNewTask() {
      const input = document.getElementById('todo-input');
      const text = input.value;
      if (!text.trim()) return;

      const lines = text.split('\n').filter(l => l.trim());
      const mainLine = lines[0];
      
      let tags = []; let priority = 1; let cleanText = mainLine;

      const prioMatch = cleanText.match(/!([1-4])/);
      if (prioMatch) { priority = parseInt(prioMatch[1]); cleanText = cleanText.replace(prioMatch[0], ''); }
      
      const tagRegex = /#(\w+)/g;
      let tagMatch;
      while ((tagMatch = tagRegex.exec(cleanText)) !== null) { tags.push(tagMatch[1]); cleanText = cleanText.replace(tagMatch[0], ''); }

      const subtasks = lines.slice(1).map((l, idx) => ({ 
        id: Date.now() + idx, 
        text: l.trim().replace(/^- /, ''), 
        completed: false, tags: [], priority: 1, duration: '' 
      }));

      const newTodo = {
        text: cleanText.trim(), completed: false, 
        category: currentCategory === 'Tous' ? 'Général' : currentCategory,
        priority, tags: [...new Set(tags)], duration: '', subtasks, notes: '', paused: false, created_at: new Date()
      };

      input.value = ''; input.style.height = 'auto';
      document.getElementById('autocomplete-list').classList.add('hidden');

      const tempId = Date.now();
      todos.unshift({ id: tempId, ...newTodo });
      saveLocal();

      const { data, error } = await supabaseClient.from('todos').insert([newTodo]).select();
      if (!error && data) {
        todos = todos.map(t => t.id === tempId ? data[0] : t);
        saveLocal();
      }
    }

    function handleAutocomplete(e) {
      const val = e.target.value;
      const match = val.substring(0, e.target.selectionStart).match(/\$([a-zA-Z0-9_àéèêàâôûùç-]*)$/);
      const list = document.getElementById('autocomplete-list');
      
      if (match) {
        const query = match[1].toLowerCase();
        const filtered = todos.filter(t => t.text.toLowerCase().includes(query)).slice(0, 5);
        if (filtered.length > 0) {
          list.innerHTML = filtered.map(t => `<li class="px-4 py-2 hover:bg-slate-100 cursor-pointer text-sm" onmousedown="insertLink('${t.text.replace(/'/g, "\\'")}')">${t.text}</li>`).join('');
          list.classList.remove('hidden');
        } else list.classList.add('hidden');
      } else list.classList.add('hidden');
    }

    function insertLink(taskText) {
      const input = document.getElementById('todo-input');
      const val = input.value;
      const textBefore = val.substring(0, input.selectionStart).replace(/\$[a-zA-Z0-9_àéèêàâôûùç-]*$/, `$${taskText} `);
      input.value = textBefore + val.substring(input.selectionEnd);
      document.getElementById('autocomplete-list').classList.add('hidden');
      input.focus();
    }

    function parseHyperlinks(text) {
      return text.replace(/\$([a-zA-Z0-9_àéèêàâôûùç\s-]+?)(?=\s|$)/g, (match, targetName) => {
        const target = todos.find(t => t.text.toLowerCase() === targetName.toLowerCase().trim());
        if (target) {
          const isDone = target.completed;
          return `<span style="color: ${isDone ? '#22c55e' : '#ef4444'}" class="font-bold underline cursor-pointer" onclick="event.stopPropagation(); scrollToTask(${target.id})">$${targetName}</span>`;
        }
        return `<span class="text-indigo-600 underline">${match}</span>`;
      });
    }

    function checkDependencies(todo) {
      const depRegex = /\$([a-zA-Z0-9_àéèêàâôûùç\s-]+?)(?=\s|$)/g;
      let match;
      while ((match = depRegex.exec(todo.text)) !== null) {
        const targetName = match[1].trim().toLowerCase();
        const targetTodo = todos.find(t => t.text.toLowerCase() === targetName);
        if (targetTodo && !targetTodo.completed) return targetTodo;
      }
      return null;
    }

    function showDependencyAlert(targetTodo) {
      document.getElementById('dep-task-name').textContent = targetTodo.text;
      document.getElementById('dep-btn-voir').onclick = () => {
        closeDependencyModal();
        scrollToTask(targetTodo.id);
      };
      document.getElementById('dependency-modal').classList.remove('hidden');
      document.getElementById('dependency-modal').classList.add('flex');
    }
    
    function closeDependencyModal() { 
        document.getElementById('dependency-modal').classList.add('hidden'); 
    }

    async function handleToggle(e, id, isSub = false, parentId = null) {
      e.stopPropagation();
      let todo, parentTodo;
      
      if (isSub) {
        parentTodo = todos.find(t => t.id === parentId);
        todo = parentTodo.subtasks.find(s => s.id === id);
      } else {
        todo = todos.find(t => t.id === id);
        const blocker = checkDependencies(todo);
        if (!todo.completed && blocker) { showDependencyAlert(blocker); return; }
      }

      todo.completed = !todo.completed;
      saveLocal();

      if (isSub) await supabaseClient.from('todos').update({ subtasks: parentTodo.subtasks }).eq('id', parentId);
      else await supabaseClient.from('todos').update({ completed: todo.completed }).eq('id', id);
    }

    async function handleDelete(id) {
      todos = todos.filter(t => t.id !== id);
      saveLocal();
      await supabaseClient.from('todos').delete().eq('id', id);
    }

    async function handlePause(id) {
      const todo = todos.find(t => t.id === id);
      todo.paused = !todo.paused;
      saveLocal();
      await supabaseClient.from('todos').update({ paused: todo.paused }).eq('id', id);
    }

    function render() {
      const cats = extractGlobalCategories();
      const nav = document.getElementById('category-tabs');
      nav.innerHTML = cats.map(cat => `<button onclick="currentCategory='${cat}'; render();" class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${currentCategory === cat ? 'bg-slate-900 text-white' : 'bg-white text-slate-500 border border-slate-200'}">${cat}</button>`).join('') + 
      `<button onclick="addCategory()" class="px-3 py-1.5 rounded-full text-xs font-bold bg-slate-200 text-slate-700">+</button>`;

      const listEl = document.getElementById('todo-list');
      listEl.innerHTML = '';

      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const sortVal = document.getElementById('sort-select').value;
      const showPaused = document.getElementById('show-paused').checked;

      let filtered = todos.filter(t => {
        if (t.paused && !showPaused) return false;
        if (!t.paused && showPaused) return false;
        const catMatch = (currentCategory === 'Tous') || (t.category === currentCategory);
        let tagMatch = true;
        if (searchQuery) {
          const terms = searchQuery.split(' ');
          const tagsStr = (t.tags || []).join(' ').toLowerCase();
          const textStr = t.text.toLowerCase();
          tagMatch = terms.every(q => q.startsWith('-#') ? !tagsStr.includes(q.substring(2)) : (tagsStr.includes(q) || textStr.includes(q)));
        }
        return catMatch && tagMatch;
      });

      filtered.sort((a, b) => sortVal === 'priority' ? (b.priority - a.priority || b.id - a.id) : (sortVal === 'date-asc' ? a.id - b.id : b.id - a.id));

      document.getElementById('current-tab-name').textContent = currentCategory;
      const bar = document.getElementById('global-bar');
      const text = document.getElementById('global-pct-text');
      
      let totalPct = 0;
      filtered.forEach(t => totalPct += (t.subtasks && t.subtasks.length > 0) ? (t.subtasks.filter(s => s.completed).length / t.subtasks.length)*100 : (t.completed ? 100 : 0));
      const avg = filtered.length ? Math.round(totalPct / filtered.length) : 0;
      
      text.textContent = `${avg}%`; bar.style.width = `${avg}%`;
      bar.className = `h-2.5 transition-all duration-300 ${avg >= 100 ? 'progress-green' : avg >= 66 ? 'progress-yellow' : avg >= 33 ? 'progress-orange' : 'progress-red'}`;

      filtered.forEach(todo => {
        const hasSub = todo.subtasks && todo.subtasks.length > 0;
        const subPct = hasSub ? Math.round((todo.subtasks.filter(s => s.completed).length / todo.subtasks.length)*100) : (todo.completed ? 100 : 0);
        let cColor = subPct >= 100 ? 'progress-green' : subPct >= 66 ? 'progress-yellow' : subPct >= 33 ? 'progress-orange' : 'progress-red';

        const backlinks = todos.filter(t => t.text.toLowerCase().includes('$' + todo.text.toLowerCase()));

        const li = document.createElement('li');
        li.id = `task-${todo.id}`;
        li.className = "swipe-wrapper";
        
        li.innerHTML = `
          <div class="swipe-background">
            <div class="swipe-bg-left">✓ Valider</div>
            <div class="swipe-bg-pause">⏸ Pause</div>
            <div class="swipe-bg-right">✕ Supprimer</div>
          </div>
          <div class="swipe-content bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 border-l-[6px] prio-${todo.priority || 1} ${todo.completed ? 'opacity-50' : ''}" id="swipe-content-${todo.id}">
            
            <div class="cube-indicator ${cColor}"></div>

            <div class="task-details flex items-start gap-3 cursor-pointer" onclick="openModal(${todo.id}, false)">
              <div onclick="handleToggle(event, ${todo.id})" class="mt-1 flex-shrink-0 w-7 h-7 rounded-full border-2 ${todo.completed ? 'bg-emerald-500 border-emerald-500' : 'border-slate-300'} flex items-center justify-center text-white text-sm font-bold">
                ${todo.completed ? '✓' : ''}
              </div>
              <div class="flex-1">
                <div class="text-[17px] font-semibold ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}">
                  ${parseHyperlinks(todo.text)}
                  ${todo.duration ? `<span class="ml-2 text-xs font-mono text-slate-400">⏱ ${todo.duration}</span>` : ''}
                </div>
                <div class="flex flex-wrap gap-1 mt-1.5">
                  ${(todo.tags || []).map(tag => `<span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-md font-bold">#${tag}</span>`).join('')}
                </div>
                ${backlinks.length > 0 ? `<div class="mt-2 text-[10px] text-indigo-500 font-bold bg-indigo-50 inline-block px-2 py-0.5 rounded">↳ Cité dans : ${backlinks.map(b => `<span class="underline cursor-pointer" onclick="event.stopPropagation(); scrollToTask(${b.id})">${b.text}</span>`).join(', ')}</div>` : ''}
              </div>
              <button onclick="quickAddSubtask(event, ${todo.id})" class="text-slate-400 hover:text-slate-800 text-2xl font-bold px-2 leading-none" title="Ajouter une sous-tâche">+</button>
            </div>

            ${hasSub ? `
              <div class="task-progress-bar w-full bg-slate-100 h-1.5 rounded-full mt-3 overflow-hidden">
                <div class="h-1.5 transition-all ${cColor}" style="width: ${subPct}%"></div>
              </div>
              <div class="subtask-container mt-3 ml-10 border-l-2 border-slate-100 pl-3 space-y-2">
                ${todo.subtasks.map(st => `
                  <div class="flex items-start gap-2 cursor-pointer" onclick="openModal(${st.id}, true, ${todo.id})">
                    <input type="checkbox" ${st.completed ? 'checked' : ''} class="mt-1 accent-slate-900 w-4 h-4" onclick="handleToggle(event, ${st.id}, true, ${todo.id})">
                    <div class="flex-1">
                      <span class="${st.completed ? 'line-through text-slate-400' : 'text-slate-700'} text-sm">${parseHyperlinks(st.text)}</span>
                      ${st.duration ? `<span class="ml-2 text-[10px] font-mono text-slate-400">⏱ ${st.duration}</span>` : ''}
                      <div class="flex gap-1 mt-0.5">${(st.tags || []).map(tag => `<span class="text-[9px] bg-slate-100 text-slate-500 px-1 rounded font-bold">#${tag}</span>`).join('')}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
        listEl.appendChild(li);
        setupSwipe(`swipe-content-${todo.id}`, todo.id);
      });
    }

    function addCategory() {
      const name = prompt('Nouvelle catégorie :');
      if (name) {
        let customCats = JSON.parse(localStorage.getItem('todoapp_custom_cats') || '[]');
        if (!customCats.includes(name)) { customCats.push(name); localStorage.setItem('todoapp_custom_cats', JSON.stringify(customCats)); }
        currentCategory = name; render();
      }
    }

    // --- LOGIQUE DE SWIPE ---
    function setupSwipe(elementId, taskId) {
      const el = document.getElementById(elementId);
      if (!el) return;
      let startX = 0, currentX = 0;
      el.addEventListener('touchstart', e => startX = e.touches[0].clientX, {passive: true});
      el.addEventListener('touchmove', e => {
        currentX = e.touches[0].clientX - startX;
        if (Math.abs(currentX) > 20) { e.preventDefault(); el.style.transform = `translateX(${currentX}px)`; }
      }, {passive: false});
      el.addEventListener('touchend', () => {
        if (currentX > 100) handleToggle({stopPropagation:()=>{}}, taskId); // Valider
        else if (currentX < -150) handleDelete(taskId); // Supprimer
        else if (currentX < -75) handlePause(taskId); // Pause
        el.style.transform = 'translateX(0)'; currentX = 0;
      });
    }

    function toggleSearch() {
      const search = document.getElementById('search-container');
      const input = document.getElementById('search-input');
      search.classList.toggle('hidden');
      if (!search.classList.contains('hidden')) input.focus();
      else { input.value = ''; render(); }
    }

    // --- MODALES (Paramètres & Edition) ---
    function openSettings() { 
      document.getElementById('settings-modal').classList.remove('hidden'); 
      document.getElementById('settings-modal').classList.add('flex'); 
    }
    
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(todos));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", "todoapp_backup.json");
      dlAnchorElem.click();
    }
    
    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          todos = imported; saveLocal();
          alert("Import réussi !"); 
          document.getElementById('settings-modal').classList.add('hidden'); 
          render();
        } catch(err) { alert("Erreur d'importation."); }
      };
      reader.readAsText(file);
    }

    function openModal(id, isSub = false, parentId = null) {
      const todo = isSub ? todos.find(t => t.id === parentId).subtasks.find(s => s.id === id) : todos.find(t => t.id === id);
      document.getElementById('modal-task-id').value = id;
      document.getElementById('modal-is-subtask').value = isSub;
      document.getElementById('modal-parent-id').value = parentId;
      
      document.getElementById('modal-title').value = todo.text;
      document.getElementById('modal-priority').value = todo.priority || 1;
      document.getElementById('modal-duration').value = todo.duration || '';
      document.getElementById('modal-tags').value = (todo.tags || []).join(', ');
      document.getElementById('modal-notes').value = todo.notes || '';

      const catContainer = document.getElementById('cat-container');
      if (isSub) catContainer.style.display = 'none';
      else {
        catContainer.style.display = 'block';
        const catSelect = document.getElementById('modal-category');
        catSelect.innerHTML = extractGlobalCategories().map(c => `<option value="${c}">${c}</option>`).join('');
        catSelect.value = todo.category || 'Général';
      }

      document.getElementById('edit-modal').classList.remove('hidden');
      document.getElementById('edit-modal').classList.add('flex');
    }

    function closeModal() { 
        document.getElementById('edit-modal').classList.add('hidden'); 
        document.getElementById('edit-modal').classList.remove('flex'); 
    }
    
    function closeModalOnOut(e) { 
        if (e.target.id === 'edit-modal') closeModal(); 
    }

    async function saveModalChanges() {
      const id = parseInt(document.getElementById('modal-task-id').value);
      const isSub = document.getElementById('modal-is-subtask').value === 'true';
      const parentId = parseInt(document.getElementById('modal-parent-id').value);
      
      const text = document.getElementById('modal-title').value;
      const priority = parseInt(document.getElementById('modal-priority').value);
      const duration = document.getElementById('modal-duration').value;
      const tags = [...new Set(document.getElementById('modal-tags').value.split(',').map(s => s.trim()).filter(Boolean))]; 
      const notes = document.getElementById('modal-notes').value;

      if (isSub) {
        const parent = todos.find(t => t.id === parentId);
        const sub = parent.subtasks.find(s => s.id === id);
        Object.assign(sub, { text, priority, duration, tags, notes });
        saveLocal();
        await supabaseClient.from('todos').update({ subtasks: parent.subtasks }).eq('id', parentId);
      } else {
        const category = document.getElementById('modal-category').value;
        const todo = todos.find(t => t.id === id);
        Object.assign(todo, { text, category, priority, duration, tags, notes });
        saveLocal();
        await supabaseClient.from('todos').update({ text, category, priority, duration, tags, notes }).eq('id', id);
      }
      closeModal();
    }

    async function quickAddSubtask(e, parentId) {
      e.stopPropagation();
      const text = prompt("Nouvelle sous-tâche :");
      if (!text) return;
      const parent = todos.find(t => t.id === parentId);
      if (!parent.subtasks) parent.subtasks = [];
      parent.subtasks.push({ id: Date.now(), text, completed: false, tags: [], priority: 1, duration: '' });
      saveLocal();
      await supabaseClient.from('todos').update({ subtasks: parent.subtasks }).eq('id', parentId);
    }

    function scrollToTask(id) {
      const el = document.getElementById(`task-${id}`);
      if (el) { 
          el.scrollIntoView({ behavior: 'smooth', block: 'center' }); 
          el.firstElementChild.nextElementSibling.classList.add('ring-4', 'ring-indigo-300'); 
          setTimeout(() => el.firstElementChild.nextElementSibling.classList.remove('ring-4', 'ring-indigo-300'), 1500); 
      }
    }

    loadLocal(); 
    syncCloud();
  </script>
</body>
</html>
