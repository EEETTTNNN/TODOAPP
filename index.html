<!-- TODOAPP - Version 1.0.5 (avec Supabase) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOAPP - v1.0.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 sm:p-8">

  <div class="max-w-md mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-6">
    
    <!-- En-tête -->
    <header class="flex justify-between items-center mb-6">
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-extrabold text-slate-900">TODOAPP</h1>
        <span class="text-xs font-semibold bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full">v1.0.5</span>
      </div>
      <button onclick="syncCloud()" class="p-2 bg-slate-100 hover:bg-slate-200 rounded-xl text-slate-600 text-xs font-semibold transition-colors flex items-center gap-1.5" title="Synchroniser">
        <span id="sync-icon">🔄</span> Sync
      </button>
    </header>

    <!-- Zone de Saisie -->
    <form onsubmit="addTask(event)" class="flex gap-2 mb-6">
      <input 
        type="text" 
        id="task-input" 
        placeholder="Ajouter une tâche..." 
        class="flex-1 bg-slate-50 border border-slate-300 rounded-2xl px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-slate-900"
        required
      >
      <button type="submit" class="bg-slate-900 text-white rounded-2xl px-5 font-bold text-xl hover:bg-slate-800 transition-colors">+</button>
    </form>

    <!-- Liste des tâches -->
    <ul id="task-list" class="space-y-2"></ul>

    <!-- Compteur & Statut -->
    <footer class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400 flex justify-between items-center">
      <span id="task-count">0 tâche</span>
      <span id="sync-status" class="text-emerald-600 font-medium">● Connecté</span>
    </footer>

  </div>

  <script>
    const SUPABASE_URL = "https://bwirwhcetlfwzqswbfwr.supabase.co";
    const SUPABASE_KEY = "sb_publishable_6f1T8ttm3Lc0yTSqsHUikA_XW5eo3X7";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let todos = JSON.parse(localStorage.getItem('todoapp_v105') || '[]');

    function saveLocal() {
      localStorage.setItem('todoapp_v105', JSON.stringify(todos));
      render();
    }

    async function syncCloud() {
      const syncIcon = document.getElementById('sync-icon');
      const syncStatus = document.getElementById('sync-status');
      if (syncIcon) syncIcon.classList.add('animate-spin');
      
      try {
        const { data, error } = await supabaseClient
          .from('todos')
          .select('*')
          .order('id', { ascending: false });

        if (!error && data) {
          todos = data;
          saveLocal();
          if (syncStatus) {
            syncStatus.textContent = "● Synchro OK";
            syncStatus.className = "text-emerald-600 font-medium";
          }
        } else if (error) {
          throw error;
        }
      } catch (err) {
        console.error("Erreur de synchro :", err);
        if (syncStatus) {
          syncStatus.textContent = "● Hors-ligne";
          syncStatus.className = "text-amber-600 font-medium";
        }
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
      }
    }

    async function addTask(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (!text) return;

      const tempId = Date.now();
      const newTodo = {
        id: tempId,
        text: text,
        completed: false
      };

      // 1. Mise à jour locale immédiate
      todos.unshift(newTodo);
      input.value = '';
      saveLocal();

      // 2. Envoi vers Supabase
      const { data, error } = await supabaseClient
        .from('todos')
        .insert([{ text: newTodo.text, completed: false }])
        .select();

      if (!error && data && data[0]) {
        // Remplace l'ID temporaire par l'ID généré par Supabase
        const index = todos.findIndex(t => t.id === tempId);
        if (index !== -1) {
          todos[index] = data[0];
          saveLocal();
        }
      }
    }

    async function toggleTask(id) {
      const todo = todos.find(t => t.id === id);
      if (!todo) return;

      todo.completed = !todo.completed;
      saveLocal();

      await supabaseClient
        .from('todos')
        .update({ completed: todo.completed })
        .eq('id', id);
    }

    async function deleteTask(id) {
      todos = todos.filter(t => t.id !== id);
      saveLocal();

      await supabaseClient
        .from('todos')
        .delete()
        .eq('id', id);
    }

    function render() {
      const listEl = document.getElementById('task-list');
      const countEl = document.getElementById('task-count');
      listEl.innerHTML = '';

      if (todos.length === 0) {
        listEl.innerHTML = `<li class="text-center text-slate-400 text-sm py-8">Aucune tâche pour le moment</li>`;
      } else {
        todos.forEach(todo => {
          const li = document.createElement('li');
          li.className = `flex items-center justify-between p-3 rounded-2xl border transition-all ${todo.completed ? 'bg-slate-50 border-slate-100 opacity-60' : 'bg-white border-slate-200'}`;
          
          li.innerHTML = `
            <div class="flex items-center gap-3 flex-1 min-w-0 mr-2 cursor-pointer" onclick="toggleTask(${todo.id})">
              <input 
                type="checkbox" 
                ${todo.completed ? 'checked' : ''} 
                class="w-5 h-5 accent-slate-900 rounded cursor-pointer"
                onclick="event.stopPropagation(); toggleTask(${todo.id})"
              >
              <span class="text-sm font-medium ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'} truncate">
                ${escapeHtml(todo.text)}
              </span>
            </div>
            <button 
              onclick="deleteTask(${todo.id})" 
              class="text-slate-400 hover:text-rose-500 font-bold px-2 py-1 text-sm rounded-lg transition-colors"
              title="Supprimer"
            >&times;</button>
          `;
          listEl.appendChild(li);
        });
      }

      const activeCount = todos.filter(t => !t.completed).length;
      countEl.textContent = `${activeCount} tâche${activeCount > 1 ? 's' : ''} restante${activeCount > 1 ? 's' : ''}`;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, match => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[match]));
    }

    // Chargement initial
    render();
    syncCloud();
  </script>
</body>
</html>
